  function recolectarSalidasTemprano() {
    // Solo HISTORIAL (no tablero actual). Por cajero: días trabajados y salidas temprano.
    const stats = {}; // nom -> { dias: Set, temprano: Set, fechasTemprano: [] }
    function claveDia(meta, data) {
      const f = (meta && meta.fecha) || (data && data.fecha) || '';
      const tu = (meta && meta.turno) || (data && data.turno) || '';
      return String(f).trim() + '|' + String(tu).trim().toUpperCase();
    }
    function procesar(data, meta) {
      if (!data || !data.plantas) return;
      const kDia = claveDia(meta, data);
      (data.plantas || []).forEach(function (pl) {
        (pl.secciones || []).forEach(function (sec) {
          const tit = (sec.titulo || '').trim().toUpperCase();
          if (tit === 'NOVEDADES' || tit === 'CAJA CENTRAL') return;
          (sec.filas || []).forEach(function (f) {
            const nom = (f && f.nombre || '').trim();
            if (!nom) return;
            if (!stats[nom]) stats[nom] = { dias: new Set(), temprano: new Set(), fechasTemprano: [] };
            stats[nom].dias.add(kDia);
            if (f.temprano) {
              if (!stats[nom].temprano.has(kDia)) {
                stats[nom].temprano.add(kDia);
                const etiqueta = ((meta && meta.fecha) || data.fecha || '') +
                  ' ' + ((meta && meta.turno) || data.turno || '');
                if (etiqueta.trim()) stats[nom].fechasTemprano.push(etiqueta.trim());
              }
            }
          });
        });
      });
    }
    (historial || []).forEach(function (reg) {
      const meta = { fecha: reg.fecha, turno: reg.turno };
      // Solo hoja JEFES (editable). No Cabina ni pestaña Novedades (ya filtrada en procesar).
      if (reg.editable) procesar(reg.editable, meta);
    });
    return stats;
  }

  /** Valor de horas extra según CT y día (Date o string de fecha del tablero) */
  function horasExtraPorCodigo(cod, fechaStrODate, opts) {
    const c = String(cod || '').trim().toUpperCase();
    if (!c) return 0;
    let d = null;
    if (fechaStrODate instanceof Date && !isNaN(fechaStrODate.getTime())) {
      d = fechaStrODate;
    } else if (fechaStrODate) {
      d = (typeof parseFechaHistorial === 'function') ? parseFechaHistorial(fechaStrODate) : null;
    }
    const day = d ? d.getDay() : null; // 0=dom … 4=jue … 6=sáb
    const esDomingo = day === 0;
    const esSabado = day === 6;
    const esJueves = day === 4;
    let esFeriado = !!(opts && opts.feriado);
    try {
      if (!esFeriado && d && d.getFullYear() === 2026 && d.getMonth() === 8) {
        esFeriado = esFeriadoProg(d.getDate());
      }
    } catch (e) {}

    if (c === 'T3') {
      if (esDomingo || esFeriado) return 5;
      if (esSabado) return 3.75;
      return 2.5;
    }
    if (c === 'TE') return 2;
    if (c === 'E') return esJueves ? 4 : 2;
    if (c === 'E1') return 2;
    if (c === 'X') return esJueves ? 5 : 3;
    return 0;
  }

  function _nombreKeyHE(nom) {
    let t = String(nom || '').trim();
    if (typeof normalizarNombreCelda === 'function') t = normalizarNombreCelda(t);
    return t;
  }

  function _nombreCortoHE(nom) {
    let t = _nombreKeyHE(nom);
    return t.replace(/\s*\(\d{4,}\)\s*$/, '').trim() || t;
  }

  /** legajo → nombre desde la grilla de Programación del mes */
  function mapaLegajosProgramacionMes() {
    const out = {};
    try {
      const root = document.getElementById('vista-prog') || document;
      root.querySelectorAll('tr').forEach(function (tr) {
        const legTd = tr.querySelector('td.legajo-cell');
        const nomTd = tr.querySelector('td.nombre-cell');
        if (!legTd || !nomTd) return;
        const leg = String(legTd.textContent || '').trim();
        const nom = String(nomTd.textContent || '').trim();
        if (leg && nom) out[leg] = nom;
      });
    } catch (e) {}
    return out;
  }

  /**
   * Código ORIGINAL del mes (Programación Sept.) para legajo + día.
   * Siempre usa data-code de la grilla (programación base), NO los cambios actuales
   * en localStorage ni el valor del select. Sirve para HE programadas.
   */
  function codigoProgramacionMes(legajo, dia) {
    const leg = String(legajo || '').trim();
    const d = String(dia);
    if (!leg || !d) return '';
    try {
      const root = document.getElementById('vista-prog') || document;
      const td = root.querySelector('td[data-code][data-legajo="' + leg + '"][data-dia="' + d + '"]');
      if (td) {
        return String(td.getAttribute('data-code') || '').trim().toUpperCase();
      }
    } catch (e2) {}
    // Fallback: si la grilla no está en DOM, no inventar desde ediciones (localStorage)
    return '';
  }

  /**
   * Código ACTUAL (con ediciones) del mes — localStorage / select / data-code.
   * No usar para HE programadas.
   */
  function codigoProgramacionMesActual(legajo, dia) {
    const leg = String(legajo || '').trim();
    const d = String(dia);
    if (!leg || !d) return '';
    const key = 'progSept2026_' + leg + '_' + d;
    try {
      const guardado = localStorage.getItem(key);
      if (guardado !== null) return String(guardado).trim().toUpperCase();
    } catch (e) {}
    try {
      const root = document.getElementById('vista-prog') || document;
      const td = root.querySelector('td[data-code][data-legajo="' + leg + '"][data-dia="' + d + '"]');
      if (td) {
        const sel = td.querySelector('select');
        if (sel && sel.value !== undefined && sel.value !== null) return String(sel.value).trim().toUpperCase();
        return String(td.getAttribute('data-code') || '').trim().toUpperCase();
      }
    } catch (e2) {}
    return '';
  }

  /** Fecha real de un día de la programación de septiembre 2026 */
  function fechaProgSept2026(dia) {
    const n = parseInt(dia, 10);
    if (!n || n < 1 || n > 30) return null;
    return new Date(2026, 8, n); // mes 8 = septiembre
  }

  function _fmtFechaCortaHE(d) {
    if (!d || !(d instanceof Date) || isNaN(d.getTime())) return '';
    const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
      'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    return dias[d.getDay()] + ' ' + d.getDate() + ' de ' + meses[d.getMonth()] + ' ' + d.getFullYear();
  }

  /**
   * HE programadas = Programación ORIGINAL del mes (data-code de la grilla, sin ediciones).
   * HE efectivas = solo hojas Jefes (editable) TARDE + NOCHE del historial.
   */
  function _soloDiaMs(d) {
    if (!d || !(d instanceof Date) || isNaN(d.getTime())) return null;
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  }

  /** Fecha límite = ayer (inicio de día local) */
  function fechaHastaAyerHE() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - 1);
    return d;
  }

  /**
   * Período de liquidación de HE: del día 26 del mes anterior al día 25 del mes vigente.
   * Si hoy es >= 26, el período vigente va del 26 de este mes al 25 del próximo.
   * opts.refDate (Date) opcional para fijar el "hoy" de referencia.
   * Devuelve { desde, hasta, label, desdeMs, hastaMs }.
   */
  function periodoLiquidacionHE(refDate) {
    const base = (refDate instanceof Date && !isNaN(refDate.getTime()))
      ? new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate())
      : (function () {
          const n = new Date();
          n.setHours(0, 0, 0, 0);
          return n;
        })();
    const y = base.getFullYear();
    const m = base.getMonth();
    const day = base.getDate();
    let desde, hasta;
    if (day >= 26) {
      // Período abierto: 26 de este mes → 25 del mes siguiente
      desde = new Date(y, m, 26);
      hasta = new Date(y, m + 1, 25);
    } else {
      // 26 del mes anterior → 25 de este mes
      desde = new Date(y, m - 1, 26);
      hasta = new Date(y, m, 25);
    }
    const meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    const label = desde.getDate() + ' ' + meses[desde.getMonth()] + ' ' + desde.getFullYear() +
      ' → ' + hasta.getDate() + ' ' + meses[hasta.getMonth()] + ' ' + hasta.getFullYear();
    return {
      desde: desde,
      hasta: hasta,
      label: label,
      desdeMs: _soloDiaMs(desde),
      hastaMs: _soloDiaMs(hasta)
    };
  }

  /** true si la fecha cae dentro de [desdeMs, hastaMs] inclusive */
  function fechaEnRangoHE(d, desdeMs, hastaMs) {
    const ms = _soloDiaMs(d);
    if (ms == null) return false;
    if (desdeMs != null && ms < desdeMs) return false;
    if (hastaMs != null && ms > hastaMs) return false;
    return true;
  }

  /**
   * opts.hasta = Date → tope superior inclusive (p.ej. ayer).
   * opts.desde = Date → tope inferior inclusive (raro; normalmente usa el período).
   * opts.refDate = Date → ancla del período 26→25.
   * opts.sinPeriodo = true → no aplica ventana 26→25 (solo opts.desde/hasta).
   * Por defecto filtra al período de liquidación vigente (26 mes ant. → 25 mes vig.).
   */
  function calcularRegistroHorasExtra(opts) {
    opts = opts || {};
    let desdeMs = null;
    let hastaMs = null;
    let periodoLabel = '';
    if (!opts.sinPeriodo) {
      const per = periodoLiquidacionHE(opts.refDate || null);
      desdeMs = per.desdeMs;
      hastaMs = per.hastaMs;
      periodoLabel = per.label;
    }
    if (opts.desde) {
      const ms = _soloDiaMs(opts.desde);
      if (ms != null) desdeMs = (desdeMs == null) ? ms : Math.max(desdeMs, ms);
    }
    if (opts.hasta) {
      const ms = _soloDiaMs(opts.hasta);
      if (ms != null) hastaMs = (hastaMs == null) ? ms : Math.min(hastaMs, ms);
    }
    // Exponer para la UI del panel
    window._hePeriodo = { desdeMs: desdeMs, hastaMs: hastaMs, label: periodoLabel };

    const mapa = {}; // key (legajo o nombre) → { nom, corto, legajo, prog, efect, detalle }

    function ensure(key, nom, leg) {
      if (!mapa[key]) {
        mapa[key] = {
          nom: nom || key,
          corto: _nombreCortoHE(nom || key),
          legajo: leg || '',
          prog: 0,
          progActual: 0,
          efect: 0,
          detalle: []
        };
      }
      return mapa[key];
    }

    // —— 1) PROGRAMADAS: grilla del mes ——
    const legNombres = mapaLegajosProgramacionMes();
    const legajos = Object.keys(legNombres);
    // Si la grilla no está en DOM, recolectar legajos desde localStorage
    if (!legajos.length) {
      try {
        const pref = 'progSept2026_';
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || k.indexOf(pref) !== 0 || k === 'progSept2026_SNAPSHOT') continue;
          const rest = k.slice(pref.length);
          const parts = rest.split('_');
          if (parts.length < 2) continue;
          const leg = parts[0];
          if (leg && !legNombres[leg]) legNombres[leg] = leg;
        }
      } catch (e) {}
    }
    Object.keys(legNombres).forEach(function (leg) {
      const nom = legNombres[leg] || leg;
      const key = leg;
      const rec = ensure(key, nom + (leg ? ' (' + leg + ')' : ''), leg);
      for (let dia = 1; dia <= 30; dia++) {
        const fDate = fechaProgSept2026(dia);
        if (!fechaEnRangoHE(fDate, desdeMs, hastaMs)) continue;
        const ctOrig = codigoProgramacionMes(leg, dia);
        if (ctOrig) {
          const heO = horasExtraPorCodigo(ctOrig, fDate, null);
          if (heO) {
            rec.prog += heO;
            rec.detalle.push({
              fecha: _fmtFechaCortaHE(fDate) || ('Día ' + dia),
              turno: 'PROG',
              caja: 'Programación original',
              ct: ctOrig,
              he: heO,
              tipo: 'prog',
              dia: dia
            });
          }
        }
        const ctAct = (typeof codigoProgramacionMesActual === 'function')
          ? codigoProgramacionMesActual(leg, dia)
          : ctOrig;
        if (ctAct) {
          const heA = horasExtraPorCodigo(ctAct, fDate, null);
          if (heA) {
            rec.progActual += heA;
            rec.detalle.push({
              fecha: _fmtFechaCortaHE(fDate) || ('Día ' + dia),
              turno: 'PROG',
              caja: 'Programación actual',
              ct: ctAct,
              he: heA,
              tipo: 'progActual',
              dia: dia
            });
          }
        }
      }
    });

    // Índice legajo → key y nombre → key para cruzar con Jefes
    const byLeg = {};
    const byNomNorm = {};
    Object.keys(mapa).forEach(function (k) {
      const r = mapa[k];
      if (r.legajo) byLeg[r.legajo] = k;
      const nk = _nombreKeyHE(r.nom).replace(/\s*\(\d{4,}\)\s*$/, '').trim().toUpperCase();
      if (nk) byNomNorm[nk] = k;
    });

    function keyParaNombreJefes(nombreFila) {
      const nom = _nombreKeyHE(nombreFila);
      if (!nom) return null;
      const leg = (typeof extraerLegajo === 'function') ? extraerLegajo(nom) : null;
      if (leg && byLeg[leg]) return byLeg[leg];
      if (leg) {
        // empleado solo en Jefes, no en prog con nombre
        const key = 'L:' + leg;
        ensure(key, nom, leg);
        byLeg[leg] = key;
        return key;
      }
      const nk = nom.replace(/\s*\(\d{4,}\)\s*$/, '').trim().toUpperCase();
      if (byNomNorm[nk]) return byNomNorm[nk];
      const key = 'N:' + nk;
      ensure(key, nom, '');
      byNomNorm[nk] = key;
      return key;
    }

    function sumarEfectivasJefes(data, fechaStr, turnoHoja) {
      if (!data || !data.plantas) return;
      const fecha = fechaStr || data.fecha || '';
      {
        const fd = (typeof parseFechaHistorial === 'function') ? parseFechaHistorial(fecha) : null;
        if (fd && !fechaEnRangoHE(fd, desdeMs, hastaMs)) return;
      }
      // Un cajero en varias cajas el mismo día/turno (ej. pago + venta tickets) → una sola vez
      const porPersona = {}; // key → { nom, ct, he, cajas: [] }
      (data.plantas || []).forEach(function (p) {
        (p.secciones || []).forEach(function (sec) {
          const tit = String(sec.titulo || '').trim().toUpperCase();
          if (tit === 'NOVEDADES') return;
          let ultimoCt = ''; // herencia: CT vacío toma el superior de la sección
          (sec.filas || []).forEach(function (f) {
            const ctFila = String((f && f.turno) || '').trim().toUpperCase();
            if (ctFila) ultimoCt = ctFila;
            const ct = ctFila || ultimoCt;
            const nom = _nombreKeyHE(f && f.nombre);
            if (!nom) return;
            const he = horasExtraPorCodigo(ct, fecha, null);
            if (!he) return;
            const key = keyParaNombreJefes(nom);
            if (!key) return;
            const prev = porPersona[key];
            if (!prev) {
              porPersona[key] = { nom: nom, ct: ct, he: he, cajas: [tit] };
            } else {
              if (tit && prev.cajas.indexOf(tit) < 0) prev.cajas.push(tit);
              // Si hubiera distintos CT, nos quedamos con el de mayor HE
              if (he > prev.he) {
                prev.he = he;
                prev.ct = ct;
              }
            }
          });
        });
      });
      Object.keys(porPersona).forEach(function (key) {
        const info = porPersona[key];
        const rec = mapa[key];
        if (!rec) return;
        rec.efect += info.he;
        if (info.nom && (!rec.nom || rec.nom === rec.legajo)) {
          rec.nom = info.nom;
          rec.corto = _nombreCortoHE(info.nom);
        }
        rec.detalle.push({
          fecha: fecha,
          turno: turnoHoja || '',
          caja: info.cajas.join(' + '),
          ct: info.ct,
          he: info.he,
          tipo: 'efect'
        });
      });
    }

    // —— 2) EFECTIVAS: solo Jefes (editable) TARDE + NOCHE ——
    (historial || []).forEach(function (reg) {
      if (!reg || !reg.editable) return;
      const t = String(reg.turno || 'TARDE').trim().toUpperCase();
      sumarEfectivasJefes(reg.editable, reg.fecha, t);
    });

    // Cache actual si no está en historial
    try {
      if (typeof cacheFecha !== 'undefined' && cacheFecha) {
        ['TARDE', 'NOCHE'].forEach(function (t) {
          const pack = cacheFecha[t];
          if (!pack || !pack.editable) return;
          const f = (pack.editable && pack.editable.fecha) ||
            (pack.original && pack.original.fecha) ||
            (originalData && originalData.fecha) || '';
          const clave = (typeof normalizarFechaClave === 'function') ? normalizarFechaClave(f) : f;
          const ya = (historial || []).some(function (r) {
            if (!r || !r.editable) return false;
            const rk = (typeof normalizarFechaClave === 'function') ? normalizarFechaClave(r.fecha) : r.fecha;
            return rk === clave && String(r.turno || '').trim().toUpperCase() === t;
          });
          if (ya) return;
          sumarEfectivasJefes(pack.editable, f, t);
        });
      }
    } catch (e) {}

    // Jefes en memoria (editableData) si no hay nada más
    if (editableData && (!(historial && historial.length))) {
      const t = (editableData.turno || document.getElementById('turno-display')?.value || 'TARDE');
      sumarEfectivasJefes(editableData, editableData.fecha, t);
    }

    return Object.keys(mapa).map(function (k) { return mapa[k]; })
      .filter(function (r) { return r.prog > 0 || r.progActual > 0 || r.efect > 0; })
      .sort(function (a, b) {
        const d = (b.efect - a.efect) || (b.prog - a.prog);
        if (d) return d;
        return a.corto.localeCompare(b.corto, 'es');
      });
  }

  function cerrarPanelHorasExtra() {
    const p = document.getElementById('panel-horas-extra');
    if (p) p.classList.remove('visible');
  }

  function toggleMaximizarPanelHE() {
    const box = document.getElementById('panel-horas-extra-box');
    if (box) box.classList.toggle('maximizado');
  }

  function _fmtNumHE(n) {
    return Math.round(Number(n) * 100) / 100;
  }

  function mostrarDetalleHorasExtra(idx, tipo, origen) {
    const rows = (origen === 'ayer') ? (window._heRowsAyer || []) : (window._heRows || []);
    const r = rows[idx];
    const body = document.getElementById('panel-horas-extra-body');
    if (!r || !body) return;
    const esProg = tipo === 'prog';
    const esProgAct = tipo === 'progActual';
    const lista = (r.detalle || []).filter(function (d) { return d.tipo === tipo; });
    const perLab = (window._hePeriodo && window._hePeriodo.label) ? window._hePeriodo.label : '26→25';
    const titulo = esProg
      ? ('HE prog. original (' + perLab + ') — ' + r.corto)
      : (esProgAct
        ? ('HE prog. actual (' + perLab + ') — ' + r.corto)
        : ('HE efectivas (' + perLab + ') — ' + r.corto));
    const total = esProg ? r.prog : (esProgAct ? (r.progActual || 0) : r.efect);

    const grupos = {};
    lista.forEach(function (d) {
      const k = String(d.fecha || '') + '|' + String(d.turno || '');
      if (!grupos[k]) grupos[k] = { fecha: d.fecha || '', turno: d.turno || '', items: [], he: 0 };
      grupos[k].items.push(d);
      grupos[k].he += d.he;
    });
    const orden = Object.keys(grupos).map(function (k) { return grupos[k]; });
    orden.sort(function (a, b) {
      const da = (typeof parseFechaHistorial === 'function') ? parseFechaHistorial(a.fecha) : null;
      const db = (typeof parseFechaHistorial === 'function') ? parseFechaHistorial(b.fecha) : null;
      if (da && db) return db - da;
      if (da) return -1;
      if (db) return 1;
      // días de prog (número)
      const na = parseInt(a.items[0] && a.items[0].dia, 10);
      const nb = parseInt(b.items[0] && b.items[0].dia, 10);
      if (!isNaN(na) && !isNaN(nb)) return nb - na;
      return String(b.fecha).localeCompare(String(a.fecha));
    });

    let html = '<div style="margin-bottom:8px">' +
      '<button type="button" class="btn" style="min-width:auto;min-height:28px;padding:4px 10px;font-size:0.85rem;background:#5c4033" ' +
      'onclick="abrirPanelHorasExtra()">← Volver</button></div>';
    html += '<p style="font-weight:800;color:#5c4033;margin:4px 0 10px;font-size:0.95rem">' + titulo +
      ' <span style="font-weight:600;color:#888">(' + _fmtNumHE(total) + ' hs)</span></p>';

    if (!orden.length) {
      html += '<p style="color:#666;font-size:0.85rem">Sin detalle de fechas.</p>';
    } else {
      html += '<div class="rank-wrap"><table><thead><tr>' +
        '<th>Fecha</th><th>Turno</th><th>Caja / origen</th><th>CT</th><th class="num">HE</th>' +
        '</tr></thead><tbody>';
      orden.forEach(function (g) {
        g.items.forEach(function (it, i) {
          html += '<tr>' +
            (i === 0
              ? ('<td rowspan="' + g.items.length + '">' + String(g.fecha || '—') + '</td>' +
                 '<td rowspan="' + g.items.length + '">' + String(g.turno || '—') + '</td>')
              : '') +
            '<td>' + String(it.caja || '—') + '</td>' +
            '<td style="text-align:center;font-weight:700">' + String(it.ct || '') + '</td>' +
            '<td class="num">' + _fmtNumHE(it.he) + '</td>' +
            '</tr>';
        });
      });
      html += '</tbody></table></div>';
      html += '<p style="margin-top:8px;font-size:0.75rem;color:#888">' +
        (esProg
          ? 'Origen: Programación original (data-code de la grilla).'
          : (esProgAct
            ? 'Origen: Programación actual (incluye ediciones guardadas).'
            : 'Origen: hojas Jefes TARDE y NOCHE (lo que realmente ocurrió).')) +
        '</p>';
    }
    body.innerHTML = html;
  }

  function abrirPanelHorasExtra() {
    const panel = document.getElementById('panel-horas-extra');
    const body = document.getElementById('panel-horas-extra-body');
    if (!panel || !body) return;
    const rows = calcularRegistroHorasExtra(); // período 26→25 vigente
    window._heRows = rows;
    window._heSort = window._heSort || { col: 'efect', dir: 'desc' };
    renderTablaHorasExtra();
    panel.classList.add('visible');
  }

  function ordenarFilasHE(rows, col, dir) {
    const mult = dir === 'asc' ? 1 : -1;
    const arr = (rows || []).slice();
    arr.sort(function (a, b) {
      let cmp = 0;
      if (col === 'nom') {
        cmp = String(a.corto || '').localeCompare(String(b.corto || ''), 'es', { sensitivity: 'base' });
      } else if (col === 'prog') {
        cmp = (a.prog || 0) - (b.prog || 0);
      } else if (col === 'progActual') {
        cmp = (a.progActual || 0) - (b.progActual || 0);
      } else if (col === 'efect') {
        cmp = (a.efect || 0) - (b.efect || 0);
      } else if (col === 'dif') {
        cmp = ((a.efect || 0) - (a.prog || 0)) - ((b.efect || 0) - (b.prog || 0));
      } else {
        cmp = (a.efect || 0) - (b.efect || 0);
      }
      if (cmp !== 0) return cmp * mult;
      return String(a.corto || '').localeCompare(String(b.corto || ''), 'es', { sensitivity: 'base' });
    });
    return arr;
  }

  function setOrdenHE(col) {
    const cur = window._heSort || { col: 'efect', dir: 'desc' };
    if (cur.col === col) {
      cur.dir = cur.dir === 'asc' ? 'desc' : 'asc';
    } else {
      cur.col = col;
      // Nombres: A→Z por defecto; números: mayor primero
      cur.dir = (col === 'nom') ? 'asc' : 'desc';
    }
    window._heSort = cur;
    renderTablaHorasExtra();
  }

  function _flechaOrdenHE(col) {
    const cur = window._heSort || {};
    if (cur.col !== col) return ' <span style="opacity:0.35;font-size:0.75em">↕</span>';
    return cur.dir === 'asc'
      ? ' <span style="font-size:0.85em">▲</span>'
      : ' <span style="font-size:0.85em">▼</span>';
  }

  function renderTablaHorasExtra() {
    const body = document.getElementById('panel-horas-extra-body');
    if (!body) return;
    const rowsAll = window._heRows || [];
    const sort = window._heSort || { col: 'efect', dir: 'desc' };
    const rows = ordenarFilasHE(rowsAll, sort.col, sort.dir);

    const perInfo = (typeof periodoLiquidacionHE === 'function') ? periodoLiquidacionHE() : null;
    const perTxt = (perInfo && perInfo.label) ? perInfo.label : '26 mes ant. → 25 mes vig.';

    if (!rowsAll.length) {
      body.innerHTML = '<p style="font-size:0.82rem;color:#5c4033;font-weight:700;margin:0 0 6px">Período: ' + perTxt + '</p>' +
        '<p style="color:#666;padding:8px 0;font-size:0.85rem">No hay horas extra en este período.<br>' +
        '<b>Prog.</b> = Programación original · <b>Efect.</b> = Jefes (TARDE+NOCHE) del historial.</p>' +
        '<p style="font-size:0.78rem;color:#888;margin-top:8px">T3 2,5 / 3,75 sáb / 5 dom · TE 2 · E 2 (jue 4) · E1 2 · X 3 (jue 5).</p>';
      return;
    }

    let totP = 0, totPAct = 0, totE = 0;
    rowsAll.forEach(function (r) {
      totP += r.prog || 0;
      totPAct += r.progActual || 0;
      totE += r.efect || 0;
    });

    const thStyle = 'cursor:pointer;user-select:none;white-space:nowrap';
    let html = '<p style="font-size:0.82rem;color:#5c4033;font-weight:700;margin:0 0 8px">Período: ' + perTxt + '</p>' +
      '<div class="rank-wrap"><table><thead><tr>' +
      '<th style="' + thStyle + '" title="Ordenar por nombre" onclick="event.stopPropagation();setOrdenHE(\'nom\')">Empleado' + _flechaOrdenHE('nom') + '</th>' +
      '<th class="num" style="' + thStyle + '" title="HE según programación original" onclick="event.stopPropagation();setOrdenHE(\'prog\')">HE orig.' + _flechaOrdenHE('prog') + '</th>' +
      '<th class="num" style="' + thStyle + '" title="HE según programación actual (con ediciones)" onclick="event.stopPropagation();setOrdenHE(\'progActual\')">HE actual' + _flechaOrdenHE('progActual') + '</th>' +
      '<th class="num" style="' + thStyle + '" title="Ordenar por HE efectivas" onclick="event.stopPropagation();setOrdenHE(\'efect\')">HE efect.' + _flechaOrdenHE('efect') + '</th>' +
      '<th class="num" style="' + thStyle + '" title="Diferencia: efectivas − original" onclick="event.stopPropagation();setOrdenHE(\'dif\')">Dif.' + _flechaOrdenHE('dif') + '</th>' +
      '</tr></thead><tbody>';

    rows.forEach(function (r) {
      // índice original en _heRows para el detalle
      const idx = rowsAll.indexOf(r);
      const dif = r.efect - r.prog;
      const difStr = (dif > 0 ? '+' : '') + _fmtNumHE(dif);
      const difColor = dif > 0 ? '#5e35b1' : (dif < 0 ? '#c62828' : '#666');
      html += '<tr>' +
        '<td title="' + String(r.nom).replace(/"/g, '&quot;') + '">' + r.corto + '</td>' +
        '<td class="num" style="cursor:pointer;text-decoration:underline;color:#1565c0" ' +
        'title="Detalle HE programación original" onclick="event.stopPropagation();mostrarDetalleHorasExtra(' + idx + ',\'prog\')">' +
        _fmtNumHE(r.prog) + '</td>' +
        '<td class="num" style="cursor:pointer;text-decoration:underline;color:#5e35b1" ' +
        'title="Detalle HE programación actual" onclick="event.stopPropagation();mostrarDetalleHorasExtra(' + idx + ',\'progActual\')">' +
        _fmtNumHE(r.progActual || 0) + '</td>' +
        '<td class="num" style="cursor:pointer;text-decoration:underline;color:#6a1b9a" ' +
        'title="Ver fechas en Jefes (efectivo)" onclick="event.stopPropagation();mostrarDetalleHorasExtra(' + idx + ',\'efect\')">' +
        _fmtNumHE(r.efect) + '</td>' +
        '<td class="num" style="color:' + difColor + ';font-weight:700">' + difStr + '</td>' +
        '</tr>';
    });
    html += '<tr style="font-weight:800;background:#f0e9dc">' +
      '<td>TOTAL</td>' +
      '<td class="num">' + _fmtNumHE(totP) + '</td>' +
      '<td class="num">' + _fmtNumHE(totPAct) + '</td>' +
      '<td class="num">' + _fmtNumHE(totE) + '</td>' +
      '<td class="num">' + ((totE - totP > 0 ? '+' : '') + _fmtNumHE(totE - totP)) + '</td>' +
      '</tr></tbody></table></div>';
    html += '<p style="margin-top:10px;font-size:0.72rem;color:#888;max-width:420px">' +
      'Clic en el <b>título de columna</b> para ordenar (▲/▼).<br>' +
      'Clic en los totales de cada fila para el detalle por fecha.<br>' +
      '<b>HE orig.</b> = programación original · <b>HE actual</b> = con ediciones · <b>Efect.</b> = Jefes TARDE+NOCHE.<br>' +
      '<b>Dif.</b> = efectivas − original. Período: 26 mes ant. → 25 mes vig.</p>';

    // —— Hasta ayer (dentro del período 26→25): solo totales ——
    try {
      const per = (typeof periodoLiquidacionHE === 'function') ? periodoLiquidacionHE() : null;
      const hasta = (typeof fechaHastaAyerHE === 'function') ? fechaHastaAyerHE() : null;
      const rowsAyer = (typeof calcularRegistroHorasExtra === 'function')
        ? calcularRegistroHorasExtra({ hasta: hasta })
        : [];
      let totOrigA = 0, totActA = 0, totEA = 0;
      (rowsAyer || []).forEach(function (r) {
        totOrigA += r.prog || 0;
        totActA += r.progActual || 0;
        totEA += r.efect || 0;
      });
      const hastaLabel = hasta
        ? (hasta.getDate() + '/' + (hasta.getMonth() + 1) + '/' + hasta.getFullYear())
        : 'ayer';
      const perLabel = (per && per.label) ? per.label : '26 mes ant. → 25 mes vig.';
      const difA = totEA - totOrigA;
      const difAStr = (difA > 0 ? '+' : '') + _fmtNumHE(difA);
      const difAColor = difA > 0 ? '#5e35b1' : (difA < 0 ? '#c62828' : '#666');
      html += '<hr style="border:none;border-top:1px solid #d4c4a8;margin:16px 0 10px">';
      html += '<p style="font-weight:800;color:#5c4033;margin:0 0 8px;font-size:0.9rem">' +
        'Totales del período hasta ayer <span style="font-weight:600;color:#888">(' + hastaLabel + ' inclusive)</span></p>';
      html += '<p style="font-size:0.78rem;color:#7a6a55;margin:0 0 8px">Período: ' + perLabel + '</p>';
      html += '<div class="rank-wrap"><table><thead><tr>' +
        '<th>Concepto</th><th class="num">Horas</th></tr></thead><tbody>';
      html += '<tr><td>HE prog. original</td><td class="num" style="color:#1565c0;font-weight:700">' + _fmtNumHE(totOrigA) + '</td></tr>';
      html += '<tr><td>HE prog. actual</td><td class="num" style="color:#5e35b1;font-weight:700">' + _fmtNumHE(totActA) + '</td></tr>';
      html += '<tr><td>HE efectivas</td><td class="num" style="color:#6a1b9a;font-weight:700">' + _fmtNumHE(totEA) + '</td></tr>';
      html += '<tr style="font-weight:800;background:#f0e9dc"><td>Dif. (efect. − orig.)</td><td class="num" style="color:' + difAColor + '">' + difAStr + '</td></tr>';
      html += '</tbody></table></div>';
    } catch (eAyer) {
      console.warn('HE hasta ayer', eAyer);
    }

    body.innerHTML = html;
  }

  function abrirRankingSalidasTemprano() {
    const panel = document.getElementById('panel-ranking-temprano');
    const body = document.getElementById('panel-ranking-temprano-body');
    if (!panel || !body) return;
    const stats = recolectarSalidasTemprano();
    const rows = Object.keys(stats).map(function (nom) {
      const dias = stats[nom].dias.size;
      const n = stats[nom].temprano.size;
      const pct = dias > 0 ? (n * 100 / dias) : 0;
      return {
        nom: nom,
        n: n,
        dias: dias,
        pct: pct,
        fechas: stats[nom].fechasTemprano || []
      };
    }).filter(function (r) {
      return r.n > 0; // solo quienes tuvieron al menos una salida temprano
    }).sort(function (a, b) {
      if (b.pct !== a.pct) return b.pct - a.pct;
      if (b.n !== a.n) return b.n - a.n;
      return a.nom.localeCompare(b.nom, 'es');
    });
    if (!rows.length) {
      body.innerHTML = '<p style="color:#666;padding:8px 0;font-size:0.85rem">No hay salidas temprano en el <b>historial</b>.<br>Marcá en Jefes (doble clic) y <b>guardá</b> para que cuente.</p>';
    } else {
      let html = '<table><thead><tr>' +
        '<th class="num">#</th><th>Cajero</th><th class="num">ET</th><th class="num">Días</th><th class="num">%</th>' +
        '</tr></thead><tbody>';
      rows.forEach(function (r, i) {
        const det = r.fechas.slice(0, 10).join(' · ') + (r.fechas.length > 10 ? ' …' : '');
        const pctTxt = (Math.round(r.pct * 10) / 10).toFixed(1).replace(/\.0$/, '') + '%';
        html += '<tr title="' + det.replace(/"/g, '&quot;') + '">' +
          '<td class="num">' + (i + 1) + '</td>' +
          '<td class="nom-rank">' + r.nom + '</td>' +
          '<td class="num"><b>' + r.n + '</b></td>' +
          '<td class="num">' + r.dias + '</td>' +
          '<td class="num"><b>' + pctTxt + '</b></td></tr>';
      });
      html += '</tbody></table>';
      html = '<div class="rank-wrap">' + html + '</div>' +
        '<p style="margin-top:10px;font-size:0.75rem;color:#888;max-width:280px">Solo historial · Jefes (sin Novedades/Caja Central). Hover = fechas ET.</p>';
      body.innerHTML = html;
    }
    const box = document.getElementById('panel-ranking-temprano-box');
    if (box) box.classList.remove('maximizado');
    panel.classList.add('visible');
  }

function abrirPanelCajerosDia() {
    const panel = document.getElementById('panel-cajeros-dia');
    const body = document.getElementById('panel-cajeros-dia-body');
    const tit = document.getElementById('panel-cajeros-dia-titulo');
    if (!panel || !body) return;
    const info = (typeof infoFechaTablero === 'function') ? infoFechaTablero() : null;
    if (!info || info.mes !== 8) {
      alert('El panel de cajeros del día usa la Programación de septiembre.\nElegí una fecha de septiembre.');
      return;
    }

    try {
      if (typeof guardarEstadoActualEnCache === 'function') guardarEstadoActualEnCache();
    } catch (e) {}

    const mapa = mapaProgramacionDelDia(info.dia);
    const ya = obtenerNombresYaProgramadosEnFecha();
    const skip = { '':1, 'F':1, 'BLOQ':1, '?':1, 'LAO':1, 'FC':1, 'DV':1 };

    const porLegajo = {};
    (nombresPermitidos || []).forEach(function (nom) {
      const leg = extraerLegajo(nom);
      if (leg) porLegajo[leg] = nom;
    });
    const legajosAsignados = new Set();
    ya.forEach(function (nYa) {
      const leg = extraerLegajo(nYa);
      if (leg) legajosAsignados.add(leg);
    });

    // legajos/nombres que SÍ tienen código de trabajo ese día en la programación
    const enProgLegs = new Set();
    const enProgNoms = new Set();
    Object.keys(mapa).forEach(function (leg) {
      const cod = (mapa[leg] || '').trim().toUpperCase();
      if (!cod || skip[cod]) return;
      enProgLegs.add(leg);
      const nom = porLegajo[leg];
      if (nom) enProgNoms.add(nom);
    });

    const grupos = {};
    Object.keys(mapa).forEach(function (leg) {
      const cod = (mapa[leg] || '').trim().toUpperCase();
      if (!cod || skip[cod]) return;
      if (!grupos[cod]) grupos[cod] = [];
      const nom = porLegajo[leg] || ('(' + leg + ')');
      const asg = ya.has(nom) || legajosAsignados.has(leg);
      grupos[cod].push({ leg: leg, nom: nom, asignado: asg });
    });

    // Asignados en el tablero que NO estaban en programación de trabajo ese día
    const fuera = [];
    ya.forEach(function (nom) {
      const leg = extraerLegajo(nom);
      const okLeg = leg && enProgLegs.has(leg);
      const okNom = enProgNoms.has(nom);
      if (!okLeg && !okNom) {
        fuera.push(nom);
      }
    });
    fuera.sort(function (a, b) { return a.localeCompare(b, 'es'); });

    // También: asignados cuyo código de turno en tablero no coincide con el de programación
    const otroTurno = [];
    function recolectarAsignadosConTurno(data, dest) {
      if (!data || !data.plantas) return;
      (data.plantas || []).forEach(function (pl) {
        (pl.secciones || []).forEach(function (sec) {
          const tit = (sec.titulo || '').trim().toUpperCase();
          if (tit === 'NOVEDADES' || tit === 'CAJA CENTRAL') return;
          let ultimo = '';
          (sec.filas || []).forEach(function (f) {
            const tu = (f.turno || '').trim().toUpperCase();
            if (tu) ultimo = tu;
            const nom = (f.nombre || '').trim();
            if (!nom) return;
            dest.push({ nom: nom, turno: ultimo || tu });
          });
        });
      });
    }
    const asignadosDetalle = [];
    try {
      if (typeof capturarDatosActuales === 'function' && (modo === 'editable' || (modo === 'original' && (!originalBloqueado || !!edicionTrasDesbloqueoCierre)))) {
        recolectarAsignadosConTurno(capturarDatosActuales(), asignadosDetalle);
      } else {
        recolectarAsignadosConTurno(editableData || originalData, asignadosDetalle);
      }
      if (cacheFecha) {
        ['TARDE', 'NOCHE'].forEach(function (t) {
          if (cacheFecha[t] && cacheFecha[t].editable) {
            recolectarAsignadosConTurno(cacheFecha[t].editable, asignadosDetalle);
          }
        });
      }
    } catch (e) {}

    const vistosOtro = new Set();
    asignadosDetalle.forEach(function (it) {
      const leg = extraerLegajo(it.nom);
      if (!leg || !mapa[leg]) return;
      const codProg = (mapa[leg] || '').trim().toUpperCase();
      if (!codProg || skip[codProg]) return;
      const tu = (it.turno || '').trim().toUpperCase();
      if (!tu) return;
      // Si el turno del tablero no coincide con el código de programación
      if (tu !== codProg && !vistosOtro.has(it.nom)) {
        // no listar si ya está en "fuera"
        if (fuera.indexOf(it.nom) >= 0) return;
        vistosOtro.add(it.nom);
        otroTurno.push({ nom: it.nom, turno: tu, prog: codProg });
      }
    });
    otroTurno.sort(function (a, b) { return a.nom.localeCompare(b.nom, 'es'); });

    const turnoVistaCaj = (document.getElementById('turno-display')?.value || 'TARDE').trim().toUpperCase();
    const codsPermitidos = (turnoVistaCaj === 'NOCHE')
      ? { 'N':1, 'E1':1, 'E':1, 'X':1, 'NP':1 }
      : { 'MD':1, 'MS':1, 'T3':1, 'T':1, 'TE':1, 'TP':1, 'IN':1 };
    const orden = ['MD','MS','T3','T','TE','TP','IN','N','E','E1','X','NP','14F','F14'];
    const cods = Object.keys(grupos).filter(function (c) {
      return !!codsPermitidos[c];
    }).sort(function (a, b) {
      const ia = orden.indexOf(a); const ib = orden.indexOf(b);
      if (ia < 0 && ib < 0) return a.localeCompare(b);
      if (ia < 0) return 1;
      if (ib < 0) return -1;
      return ia - ib;
    });

    body.innerHTML = '';
    let totalProg = 0;
    let totalFaltan = 0;

    if (!cods.length) {
      body.innerHTML = '<p style="padding:16px;color:#666">No hay códigos de programación para el día ' + info.dia + '.</p>';
    } else {
      cods.forEach(function (cod) {
        const col = document.createElement('div');
        col.className = 'col-turno-dia';
        const estilo = estiloChipCodigoProg(cod);

        const h = document.createElement('h4');
        h.textContent = cod;
        h.style.background = estilo.bg;
        h.style.color = estilo.fg;
        h.style.borderBottom = '1px solid rgba(0,0,0,0.12)';
        col.appendChild(h);

        const ul = document.createElement('ul');
        const lista = grupos[cod].slice().sort(function (a, b) {
          return a.nom.localeCompare(b.nom, 'es');
        });
        let visibles = 0;
        lista.forEach(function (it) {
          totalProg++;
          const li = document.createElement('li');
          li.textContent = it.nom;
          const hexNom = (typeof colorHexPorCodigoTurno === 'function')
            ? colorHexPorCodigoTurno(cod)
            : ((estilo.fg === '#ffffff') ? '#1f1a14' : estilo.fg);
          li.style.color = hexNom;
          li.style.fontWeight = '700';
          if (it.asignado) {
            li.className = 'asignado';
          } else {
            visibles++;
            totalFaltan++;
          }
          ul.appendChild(li);
        });
        col.appendChild(ul);

        if (visibles === 0) {
          const vac = document.createElement('div');
          vac.style.cssText = 'padding:8px;font-size:0.8rem;color:#888;text-align:center';
          vac.textContent = 'Todos asignados';
          col.appendChild(vac);
        } else {
          const cont = document.createElement('div');
          cont.style.cssText = 'padding:4px 8px;font-size:0.75rem;color:#7a6a55;text-align:center;border-top:1px solid #eee';
          cont.textContent = visibles + ' pendiente' + (visibles === 1 ? '' : 's');
          col.appendChild(cont);
        }
        body.appendChild(col);
      });
    }

    // Columna de alertas: fuera de programación / otro turno
    if (fuera.length || otroTurno.length) {
      const col = document.createElement('div');
      col.className = 'col-turno-dia col-fuera-prog';
      col.style.border = '2px solid #e65100';
      const h = document.createElement('h4');
      h.textContent = '⚠ Revisar';
      h.style.background = '#fff3e0';
      h.style.color = '#e65100';
      col.appendChild(h);
      const ul = document.createElement('ul');
      fuera.forEach(function (nom) {
        const li = document.createElement('li');
        li.textContent = nom;
        li.style.color = '#c62828';
        li.style.fontWeight = '700';
        li.title = 'Asignado en el tablero pero no figuraba en la programación de trabajo de este día';
        const tag = document.createElement('div');
        tag.style.cssText = 'font-size:0.68rem;font-weight:700;color:#e65100;margin-top:1px';
        tag.textContent = 'no estaba programado';
        li.appendChild(tag);
        ul.appendChild(li);
      });
      otroTurno.forEach(function (it) {
        const li = document.createElement('li');
        li.textContent = it.nom;
        li.style.color = '#e65100';
        li.style.fontWeight = '700';
        li.title = 'En programación: ' + it.prog + ' · En tablero: ' + it.turno;
        const tag = document.createElement('div');
        tag.style.cssText = 'font-size:0.68rem;font-weight:700;color:#bf360c;margin-top:1px';
        tag.textContent = 'prog ' + it.prog + ' → tablero ' + it.turno;
        li.appendChild(tag);
        ul.appendChild(li);
      });
      col.appendChild(ul);
      body.appendChild(col);
    }

    if (tit) {
      let extra = '';
      const nAlert = fuera.length + otroTurno.length;
      if (nAlert) extra = ' · ⚠ ' + nAlert + ' a revisar';
      tit.textContent = 'Cajeros programados · día ' + info.dia + '/9  ·  faltan ' + totalFaltan + ' de ' + totalProg + extra;
    }
    panel.classList.add('visible');
  }


  /**

   * (TARDE + NOCHE, Cabina + Jefes). También saca la fecha del historial/borrador.
   */
  async function limpiarDatosDiaActual() {
    if (!(await exigirAdmin('Se requiere permiso de administrador para borrar el día'))) return;

    const fechaTxt = (
      (originalData && originalData.fecha) ||
      (editableData && editableData.fecha) ||
      (document.getElementById('fecha') && document.getElementById('fecha').value) ||
      ''
    ).trim();
    if (!fechaTxt) {
      alert('No hay una fecha cargada para borrar.');
      return;
    }
    const clave = (typeof normalizarFechaClave === 'function')
      ? normalizarFechaClave(fechaTxt)
      : fechaTxt.toUpperCase();

    const ok = confirm(
      '¿Borrar TODOS los datos del día?\n\n' +

      // Estado vivo → TARDE vacía en Cabina

        render(data, modo === 'editable' && typeof hojaJefesEditable === 'function' ? hojaJefesEditable() : !originalBloqueado);

try { registrarAuditoria('borrar_dia', 'Borró todos los datos del día: ' + fechaTxt); } catch (eA) {}

  function textoHTDesdeModal(pIdx, soloSeccion, soloNombre) {
    const dataRef = editableData || originalData;
    const pl = dataRef && dataRef.plantas && dataRef.plantas[pIdx];
    if (!pl) return '';
    const out = [];
    (pl.secciones || []).forEach(function (sec) {
      const titSec = (sec.titulo || '').trim().toUpperCase();
      if (titSec === 'POKER' || titSec === 'NOVEDADES' || titSec === 'CAJA CENTRAL') return;
      if (soloSeccion && titSec !== String(soloSeccion).trim().toUpperCase()) return;
      const block = [];
      (sec.filas || []).forEach(function (fila) {
        const nombre = (fila.nombre || '').trim();
        if (!nombre) return;
        if (soloNombre && nombre !== soloNombre) return;
        asegurarSlots(fila);
        const ranges = slotsToRanges(fila.slots);
        if (!ranges.length) return;
        block.push(nombre + '  ' + formatearRangosTexto(ranges));
      });
      if (block.length) {
        out.push('【' + (sec.titulo || '') + '】');
        block.forEach(function (l) { out.push(l); });
      }
    });
    return out.join('\n').trim();

  function makeDraggable(modal, handle) {
    if (!modal || !handle) return;
    handle.style.cursor = 'move';
    let dragging = false, ox = 0, oy = 0;
    handle.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;
      if (e.target.closest('button')) return;
      // Maximizado: no se puede mover
      if (modal.classList.contains('maximizado')) return;
      const rect = modal.getBoundingClientRect();
      modal.style.left = rect.left + 'px';
      modal.style.top = rect.top + 'px';
      modal.style.right = 'auto';
      modal.style.bottom = 'auto';
      modal.style.transform = 'none';
      ox = e.clientX - rect.left;
      oy = e.clientY - rect.top;
      dragging = true;
      modal.classList.add('arrastrando');
      e.preventDefault();
    });
    const onMove = function (e) {
      if (!dragging) return;
      if (modal.classList.contains('maximizado')) {
        dragging = false;
        modal.classList.remove('arrastrando');
        return;
      }
      let nx = e.clientX - ox;
      let ny = e.clientY - oy;
      const maxX = window.innerWidth - 80;
      const maxY = window.innerHeight - 40;
      nx = Math.max(-modal.offsetWidth + 80, Math.min(nx, maxX));
      ny = Math.max(0, Math.min(ny, maxY));
      modal.style.left = nx + 'px';
      modal.style.top = ny + 'px';
    };
    const onUp = function () {
      if (!dragging) return;
      dragging = false;
      modal.classList.remove('arrastrando');
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  /** Redimensionar panel como ventana de escritorio (bordes y esquinas). */
  function makeResizable(modal) {
    if (!modal) return;
    const dirs = ['n','s','e','w','ne','nw','se','sw'];
    const minW = 280, minH = 160;
    dirs.forEach(function (dir) {
      const h = document.createElement('div');
      h.className = 'resize-handle ' + dir;
      h.dataset.dir = dir;
      modal.appendChild(h);
      h.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (modal.classList.contains('maximizado')) return;
        e.preventDefault();
        e.stopPropagation();
        try { h.setPointerCapture(e.pointerId); } catch (eCap) {}
        const startX = e.clientX, startY = e.clientY;
        const rect = modal.getBoundingClientRect();
        // Fijar posición absoluta actual
        modal.style.left = rect.left + 'px';
        modal.style.top = rect.top + 'px';
        modal.style.width = rect.width + 'px';
        modal.style.height = rect.height + 'px';
        modal.style.maxHeight = 'none';
        modal.style.right = 'auto';
        modal.style.bottom = 'auto';
        modal.style.transform = 'none';
        const startL = rect.left, startT = rect.top, startW = rect.width, startH = rect.height;

        function onMove(ev) {
          if (modal.classList.contains('maximizado')) return;
          const dx = ev.clientX - startX;
          const dy = ev.clientY - startY;
          let left = startL, top = startT, w = startW, hgt = startH;
          if (dir.indexOf('e') >= 0) w = startW + dx;
          if (dir.indexOf('s') >= 0) hgt = startH + dy;
          if (dir.indexOf('w') >= 0) { w = startW - dx; left = startL + dx; }
          if (dir.indexOf('n') >= 0) { hgt = startH - dy; top = startT + dy; }
          // Mínimos
          if (w < minW) {
            if (dir.indexOf('w') >= 0) left = startL + startW - minW;
            w = minW;
          }
          if (hgt < minH) {
            if (dir.indexOf('n') >= 0) top = startT + startH - minH;
            hgt = minH;
          }
          // No salir demasiado de la ventana
          if (left + w < 80) left = 80 - w;
          if (top < 0) { hgt += top; top = 0; }
          if (left > window.innerWidth - 80) left = window.innerWidth - 80;
          if (top > window.innerHeight - 40) top = window.innerHeight - 40;
          modal.style.left = left + 'px';
          modal.style.top = top + 'px';
          modal.style.width = w + 'px';
          modal.style.height = hgt + 'px';
        }
        function onUp(ev) {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          document.removeEventListener('pointercancel', onUp);
          try { if (ev) h.releasePointerCapture(ev.pointerId); } catch (eRel) {}
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onUp);
      });
    });
  }

  // Cualquier captura en JEFES o Cabina desbloqueada marca cambios
  const _capturarOrig = null;

  function construirTimeline(planta, pIdx, editable, tituloPlanta) {

      btnBorrarTodo.onclick = (e) => {
        e.stopPropagation();
        if (!puedeEditarHorariosAhora()) return;
        if (!confirm('¿Borrar TODOS los horarios de esta planta?')) return;
        pushUndo('borrar horarios planta');
        const dataRef = editableData || originalData;
        const plantaRef = dataRef?.plantas?.[pIdx] || planta;
        (plantaRef.secciones || []).forEach((sec) => {
          const tit = (sec.titulo || '').trim().toUpperCase();
          if (tit === 'POKER' || tit === 'NOVEDADES' || tit === 'CAJA CENTRAL') return;
          (sec.filas || []).forEach((fila) => {
            if (!(fila.nombre || '').trim()) return;
            asegurarSlots(fila);
            fila.slots.fill(0);
          });
        });
        cerrarGrillaHorarios();
        abrirGrillaHorarios(tituloPlanta || planta.nombre);
      };
      btns.appendChild(btnBorrarTodo);
    }

    const btnCerrar = document.createElement('button');
    btnCerrar.type = 'button';
    btnCerrar.className = 'btn-cerrar-grilla';
    btnCerrar.textContent = '✕';
    btnCerrar.onclick = (e) => {
      e.stopPropagation();
      cerrarGrillaHorarios();

    btns.appendChild(btnCerrar);

    const btnMax = document.createElement('button');
    btnMax.type = 'button';
    btnMax.className = 'btn-toolbar';
    btnMax.textContent = '⛶';
    btnMax.title = 'Restaurar tamaño';
    btnMax.onclick = (e) => {
      e.stopPropagation();
      e.preventDefault();
      const on = wrap.classList.toggle('maximizado');
      const ov = document.getElementById('timelineOverlay');
      if (ov) {

        ov.style.pointerEvents = 'auto';

      wrap.style.pointerEvents = 'auto';
      wrap.style.transform = 'none';

    const btnPrint = document.createElement('button');
    btnPrint.type = 'button';
    btnPrint.className = 'btn-toolbar';
    btnPrint.textContent = '🖨';
    btnPrint.title = 'Imprimir';
    btnPrint.onclick = (e) => {

      imprimirElementoPanel(wrap);

    const btnShare = document.createElement('button');
    btnShare.type = 'button';
    btnShare.className = 'btn-toolbar';
    btnShare.textContent = '📤';
    btnShare.title = 'Compartir';
    btnShare.onclick = (e) => {
      e.stopPropagation();

    btns.appendChild(btnShare);


    toolbar.appendChild(btns);
    wrap.appendChild(toolbar);

    const scroll = document.createElement('div');
    scroll.className = 'timeline-scroll';

    const table = document.createElement('table');
    table.className = 'timeline-table';

    const cfg = getSlotConfig();
    const NUM_SLOTS = cfg.numSlots;

    // Cabecera: etiquetas centradas sobre la línea de inicio de cada hora / media hora
    const thead = document.createElement('thead');
    const trHora = document.createElement('tr');
    trHora.className = 'horas-punto';
    const thT = document.createElement('th');
    thT.className = 'col-turno';
    thT.rowSpan = 2;
    thT.textContent = '';
    trHora.appendChild(thT);
    const thN = document.createElement('th');
    thN.className = 'col-nombre';
    thN.rowSpan = 2;
    thN.textContent = '';
    trHora.appendChild(thN);
    // Horas en punto: 11:00 … 22:00
    for (let i = 0; i < NUM_SLOTS; i += 4) {
      const th = document.createElement('th');
      th.colSpan = 4;
      th.className = 'lin-hora' + (i === 0 ? ' hora-primera' : '');
      const sp = document.createElement('span');
      sp.className = 'tick-label';
      sp.textContent = slotLabel(i);
      th.appendChild(sp);
      trHora.appendChild(th);
    }
    // 23:00 / 06:00 en la MISMA fila que 22:00, 21:00… (sin rowspan)
    const thTotHora = document.createElement('th');
    thTotHora.className = 'col-total';
    const spFin = document.createElement('span');
    spFin.className = 'tick-label tick-fin-col';
    spFin.textContent = slotLabel(NUM_SLOTS);
    thTotHora.appendChild(spFin);
    trHora.appendChild(thTotHora);
    thead.appendChild(trHora);

    const trMedia = document.createElement('tr');
    trMedia.className = 'horas-media';
    for (let i = 0; i < NUM_SLOTS; i += 4) {
      const thA = document.createElement('th');
      thA.colSpan = 2;
      thA.className = (i === 0 ? 'grilla-inicio' : 'lin-hora');
      trMedia.appendChild(thA);
      const thB = document.createElement('th');
      thB.colSpan = 2;
      const es1630 = (cfg.inicioMin === 11 * 60 && (i + 2 === 22));
      thB.className = 'lin-media' + (es1630 ? ' media-destacada' : '');
      const sp = document.createElement('span');
      sp.className = 'tick-label' + (es1630 ? ' label-destacada' : '');
      sp.textContent = slotLabel(i + 2);
      thB.appendChild(sp);
      trMedia.appendChild(thB);
    }
    // Celda vacía bajo 23:00 (misma columna de totales)
    const thTotMedia = document.createElement('th');
    thTotMedia.className = 'col-total';
    thTotMedia.textContent = '';
    trMedia.appendChild(thTotMedia);
    thead.appendChild(trMedia);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    let totalPersonas = 0;

    (planta.secciones || []).forEach((sec, sIdx) => {
      // No mostrar estas secciones en la grilla de horarios
      const tit = (sec.titulo || '').trim().toUpperCase();
      if (tit === 'POKER' || tit === 'NOVEDADES' || tit === 'CAJA CENTRAL') return;

      // Etiqueta de sector
      const trSec = document.createElement('tr');
      trSec.className = 'timeline-sec-label';
      const tdSec = document.createElement('td');
      tdSec.colSpan = 2 + cfg.numSlots + 1;
      tdSec.textContent = sec.titulo || '';
      trSec.appendChild(tdSec);
      tbody.appendChild(trSec);

      (sec.filas || []).forEach((fila, fIdx) => {
        const nombre = (fila.nombre || '').trim();
        if (!nombre) return;
        totalPersonas++;
        asegurarSlots(fila);
        const te = turnoEfectivoFila(sec, fIdx);
        const clsTurno = colorClasePorTurno(te);
        const colNom = (colorMap[te] && colorMap[te].nombre) || 'negro';
        const hexNombre = (typeof colorHexNombrePorTurno === 'function')
          ? colorHexNombrePorTurno(te) : '#222';

        const tr = document.createElement('tr');
        tr.dataset.sIdx = String(sIdx);
        tr.dataset.fIdx = String(fIdx);
        tr._filaRef = fila;
        const tdT = document.createElement('td');
        tdT.className = 'col-turno';
        tdT.textContent = te || '';
        tdT.style.color = hexNombre;
        tdT.style.cursor = 'pointer';
        tdT.title = 'Doble clic: copiar horario a la fila de abajo';

        let _tapCt = 0;
        tdT.addEventListener('pointerup', function (e) {
          if (e.pointerType === 'mouse') return;
          const now = Date.now();
          if (now - _tapCt < 420) {
            _tapCt = 0;
            try { tdT.dispatchEvent(new MouseEvent('dblclick', { bubbles: true })); } catch (e2) {}
          } else {
            _tapCt = now;
          }
        });
        tdT.addEventListener('dblclick', function(e) {
          e.preventDefault();
          e.stopPropagation();
          if (!editable || (typeof puedeEditarHorariosAhora === 'function' && !puedeEditarHorariosAhora())) return;
          const dataRef = editableData || originalData;
          if (!dataRef || !dataRef.plantas) return;
          const fOrigen = dataRef.plantas[pIdx].secciones[sIdx].filas[fIdx];
          if (typeof asegurarSlots === 'function') asegurarSlots(fOrigen);
          if (!fOrigen.slots || !fOrigen.slots.some(function(v) { return !!v; })) return;
          const filasSec = dataRef.plantas[pIdx].secciones[sIdx].filas || [];
          let fIdxDest = -1;
          for (let k = fIdx + 1; k < filasSec.length; k++) {
            if ((filasSec[k].nombre || '').trim()) { fIdxDest = k; break; }
          }
          if (fIdxDest < 0) return;
          const fDest = filasSec[fIdxDest];
          if (typeof asegurarSlots === 'function') asegurarSlots(fDest);
          if (typeof pushUndo === 'function') pushUndo('copiar horario a fila de abajo');
          for (let k = 0; k < fOrigen.slots.length; k++) {
            fDest.slots[k] = fOrigen.slots[k] ? 1 : 0;
          }
          if (typeof marcarCambios === 'function') marcarCambios();
          const trDest = tbody.querySelector('tr[data-s-idx="' + sIdx + '"][data-f-idx="' + fIdxDest + '"]');
          if (trDest) {
            const teDest = turnoEfectivoFila(dataRef.plantas[pIdx].secciones[sIdx], fIdxDest);
            const clsDest = colorClasePorTurno(teDest);
            trDest.querySelectorAll('td.col-slot').forEach(function(cell, idx) {
              if (idx >= fDest.slots.length) return;
              const on = !!fDest.slots[idx];
              let linD = '';
              if (idx % 4 === 0) linD = ' lin-hora' + (idx === 0 ? ' slot-primera' : '');
              else if (idx % 2 === 0) linD = ' lin-media';
              if (cfg.inicioMin === 11 * 60 && idx === 22) linD = ' lin-media lin-destacada';
              cell.className = 'col-slot' + linD + (on ? ' on ' + clsDest : '');
              if (on) {
                try {
                  const teD = teDest || '';
                  cell.style.setProperty('background', colorHexRellenoGrillaPorTurno(teD), 'important');
                } catch (e) {}
              }
            });
            const totD = trDest.querySelector('.col-total');
            if (totD) {
              const encD = fDest.slots.reduce(function(a, b) { return a + (b ? 1 : 0); }, 0);
              totD.textContent = formatearHoras(encD);
            }
          }
          if (wrap._actualizarSumaSeccion) wrap._actualizarSumaSeccion(sIdx);
        });
        tr.appendChild(tdT);

        const tdN = document.createElement('td');
        tdN.className = 'col-nombre';
        const nomWrap = document.createElement('div');
        nomWrap.className = 'nombre-con-borrar';
        const nomSpan = document.createElement('span');
        nomSpan.className = 'nombre-click';
        nomSpan.textContent = nombre;
        nomSpan.style.color = hexNombre;
        nomSpan.title = 'Ver horario de ' + nombre;
        nomSpan.addEventListener('click', (e) => {
          e.stopPropagation();
          abrirModalResumen(planta, pIdx, tituloPlanta, nombre);
        });
        const btnBorrarFila = document.createElement('button');
        btnBorrarFila.type = 'button';
        btnBorrarFila.className = 'btn-borrar-horario';
        btnBorrarFila.textContent = '🗑';
        btnBorrarFila.title = 'Doble clic: borrar horario de ' + nombre + ' (sin confirmación)';
        let _tapTrash = 0;
        btnBorrarFila.addEventListener('pointerup', function (e) {
          if (e.pointerType === 'mouse') return;
          const now = Date.now();
          if (now - _tapTrash < 420) {
            _tapTrash = 0;
            try { btnBorrarFila.dispatchEvent(new MouseEvent('dblclick', { bubbles: true })); } catch (e2) {}
          } else {
            _tapTrash = now;
          }
        });
        btnBorrarFila.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          e.preventDefault();
          if (!editable || !puedeEditarHorariosAhora()) return;
          // Doble clic: borra sin preguntar
          const dataRef = editableData || originalData;
          const f = dataRef.plantas[pIdx].secciones[sIdx].filas[fIdx];
          asegurarSlots(f);
          f.slots.fill(0);
          fila.slots = f.slots;
          // Actualizar celdas visuales de esta fila (también quitar fondo inline de la paleta)
          tr.querySelectorAll('td.col-slot').forEach((td, si) => {
            const es1630b = (cfg.inicioMin === 11 * 60 && si === 22);
            let linB = '';
            if (si % 4 === 0) linB = ' lin-hora' + (si === 0 ? ' slot-primera' : '');
            else if (es1630b) linB = ' lin-media lin-destacada';
            else if (si % 2 === 0) linB = ' lin-media';
            td.className = 'col-slot' + linB;
            try { td.style.removeProperty('background'); } catch (eBg) {}
          });
          const tot = tr.querySelector('.col-total');
          if (tot) tot.textContent = formatearHoras(0);
          if (wrap._actualizarSumaSeccion) wrap._actualizarSumaSeccion(sIdx);
          try { if (typeof marcarCambios === 'function') marcarCambios(); } catch (eM) {}
        });
        nomWrap.appendChild(nomSpan);
        if (editable) nomWrap.appendChild(btnBorrarFila);
        tdN.appendChild(nomWrap);
        tr.appendChild(tdN);

        for (let si = 0; si < NUM_SLOTS; si++) {
          const td = document.createElement('td');
          const on = !!fila.slots[si];
          const es1630 = (cfg.inicioMin === 11 * 60 && si === 22);
          let lin = '';
          if (si % 4 === 0) lin = ' lin-hora' + (si === 0 ? ' slot-primera' : '');
          else if (es1630) lin = ' lin-media lin-destacada';
          else if (si % 2 === 0) lin = ' lin-media';
          td.className = 'col-slot' + lin + (on ? ' on ' + clsTurno : '');
          td.setAttribute('data-p', String(pIdx));
          td.setAttribute('data-s', String(sIdx));
          td.setAttribute('data-f', String(fIdx));
          td.setAttribute('data-si', String(si));
          if (on && te) {
            try { td.style.setProperty('background', colorHexRellenoGrillaPorTurno(te), 'important'); } catch (e) {}
          }
          td.title = slotLabel(si);
          if (editable) {
            td.addEventListener('mousedown', function(e) {
              if (document.body.classList.contains('ht-activo') || document.querySelector('.resumen-modal-overlay')) return;
              if (e.button != null && e.button !== 0) return;
              if (window._paintTouchLock) return;
              if (window._paintTouchLockUntil && Date.now() < window._paintTouchLockUntil) return;
              e.preventDefault();
              const dataRef = editableData || originalData;
              const f = dataRef.plantas[pIdx].secciones[sIdx].filas[fIdx];
              asegurarSlots(f);
              if (!undoPainting) {
                pushUndo('horario grilla');
                undoPainting = true;
              }
              if (e.shiftKey && shiftAnchor &&
                  shiftAnchor.pIdx === pIdx && shiftAnchor.sIdx === sIdx && shiftAnchor.fIdx === fIdx) {
                const a = Math.min(shiftAnchor.slot, si);
                const b = Math.max(shiftAnchor.slot, si);
                const modeFill = shiftAnchor.mode || 'on';
                for (let k = a; k <= b; k++) {
                  f.slots[k] = modeFill === 'on' ? 1 : 0;
                }
                fila.slots = f.slots.slice();
                // repaint row cells
                const cells = tr.querySelectorAll('td.col-slot');
                cells.forEach((cell, idx) => {
                  if (idx >= f.slots.length) return;
                  const on = !!f.slots[idx];
                  let lin = '';
                  if (idx % 4 === 0) lin = ' lin-hora' + (idx === 0 ? ' slot-primera' : '');
                  else if (idx % 2 === 0) lin = ' lin-media';
                  const es1630 = (cfg.inicioMin === 11 * 60 && idx === 22);
                  if (es1630) lin = ' lin-media lin-destacada';
                  cell.className = 'col-slot' + lin + (on ? ' on ' + clsTurno : '');
                  if (on && te) {
                    try { cell.style.setProperty('background', colorHexRellenoGrillaPorTurno(te), 'important'); }
                    catch (e) {}
                  } else {
                    try { cell.style.removeProperty('background'); } catch (e) {}
                  }
                });
                const tot = tr.querySelector('.col-total');
                if (tot) {
                  const enc = f.slots.reduce(function(a,b){ return a+(b?1:0); }, 0);
                  tot.textContent = formatearHoras(enc);
                }
                marcarCambios();
                paintState = null;
                return;
              }
              const mode = f.slots[si] ? 'off' : 'on';
              paintState = { mode: mode, pIdx: pIdx, sIdx: sIdx, fIdx: fIdx, x0: e.clientX, y0: e.clientY, dragging: false };
              shiftAnchor = { pIdx: pIdx, sIdx: sIdx, fIdx: fIdx, slot: si, mode: mode };
              f.slots[si] = mode === 'on' ? 1 : 0;
              fila.slots[si] = f.slots[si];
              marcarCambios();
              let linP = '';
              if (si % 4 === 0) linP = ' lin-hora' + (si === 0 ? ' slot-primera' : '');
              else if (es1630) linP = ' lin-media lin-destacada';
              else if (si % 2 === 0) linP = ' lin-media';
              td.className = 'col-slot' + linP + (f.slots[si] ? ' on ' + clsTurno : '');
              if (f.slots[si] && te) {
                try { td.style.setProperty('background', colorHexRellenoGrillaPorTurno(te), 'important'); } catch (e) {}
              } else {
                try { td.style.removeProperty('background'); } catch (e) {}
              }
              const tot = tr.querySelector('.col-total');
              if (tot) {
                const enc = f.slots.reduce(function(a,b){ return a+(b?1:0); }, 0);
                tot.textContent = formatearHoras(enc);
              }
              if (wrap._actualizarSumaSeccion) wrap._actualizarSumaSeccion(sIdx);
            });
            td.addEventListener('mouseenter', function() {
              if (document.body.classList.contains('ht-activo') || document.querySelector('.resumen-modal-overlay')) return;
              if (!paintState) return;
              if (paintState.pIdx !== pIdx || paintState.sIdx !== sIdx || paintState.fIdx !== fIdx) return;
              const dataRef = editableData || originalData;
              const f = dataRef.plantas[pIdx].secciones[sIdx].filas[fIdx];
              asegurarSlots(f);
              f.slots[si] = paintState.mode === 'on' ? 1 : 0;
              fila.slots[si] = f.slots[si];
              marcarCambios();
              let linP2 = '';
              if (si % 4 === 0) linP2 = ' lin-hora' + (si === 0 ? ' slot-primera' : '');
              else if (es1630) linP2 = ' lin-media lin-destacada';
              else if (si % 2 === 0) linP2 = ' lin-media';
              td.className = 'col-slot' + linP2 + (f.slots[si] ? ' on ' + clsTurno : '');
              if (f.slots[si] && te) {
                try { td.style.setProperty('background', colorHexRellenoGrillaPorTurno(te), 'important'); } catch (e) {}
              } else {
                try { td.style.removeProperty('background'); } catch (e) {}
              }
              const tot = tr.querySelector('.col-total');
              if (tot) {
                const enc = f.slots.reduce(function(a,b){ return a+(b?1:0); }, 0);
                tot.textContent = formatearHoras(enc);
              }
              if (wrap._actualizarSumaSeccion) wrap._actualizarSumaSeccion(sIdx);
            });
          }
          tr.appendChild(td);
        }

        const tdTot = document.createElement('td');
        tdTot.className = 'col-total';
        const enc = fila.slots.reduce(function(a,b){ return a+(b?1:0); }, 0);
        tdTot.textContent = formatearHoras(enc);
        tr.appendChild(tdTot);
        tbody.appendChild(tr);
      });

      // Fila de calor: intensidad según empleados activos (sin números)
      let maxPersSec = 0;
      (sec.filas || []).forEach(f => { if ((f.nombre || '').trim()) maxPersSec++; });
      if (maxPersSec < 1) maxPersSec = 1;

      const trSum = document.createElement('tr');
      trSum.className = 'timeline-sum-row';
      trSum.dataset.sIdx = String(sIdx);
      trSum.dataset.maxPers = String(maxPersSec);
      const tdSumT = document.createElement('td');
      tdSumT.className = 'col-turno';
      tdSumT.textContent = '';
      trSum.appendChild(tdSumT);
      const tdSumN = document.createElement('td');
      tdSumN.className = 'col-nombre sum-label';
      tdSumN.textContent = 'Activos';
      trSum.appendChild(tdSumN);
      for (let si = 0; si < NUM_SLOTS; si++) {
        const td = document.createElement('td');
        const es1630s = (cfg.inicioMin === 11 * 60 && si === 22);
        let linS = '';
        if (si % 4 === 0) linS = ' lin-hora' + (si === 0 ? ' slot-primera' : '');
        else if (es1630s) linS = ' lin-media lin-destacada';
        else if (si % 2 === 0) linS = ' lin-media';
        let cnt = 0;
        (sec.filas || []).forEach(f => {
          if (!(f.nombre || '').trim()) return;
          asegurarSlots(f);
          if (f.slots[si]) cnt++;
        });
        td.className = 'col-slot sum-slot' + linS;
        td.dataset.si = String(si);
        td.textContent = '';
        td.style.background = colorEscalaActivos(cnt, maxPersSec);
        td.title = slotLabel(si) + ': ' + cnt + ' activo' + (cnt === 1 ? '' : 's');
        trSum.appendChild(td);
      }
      const tdSumTot = document.createElement('td');
      tdSumTot.className = 'col-total';
      tdSumTot.textContent = '';
      trSum.appendChild(tdSumTot);
      tbody.appendChild(trSum);
    });

    // Actualiza la fila de calor de una sección
    function actualizarSumaSeccion(sIdxRef) {
      const dataRef = editableData || originalData;
      const secRef = dataRef?.plantas?.[pIdx]?.secciones?.[sIdxRef];
      if (!secRef) return;
      const trSumEl = tbody.querySelector('tr.timeline-sum-row[data-s-idx="' + sIdxRef + '"]');
      if (!trSumEl) return;
      let maxPers = parseInt(trSumEl.dataset.maxPers || '1', 10) || 1;
      trSumEl.querySelectorAll('td.sum-slot').forEach(td => {
        const si = parseInt(td.dataset.si, 10);
        let cnt = 0;
        (secRef.filas || []).forEach(f => {
          if (!(f.nombre || '').trim()) return;
          asegurarSlots(f);
          if (f.slots[si]) cnt++;
        });
        td.textContent = '';
        td.style.background = colorEscalaActivos(cnt, maxPers);
        td.title = slotLabel(si) + ': ' + cnt + ' activo' + (cnt === 1 ? '' : 's');
        const es1630u = (cfg.inicioMin === 11 * 60 && si === 22);
        let linU = '';
        if (si % 4 === 0) linU = ' lin-hora' + (si === 0 ? ' slot-primera' : '');
        else if (es1630u) linU = ' lin-media lin-destacada';
        else if (si % 2 === 0) linU = ' lin-media';
        td.className = 'col-slot sum-slot' + linU;
      });
    }
    wrap._actualizarSumaSeccion = actualizarSumaSeccion;
    if (mostrarActivos) wrap.classList.add('mostrar-activos');

    table.appendChild(tbody);
    scroll.appendChild(table);
    wrap.appendChild(scroll);

    const leg = document.createElement('div');
    leg.className = 'timeline-legend';
    leg.textContent = totalPersonas
      ? (getSlotConfig().etiquetaRango + ' · ' + totalPersonas + ' personas')
      : 'Sin nombres en esta planta.';
    wrap.appendChild(leg);

    return wrap;
  }


  function generarTextoResumenPlanta(planta, tituloPlanta, soloSeccion) {
    const dataRef = editableData || originalData;
    const plantaActual = (dataRef && dataRef.plantas)
      ? (dataRef.plantas.find(p => limpiarNombrePlanta(p.nombre) === limpiarNombrePlanta(tituloPlanta || planta.nombre)) || planta)
      : planta;
    const lineas = [];
    lineas.push((tituloPlanta || plantaActual.nombre || 'PLANTA') + ' — ' + getSlotConfig().etiquetaRango);
    (plantaActual.secciones || []).forEach(sec => {
      const tit = (sec.titulo || '').trim().toUpperCase();
      if (tit === 'POKER' || tit === 'NOVEDADES' || tit === 'CAJA CENTRAL') return;
      if (soloSeccion && (sec.titulo || '').trim().toUpperCase() !== soloSeccion.trim().toUpperCase()) return;
      const items = [];
      (sec.filas || []).forEach((fila, fIdx) => {
        const nombre = (fila.nombre || '').trim();
        if (!nombre) return;
        asegurarSlots(fila);
        const ranges = slotsToRanges(fila.slots);
        if (!ranges.length) return;
        const horasTxt = ranges.map(r => r.from + '–' + r.to).join(', ');
        items.push(nombre + '  ' + horasTxt);
      });
      if (items.length) {
        lineas.push('【' + (sec.titulo || '') + '】');
        items.forEach(it => lineas.push(it));
      }
    });
    return lineas.join('\n');
  }

    function renderFilaEditable(p, item, sec, sIdx, fIdx) {

      spanNom.style.color = item.color;
      p.appendChild(spanNom);

      spanHoras.className = 'res-horas';

        spanHoras.innerHTML = '';
        p.classList.toggle('sin-horario', !ranges.length);
        if (!ranges.length) {
          const vac = document.createElement('span');
          vac.className = 'res-sin-horario';
          vac.textContent = 'Sin horario';
          spanHoras.appendChild(vac);
        }
        ranges.forEach(function (r, ri) {
          const chip = document.createElement('span');

          chip.textContent = r.from + ' → ' + r.to;

            return;

          ranges[ri] = { from: selFrom.value, to: selTo.value };
          const slots = rangesToSlots(ranges);

          item.horasTxt = formatearRangosTexto(ranges);

          // actualizar texto para copiar
          rebuildLineas();
          refrescarChips();

        btnDel.onclick = function () {
          ranges.splice(ri, 1);
          const slots = rangesToSlots(ranges);
          aplicarSlotsAFila(sIdx, fIdx, slots);
          item.ranges = ranges.slice();
          item.horasTxt = formatearRangosTexto(ranges);

          rebuildLineas();
          refrescarChips();

        wrap.appendChild(selFrom);
        wrap.appendChild(flecha);
        wrap.appendChild(selTo);
        wrap.appendChild(btnOk);
        wrap.appendChild(btnDel);
        spanHoras.appendChild(wrap);

      refrescarChips();

    function rebuildLineas() {
      lineas.length = 0;
      body.querySelectorAll('.res-seccion').forEach(function () {});
      // se reconstruye al copiar desde items visibles
    }

    const itemsPorSeccion = [];

    (plantaActual.secciones || []).forEach((sec, sIdx) => {
      const titSec = (sec.titulo || '').trim().toUpperCase();

      if (soloSeccion && titSec !== String(soloSeccion).trim().toUpperCase()) return;

      const itemsSeccion = [];
      (sec.filas || []).forEach((fila, fIdx) => {
        const nombre = (fila.nombre || '').trim();
        if (!nombre) return;
        if (soloNombre && nombre !== soloNombre) return;
        asegurarSlots(fila);
        const ranges = slotsToRanges(fila.slots);
        // Mostrar también sin horario si se edita una sola persona
        if (!ranges.length && !soloNombre && !puedeEditarHorarios) return;
        const horasTxt = formatearRangosTexto(ranges);
        const te = turnoEfectivoFila(sec, fIdx);
        const colNom = (colorMap[te] && colorMap[te].nombre) || 'negro';
        itemsSeccion.push({
          nombre,
          ranges: ranges.slice(),
          horasTxt,
          color: (typeof colorHexNombrePorTurno === 'function') ? colorHexNombrePorTurno(te) : '#222',
          textoPlano: nombre + '  ' + horasTxt,
          sIdx: sIdx,
          fIdx: fIdx

      });

      if (itemsSeccion.length) {
        hayAlgo = true;
        const tit = document.createElement('div');
        tit.className = 'res-seccion ' + claseTurno;
        tit.textContent = sec.titulo || '';
        body.appendChild(tit);
        lineas.push('【' + (sec.titulo || '') + '】');

        itemsSeccion.forEach(item => {
          if (item.ranges && item.ranges.length) {
            lineas.push(item.textoPlano || (item.nombre + '  ' + item.horasTxt));

          const p = document.createElement('div');
          p.className = 'res-linea' + (!(item.ranges && item.ranges.length) ? ' sin-horario' : '');
          renderFilaEditable(p, item, sec, item.sIdx, item.fIdx);
          body.appendChild(p);

    if (!hayAlgo) {
      const vacio = document.createElement('div');
      vacio.className = 'resumen-modal-vacio';
      vacio.textContent = soloNombre
        ? ('Todavía no hay horarios pintados para ' + soloNombre + '.')
        : 'Todavía no hay horarios pintados en esta planta.\nPintá celdas en la grilla o editá desde acá.';
      body.appendChild(vacio);
    }

    btnCopiar.onclick = () => {
      // regenerar líneas desde datos actuales
      const dataRef = editableData || originalData;
      const pl = dataRef?.plantas?.[pIdx] || plantaActual;
      const out = [];
      (pl.secciones || []).forEach(function (sec) {
        const titSec = (sec.titulo || '').trim().toUpperCase();
        if (titSec === 'POKER' || titSec === 'NOVEDADES' || titSec === 'CAJA CENTRAL') return;
        if (soloSeccion && titSec !== String(soloSeccion).trim().toUpperCase()) return;
        const block = [];
        (sec.filas || []).forEach(function (fila) {
          const nombre = (fila.nombre || '').trim();
          if (!nombre) return;
          if (soloNombre && nombre !== soloNombre) return;
          asegurarSlots(fila);
          const ranges = slotsToRanges(fila.slots);
          if (!ranges.length) return;
          block.push(nombre + '  ' + formatearRangosTexto(ranges));
        });
        if (block.length) {
          out.push('【' + (sec.titulo || '') + '】');
          block.forEach(function (l) { out.push(l); });
        }
      });
      const textoCompleto = out.join('\n');
      if (!textoCompleto) {
        alert('No hay horarios para copiar.');
        return;
      }
      navigator.clipboard.writeText(textoCompleto).then(() => {
        btnCopiar.textContent = '✓';
        setTimeout(() => { btnCopiar.textContent = '📋'; }, 1500);
      }).catch(() => {
        prompt('Copiá el texto (Ctrl+C):', textoCompleto);
      });
    };

    modal.appendChild(body);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    try { sincronizarEstadoHTActivo(); } catch (eHt) {}

  }
