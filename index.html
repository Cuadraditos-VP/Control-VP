  /**
   * Marca salidas temprano automáticamente al cierre final (solo en hoja JEFES / editable).
   * Limpia marcas previas y aplica reglas por planta/sección/turno de hoja.
   */
  function aplicarSalidasTempranoAutomaticas(data, turnoHoja) {
    if (!data || !data.plantas) return [];
    const hoja = String(turnoHoja || '').trim().toUpperCase();
    const marcados = [];

    function norm(s) {
      return String(s || '')
        .toUpperCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }
    function esPlanta(p, clave) {
      const n = norm(typeof limpiarNombrePlanta === 'function' ? limpiarNombrePlanta(p.nombre || '') : (p.nombre || ''));
      if (clave === 'ALTA') return n.indexOf('ALTA') >= 0 && n.indexOf('INTER') < 0;
      if (clave === 'INTERMEDIA') return n.indexOf('INTERMEDIA') >= 0;
      if (clave === 'BAJA') return n.indexOf('BAJA') >= 0;
      return false;
    }
    function esSeccion(sec, claves) {
      const t = norm(sec.titulo || '');
      return (claves || []).some(function (c) { return t === norm(c) || t.indexOf(norm(c)) >= 0; });
    }
    function limpiarTempranoTodo() {
      (data.plantas || []).forEach(function (pl) {
        (pl.secciones || []).forEach(function (sec) {
          (sec.filas || []).forEach(function (f) {
            if (f) f.temprano = false;
          });
        });
      });
    }
    /**
     * Turno efectivo de cada fila (hereda el último no vacío, como en pantalla).
     * Solo filas con nombre.
     */
    function filasConTurnoEfectivo(sec) {
      const out = [];
      let ult = '';
      (sec.filas || []).forEach(function (f) {
        if (!f) return;
        const tu = String(f.turno || '').trim().toUpperCase();
        if (tu) ult = tu;
        const nom = (f.nombre || '').trim();
        if (!nom) return;
        out.push({ fila: f, turnoEf: ult, nombre: nom });
      });
      return out;
    }
    function filasDeCodigo(sec, codigo) {
      const cod = String(codigo || '').toUpperCase();
      return filasConTurnoEfectivo(sec).filter(function (x) { return x.turnoEf === cod; });
    }
    function marcarPrimeroSiMin(sec, codigo, minN, etiqueta) {
      const filas = filasDeCodigo(sec, codigo);
      if (filas.length < (minN || 1)) return false;
      filas[0].fila.temprano = true;
      marcados.push((etiqueta || '') + filas[0].nombre);
      return true;
    }
    function marcarPrimeroCualquiera(sec, etiqueta) {
      const out = filasConTurnoEfectivo(sec);
      if (!out.length) return false;
      out[0].fila.temprano = true;
      marcados.push((etiqueta || '') + out[0].nombre);
      return true;
    }

    limpiarTempranoTodo();

    (data.plantas || []).forEach(function (pl) {
      const plantaNom = (typeof limpiarNombrePlanta === 'function')
        ? limpiarNombrePlanta(pl.nombre || '')
        : (pl.nombre || '');
      (pl.secciones || []).forEach(function (sec) {
        const tag = plantaNom + ' / ' + (sec.titulo || '') + ': ';

        if (hoja !== 'NOCHE') {
          // TARDE
          if (esPlanta(pl, 'ALTA')) {
            if (esSeccion(sec, ['CASTITO'])) {
              marcarPrimeroSiMin(sec, 'T', 2, tag + 'T→');
            } else if (esSeccion(sec, ['PAGO DE FICHAS'])) {
              marcarPrimeroSiMin(sec, 'MS', 2, tag + 'MS→');
              marcarPrimeroSiMin(sec, 'T', 2, tag + 'T→');
            } else if (esSeccion(sec, ['VENTA DE FICHAS'])) {
              marcarPrimeroSiMin(sec, 'MS', 1, tag + 'MS→');
              marcarPrimeroSiMin(sec, 'T', 1, tag + 'T→');
            }
          } else if (esPlanta(pl, 'INTERMEDIA')) {
            if (esSeccion(sec, ['CASTITO'])) {
              marcarPrimeroSiMin(sec, 'MS', 1, tag + 'MS→');
              marcarPrimeroSiMin(sec, 'T', 1, tag + 'T→');
            } else if (esSeccion(sec, ['VENTA DE TICKETS'])) {
              marcarPrimeroSiMin(sec, 'MS', 1, tag + 'MS→');
              marcarPrimeroSiMin(sec, 'T', 2, tag + 'T→');
            }
          } else if (esPlanta(pl, 'BAJA')) {
            if (esSeccion(sec, ['CASTITO'])) {
              marcarPrimeroSiMin(sec, 'T', 2, tag + 'T→');
            } else if (esSeccion(sec, ['VENTA DE TICKETS'])) {
              marcarPrimeroSiMin(sec, 'T', 2, tag + 'T→');
            }
          }
        } else {
          // NOCHE
          if (esPlanta(pl, 'ALTA')) {
            if (esSeccion(sec, ['VENTA DE FICHAS'])) {
              marcarPrimeroCualquiera(sec, tag);
            }
          } else if (esPlanta(pl, 'INTERMEDIA')) {
            if (esSeccion(sec, ['CASTITO'])) {
              marcarPrimeroCualquiera(sec, tag);
            } else if (esSeccion(sec, ['VENTA DE TICKETS'])) {
              marcarPrimeroSiMin(sec, 'N', 2, tag + 'N→');
            }
          } else if (esPlanta(pl, 'BAJA')) {
            if (esSeccion(sec, ['CASTITO'])) {
              marcarPrimeroSiMin(sec, 'N', 2, tag + 'N→');
            } else if (esSeccion(sec, ['VENTA DE TICKETS'])) {
              marcarPrimeroSiMin(sec, 'N', 2, tag + 'N→');
            }
          }
        }
      });
    });
    return marcados;
  }

  function _nombreCortoResumen(nom) {
    let t = String(nom || '').trim();
    if (!t) return '';
    t = t.replace(/\s*\(\d{4,}\)\s*$/, '').trim();
    return t;
  }

  function _escHtmlResumen(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** CT en negrita y color (sin paréntesis) */
  function _htmlCtBadge(ct) {
    const c = String(ct || '').trim().toUpperCase();
    if (!c) return '';
    let bg = '#eceff1', fg = '#37474f';
    try {
      if (typeof colorCTEfectivo === 'function') {
        const col = colorCTEfectivo(c);
        if (col) {
          bg = col.bg || bg;
          fg = col.fg || fg;
        }
      }
    } catch (e) {}
    return '<span class="ct-badge" style="background:' + bg + ';color:' + fg + '">' +
      _escHtmlResumen(c) + '</span>';
  }

  /** Código de novedad en negrita (14F, 10A, etc.) — sin paréntesis */
  function _htmlNovBadge(cod) {
    const c = String(cod || '').trim().toUpperCase();
    if (!c) return '';
    return '<strong>' + _escHtmlResumen(c) + '</strong>';
  }

  /**
   * Resumen post-cierre:
   * - Intercambio con mismo CT → no se menciona
   * - Intercambio con CT distintos → "ARES N × ORTIZ, OSCAR E"
   * - Movimientos/reemplazos en el mismo CT → no se mencionan
   * - Quien salió con novedad → "Triviño 14F"
   * - Quien salió sin novedad → "Stahl sin datos"
   * - Cambio de CT del mismo cajero → sí se menciona
   */
  function generarResumenJornada(orig, edit, omitirSalidas) {
    if (!orig || !edit || !orig.plantas || !edit.plantas) return '';
    omitirSalidas = omitirSalidas || {};
    const mapaNov = (typeof mapaCodigosNovedades === 'function')
      ? mapaCodigosNovedades(edit)
      : {};
    const mapaNovOrig = (typeof mapaCodigosNovedades === 'function')
      ? mapaCodigosNovedades(orig)
      : {};
    const normNom = function (n) {
      return (typeof normalizarNombreCelda === 'function')
        ? normalizarNombreCelda(n) : String(n || '').trim();
    };
    const codigoNov = function (nomFull) {
      if (!nomFull) return '';
      return mapaNov[nomFull] || mapaNovOrig[nomFull] || '';
    };
    const turnoEffFila = function (filas, idx) {
      for (let i = idx; i >= 0; i--) {
        const t = String((filas[i] && filas[i].turno) || '').trim().toUpperCase();
        if (t) return t;
      }
      return '';
    };

    // Personas presentes en Jefes (edit) y en Cabina (orig)
    const presentesEdit = {};
    const presentesOrig = {};
    const cambios = [];

    const plantasN = Math.max(orig.plantas.length, edit.plantas.length);
    for (let pIdx = 0; pIdx < plantasN; pIdx++) {
      const pO = orig.plantas[pIdx];
      const pE = edit.plantas[pIdx];
      if (!pO && !pE) continue;
      const nombrePlanta = (typeof limpiarNombrePlanta === 'function')
        ? limpiarNombrePlanta((pE && pE.nombre) || (pO && pO.nombre) || '')
        : String((pE && pE.nombre) || (pO && pO.nombre) || '');
      const secsO = (pO && pO.secciones) || [];
      const secsE = (pE && pE.secciones) || [];
      const titulos = [];
      const seen = {};
      secsO.concat(secsE).forEach(function (s) {
        const t = String((s && s.titulo) || '').trim().toUpperCase();
        if (!t || t === 'NOVEDADES' || t === 'CAJA CENTRAL') return;
        if (seen[t]) return;
        seen[t] = true;
        titulos.push(t);
      });
      titulos.forEach(function (tit) {
        const sO = secsO.find(function (s) { return String(s.titulo || '').trim().toUpperCase() === tit; });
        const sE = secsE.find(function (s) { return String(s.titulo || '').trim().toUpperCase() === tit; });
        const filasO = (sO && sO.filas) || [];
        const filasE = (sE && sE.filas) || [];
        const n = Math.max(filasO.length, filasE.length);
        for (let fIdx = 0; fIdx < n; fIdx++) {
          const fO = filasO[fIdx] || {};
          const fE = filasE[fIdx] || {};
          const nomO = normNom(fO.nombre);
          const nomE = normNom(fE.nombre);
          const turO = turnoEffFila(filasO, fIdx);
          const turE = turnoEffFila(filasE, fIdx);
          const lugar = tit + (nombrePlanta ? ' (' + nombrePlanta + ')' : '');
          if (nomO) presentesOrig[nomO] = true;
          if (nomE) presentesEdit[nomE] = true;

          if (nomO && nomE && nomO === nomE && turO !== turE && (turO || turE)) {
            cambios.push({
              tipo: 'turno',
              from: nomO,
              to: nomE,
              lugar: lugar,
              turnoFrom: turO,
              turnoTo: turE
            });
          }
          if (nomO === nomE) continue;
          let tipo = 'replace';
          if (nomO && !nomE) tipo = 'empty';
          else if (!nomO && nomE) tipo = 'add';
          cambios.push({
            tipo: tipo,
            from: nomO,
            to: nomE,
            lugar: lugar,
            turnoFrom: turO || '',
            turnoTo: turE || '',
            novFrom: codigoNov(nomO)
          });
        }
      });
    }

    const usados = {};
    const lineas = [];
    const yaSalida = {}; // no repetir "Triviño 14F" / "Stahl sin datos"
    const yaCt = {}; // no repetir cambios de CT

    // 1) Intercambios A↔B
    for (let i = 0; i < cambios.length; i++) {
      if (usados[i]) continue;
      const c = cambios[i];
      if (c.tipo !== 'replace' || !c.from || !c.to) continue;
      for (let j = i + 1; j < cambios.length; j++) {
        if (usados[j]) continue;
        const d = cambios[j];
        if (d.tipo === 'replace' && d.from === c.to && d.to === c.from) {
          usados[i] = true;
          usados[j] = true;
          const ct1 = String(c.turnoTo || '').trim().toUpperCase();
          const ct2 = String(d.turnoTo || '').trim().toUpperCase();
          // Mismo CT → no mencionar (MELO/CEJA, LAFARGA/SEMENZA, …)
          if (!ct1 || !ct2 || ct1 === ct2) break;
          const n1 = _escHtmlResumen(_nombreCortoResumen(c.to));
          const n2 = _escHtmlResumen(_nombreCortoResumen(d.to));
          lineas.push(n1 + ' ' + _htmlCtBadge(ct1) + ' × ' + n2 + ' ' + _htmlCtBadge(ct2) + '.');
          yaCt[c.to] = true;
          yaCt[d.to] = true;
          yaCt[c.from] = true;
          yaCt[d.from] = true;
          break;
        }
      }
    }

    // 2) Cambios de CT (con o sin pareja de intercambio identificada)
    //    Mapa global: CT de cada persona en Cabina vs Jefes
    const ctPorNomOrig = {};
    const ctPorNomEdit = {};
    const lugarPorNomEdit = {};
    // Releer plantas para CT efectivo por persona (última aparición cuenta)
    (function recolectarCT(data, dest, destLugar) {
      if (!data || !data.plantas) return;
      data.plantas.forEach(function (pl) {
        const np = (typeof limpiarNombrePlanta === 'function')
          ? limpiarNombrePlanta(pl.nombre || '') : String(pl.nombre || '');
        (pl.secciones || []).forEach(function (sec) {
          const tit = String(sec.titulo || '').trim().toUpperCase();
          if (!tit || tit === 'NOVEDADES' || tit === 'CAJA CENTRAL') return;
          const filas = sec.filas || [];
          filas.forEach(function (f, fIdx) {
            const nom = normNom(f && f.nombre);
            if (!nom) return;
            let ct = '';
            for (let i = fIdx; i >= 0; i--) {
              const t = String((filas[i] && filas[i].turno) || '').trim().toUpperCase();
              if (t) { ct = t; break; }
            }
            dest[nom] = ct;
            if (destLugar) destLugar[nom] = tit + (np ? ' (' + np + ')' : '');
          });
        });
      });
    })(orig, ctPorNomOrig, null);
    (function recolectarCT(data, dest, destLugar) {
      if (!data || !data.plantas) return;
      data.plantas.forEach(function (pl) {
        const np = (typeof limpiarNombrePlanta === 'function')
          ? limpiarNombrePlanta(pl.nombre || '') : String(pl.nombre || '');
        (pl.secciones || []).forEach(function (sec) {
          const tit = String(sec.titulo || '').trim().toUpperCase();
          if (!tit || tit === 'NOVEDADES' || tit === 'CAJA CENTRAL') return;
          const filas = sec.filas || [];
          filas.forEach(function (f, fIdx) {
            const nom = normNom(f && f.nombre);
            if (!nom) return;
            let ct = '';
            for (let i = fIdx; i >= 0; i--) {
              const t = String((filas[i] && filas[i].turno) || '').trim().toUpperCase();
              if (t) { ct = t; break; }
            }
            dest[nom] = ct;
            if (destLugar) destLugar[nom] = tit + (np ? ' (' + np + ')' : '');
          });
        });
      });
    })(edit, ctPorNomEdit, lugarPorNomEdit);

    // Primero los tipo 'turno' del casillero
    for (let i = 0; i < cambios.length; i++) {
      if (usados[i]) continue;
      const c = cambios[i];
      if (c.tipo !== 'turno') continue;
      usados[i] = true;
      const key = c.from || c.to;
      if (!key || yaCt[key]) continue;
      yaCt[key] = true;
      const nom = _escHtmlResumen(_nombreCortoResumen(key));
      const desde = c.turnoFrom ? _htmlCtBadge(c.turnoFrom) : '—';
      const hasta = c.turnoTo ? _htmlCtBadge(c.turnoTo) : '—';
      lineas.push(nom + ' ' + desde + ' → ' + hasta + '.');
    }
    // Luego cualquier persona que esté en ambas hojas con CT distinto
    // (aunque no se haya identificado con quién cambió)
    Object.keys(ctPorNomOrig).forEach(function (nom) {
      if (yaCt[nom]) return;
      if (!ctPorNomEdit[nom]) return; // salió del piso → lo cubre bloque 3
      const a = String(ctPorNomOrig[nom] || '').trim().toUpperCase();
      const b = String(ctPorNomEdit[nom] || '').trim().toUpperCase();
      if (!a || !b || a === b) return;
      yaCt[nom] = true;
      lineas.push(
        _escHtmlResumen(_nombreCortoResumen(nom)) + ' ' +
        _htmlCtBadge(a) + ' → ' + _htmlCtBadge(b) + '.'
      );
    });

    // 3) Salidas: quien estaba en Cabina y ya no está en Jefes
    //    (incluye casillero vacío o reemplazado y no reaparece en otra caja)
    for (let i = 0; i < cambios.length; i++) {
      if (usados[i]) continue;
      const c = cambios[i];
      if (c.tipo !== 'replace' && c.tipo !== 'empty') continue;
      if (!c.from) continue;
      usados[i] = true;

      // Si la persona sigue en Jefes en otra caja → solo se movió
      if (presentesEdit[c.from]) {
        // Movimiento interno: solo importa si cambió de CT (ya cubierto en tipo turno)
        // Si el CT destino del casillero es el mismo que el origen → no mencionar
        continue;
      }

      // Salió del piso (si cruzó de jornada, se informa en el bloque de pasajes)
      if (omitirSalidas[c.from]) continue;
      if (yaSalida[c.from]) continue;
      yaSalida[c.from] = true;
      const corto = _escHtmlResumen(_nombreCortoResumen(c.from));
      const nov = String(c.novFrom || codigoNov(c.from) || '').trim().toUpperCase();
      if (nov) {
        lineas.push(corto + ' ' + _htmlNovBadge(nov) + '.');
      } else {
        lineas.push(corto + ' <strong>sin datos</strong>.');
      }
    }

    // 4) Altas puras (alguien nuevo que no estaba en Cabina) — solo si aportan info
    //    Las omitimos si son cobertura de misma red de movimientos; no listamos "se agregó".

    if (!lineas.length) return 'Sin diferencias relevantes entre Cabina y Jefes.';
    return lineas.join('\n');
  }

  /**
   * Cruces entre jornadas (misma fecha), por jornada de origen:
   * en TARDE:  "Díaz, Valentín pasó a la noche E"  (CT destino con color, sin paréntesis)
   * en NOCHE:  "Leguizamón pasó a la tarde T"
   * Devuelve { porOrigen: { TARDE, NOCHE }, nombres } para no listarlos como "sin datos".
   */
  function generarResumenCruceTardeNoche(cache) {
    const vacio = { porOrigen: { TARDE: '', NOCHE: '' }, nombres: {} };
    if (!cache) return vacio;
    const normNom = function (n) {
      return (typeof normalizarNombreCelda === 'function')
        ? normalizarNombreCelda(n) : String(n || '').trim();
    };
    const turnoEffFila = function (filas, idx) {
      for (let i = idx; i >= 0; i--) {
        const t = String((filas[i] && filas[i].turno) || '').trim().toUpperCase();
        if (t) return t;
      }
      return '';
    };
    const recolectar = function (pack, hoja) {
      const map = {};
      if (!pack) return map;
      const data = (hoja === 'jefes')
        ? (pack.editable || pack.original)
        : (pack.original || pack.editable);
      if (!data || !data.plantas) return map;
      data.plantas.forEach(function (pl) {
        const nombrePlanta = (typeof limpiarNombrePlanta === 'function')
          ? limpiarNombrePlanta(pl.nombre || '')
          : String(pl.nombre || '');
        (pl.secciones || []).forEach(function (sec) {
          const tit = String(sec.titulo || '').trim().toUpperCase();
          if (!tit || tit === 'NOVEDADES' || tit === 'CAJA CENTRAL') return;
          const filas = sec.filas || [];
          filas.forEach(function (f, fIdx) {
            const nom = normNom(f && f.nombre);
            if (!nom) return;
            const ct = turnoEffFila(filas, fIdx);
            const lugar = tit + (nombrePlanta ? ' (' + nombrePlanta + ')' : '');
            map[nom] = { ct: ct, lugar: lugar };
          });
        });
      });
      return map;
    };

    const cabT = recolectar(cache['TARDE'], 'cabina');
    const cabN = recolectar(cache['NOCHE'], 'cabina');
    const jefT = recolectar(cache['TARDE'], 'jefes');
    const jefN = recolectar(cache['NOCHE'], 'jefes');

    const lineasTarde = []; // salieron de TARDE hacia NOCHE
    const lineasNoche = []; // salieron de NOCHE hacia TARDE
    const nombres = {};
    const visto = {};

    // Cabina TARDE → Jefes NOCHE  → se informa en el bloque TARDE
    Object.keys(cabT).forEach(function (nom) {
      if (!jefN[nom]) return;
      // Si sigue también en Jefes TARDE, no es un pasaje exclusivo
      if (jefT[nom]) return;
      const key = nom + '|T→N';
      if (visto[key]) return;
      visto[key] = true;
      nombres[nom] = true;
      const corto = _nombreCortoResumen(nom);
      const ctDestH = jefN[nom].ct ? _htmlCtBadge(jefN[nom].ct) : '';
      lineasTarde.push(
        _escHtmlResumen(corto) + ' pasó a la noche' +
        (ctDestH ? ' ' + ctDestH : '') + '.'
      );
    });

    // Cabina NOCHE → Jefes TARDE  → se informa en el bloque NOCHE
    Object.keys(cabN).forEach(function (nom) {
      if (!jefT[nom]) return;
      if (jefN[nom]) return;
      const key = nom + '|N→T';
      if (visto[key]) return;
      visto[key] = true;
      nombres[nom] = true;
      const corto = _nombreCortoResumen(nom);
      const ctDestH = jefT[nom].ct ? _htmlCtBadge(jefT[nom].ct) : '';
      lineasNoche.push(
        _escHtmlResumen(corto) + ' pasó a la tarde' +
        (ctDestH ? ' ' + ctDestH : '') + '.'
      );
    });

    return {
      porOrigen: {
        TARDE: lineasTarde.join('\n'),
        NOCHE: lineasNoche.join('\n')
      },
      nombres: nombres
    };
  }

  function _textoResumenJornadaDisponible() {
    try {
      if (originalData && originalData.resumenJornada) return String(originalData.resumenJornada);
      if (editableData && editableData.resumenJornada) return String(editableData.resumenJornada);
      if (typeof cacheFecha !== 'undefined' && cacheFecha) {
        for (const t of ['TARDE', 'NOCHE']) {
          const pack = cacheFecha[t];
          if (!pack) continue;
          if (pack.original && pack.original.resumenJornada) return String(pack.original.resumenJornada);
          if (pack.editable && pack.editable.resumenJornada) return String(pack.editable.resumenJornada);
        }
      }
    } catch (e) {}
    return '';
  }

  /** Informe de texto libre de jefes (por fecha, compartido TARDE/NOCHE) */
  function _leerInformeTextoFecha() {
    try {
      if (editableData && editableData.informeTexto != null && String(editableData.informeTexto).trim()) {
        return String(editableData.informeTexto);
      }
      if (originalData && originalData.informeTexto != null && String(originalData.informeTexto).trim()) {
        return String(originalData.informeTexto);
      }
      if (typeof cacheFecha !== 'undefined' && cacheFecha) {
        for (const t of ['TARDE', 'NOCHE']) {
          const pack = cacheFecha[t];
          if (!pack) continue;
          const e = pack.editable || pack.original;
          const o = pack.original || pack.editable;
          if (e && e.informeTexto != null && String(e.informeTexto).trim()) return String(e.informeTexto);
          if (o && o.informeTexto != null && String(o.informeTexto).trim()) return String(o.informeTexto);
        }
      }
      // Historial de la fecha actual
      const fechaStr = (document.getElementById('fecha') && document.getElementById('fecha').value) ||
        (editableData && editableData.fecha) || (originalData && originalData.fecha) || '';
      if (fechaStr && Array.isArray(historial)) {
        const clave = (typeof normalizarFechaClave === 'function')
          ? normalizarFechaClave(fechaStr) : String(fechaStr);
        for (let i = 0; i < historial.length; i++) {
          const r = historial[i];
          if (!r) continue;
          const rf = (typeof normalizarFechaClave === 'function')
            ? normalizarFechaClave(r.fecha) : String(r.fecha || '');
          if (rf !== clave) continue;
          const e = r.editable || r.original || {};
          const o = r.original || r.editable || {};
          if (e.informeTexto != null && String(e.informeTexto).trim()) return String(e.informeTexto);
          if (o.informeTexto != null && String(o.informeTexto).trim()) return String(o.informeTexto);
        }
      }
    } catch (e) {}
    return '';
  }

  function _propagarInformeTexto(txt) {
    const t = (txt == null) ? '' : String(txt);
    try {
      if (editableData) editableData.informeTexto = t;
      if (originalData) originalData.informeTexto = t;
      if (typeof cacheFecha !== 'undefined' && cacheFecha) {
        ['TARDE', 'NOCHE'].forEach(function (tn) {
          const pack = cacheFecha[tn];
          if (!pack) return;
          if (pack.editable) pack.editable.informeTexto = t;
          if (pack.original) pack.original.informeTexto = t;
        });
      }
    } catch (e) {}
  }

  /** Solo jefes de piso (no cabina, no admin con rol cabina). */
  function puedeUsarInformeJefes() {
    try {
      if (typeof cargarSesion === 'function') cargarSesion();
    } catch (e) {}
    if (typeof sesionActual === 'undefined' || !sesionActual || !sesionActual.user) return false;
    // Personal de cabina / cierre / admin: no editan ni ven el ícono
    if (sesionActual.esAdmin) return false;
    if (sesionActual.puedeCabina || sesionActual.puedeCierreFinal) return false;
    if (typeof puedeOperarCabina === 'function' && puedeOperarCabina()) return false;
    return true;
  }

  function actualizarPanelInformeJefes() {
    const btn = document.getElementById('btnInformeJefes');
    if (!btn) return;
    const enJefes = (typeof modo !== 'undefined' && modo === 'editable');
    const esJefe = (typeof puedeUsarInformeJefes === 'function') && puedeUsarInformeJefes();
    // Solo jefes en hoja JEFES; Cabina no ve el ícono
    const mostrar = enJefes && esJefe;
    btn.style.display = mostrar ? '' : 'none';
    if (!mostrar) {
      try { cerrarPanelInformeJefes(); } catch (e) {}
    }
  }

  function abrirPanelInformeJefes() {
    const panel = document.getElementById('panel-informe-jefes');

  async function cierreFinalFecha(opts) {
    opts = opts || {};

      } else if (!originalBloqueado) {

      ['TARDE', 'NOCHE'].forEach(function (t) {

      // Resumen de jornada: TARDE + NOCHE, con pasajes dentro de cada bloque de origen
      try {

        }
        const omitir = cruceInfo.nombres || {};
        const porOrigen = (cruceInfo.porOrigen) || {};
        const partes = [];
        ['TARDE', 'NOCHE'].forEach(function (t) {
          const pack = cacheFecha[t];
          if (!pack) return;
          const o = pack.original || pack.editable;

          const pasaje = String(porOrigen[t] || '').trim();

          const cuerpo = [txt, pasaje].filter(Boolean).join('\n');
          partes.push('— ' + t + ' —\n' + cuerpo);

        let txtResumen = partes.length

        // Informe de jefes (texto libre) debajo del resumen automático

        if (informeTxt) {

            : informeTxt.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
          txtResumen = txtResumen + '\n\n— INFORME —\n' + informeEsc;
        }
        if (originalData) {
          originalData.resumenJornada = txtResumen;
          if (informeTxt) originalData.informeTexto = informeTxt;
        }
        if (editableData) {
          editableData.resumenJornada = txtResumen;
          if (informeTxt) editableData.informeTexto = informeTxt;
        }
        ['TARDE', 'NOCHE'].forEach(function (t) {
          const pack = cacheFecha[t];
          if (!pack) return;
          if (pack.original) {
            pack.original.resumenJornada = txtResumen;
            if (informeTxt) pack.original.informeTexto = informeTxt;
          }
          if (pack.editable) {
            pack.editable.resumenJornada = txtResumen;
            if (informeTxt) pack.editable.informeTexto = informeTxt;
          }
        });
      } catch (eRes) {
        console.warn('resumenJornada', eRes);
      }

      // Guardar en historial (misma lógica que Guardar)
      if (!Array.isArray(historial)) historial = [];
      const turnosAGuardar = [];
      ['TARDE', 'NOCHE'].forEach(function (t) {
        if (cacheFecha[t] && cacheFecha[t].editable) turnosAGuardar.push(t);
      });
      if (!turnosAGuardar.length) turnosAGuardar.push(turnoActual);

      const guardados = [];
      const resumenET = [];
      turnosAGuardar.forEach(function (t) {
        const pack = cacheFecha[t];
        if (!pack || !pack.editable) return;
        try {
          // Solo CABINA (original). No marcar en Jefes.
          const cabina = pack.original || null;
          if (cabina) {
            const m = aplicarSalidasTempranoAutomaticas(cabina, t);
            if (m && m.length) resumenET.push(t + ' Cabina: ' + m.join('; '));
            else resumenET.push(t + ' Cabina: (sin marcas)');
          } else {
            resumenET.push(t + ' Cabina: (sin hoja original)');
          }
          // Limpiar marcas en Jefes (editable) — ET solo vive en Cabina
          function _limpiarET(d) {
            if (!d || !d.plantas) return;
            (d.plantas || []).forEach(function (pl) {

        const registro = {

        // Forzar flag de cierre en lo persistido

// Éxito: sin mensaje (solo alertas si hay error)
      if (typeof console !== 'undefined' && console.log) {

        console.log('Cierre final OK', guardados, resumenET);

    } catch (err) {

  /** Guarda el estado actual como borrador de la fecha en curso (sin ir al historial permanente). */
  function guardarBorradorActual() {
    try {
      // Solo persistir borrador si hay cambios reales sin guardar en el Historial
      if (!cambiosSinGuardar) {
        // Aun sin dirty: persistir cache de turnos para no perder TARDE al ir a NOCHE
        try { guardarEstadoActualEnCache(); } catch (eC) {}
      }
      // Primero sincronizar cache del turno actual
      guardarEstadoActualEnCache();
      const fechaClave = normalizarFechaClave(
        (originalData && originalData.fecha) ||
        (editableData && editableData.fecha) ||
        document.getElementById('fecha')?.value || ''
      );
      if (!fechaClave) return;
      if (!borradoresPorFecha[fechaClave]) borradoresPorFecha[fechaClave] = {};
      // Guardar ambos turnos si están en cacheFecha
      ['TARDE', 'NOCHE'].forEach(t => {
        if (cacheFecha[t]) {
          borradoresPorFecha[fechaClave][t] = {
            original: JSON.parse(JSON.stringify(cacheFecha[t].original)),
            editable: cacheFecha[t].editable ? JSON.parse(JSON.stringify(cacheFecha[t].editable)) : null,
            bloqueado: !!cacheFecha[t].bloqueado,
            cierreFinal: !!cacheFecha[t].cierreFinal
          };
        }
      });
      // También asegurar el turno actual
      const turno = (document.getElementById('turno-display').value || '').trim().toUpperCase() || 'TARDE';
      if (cacheFecha[turno]) {
        borradoresPorFecha[fechaClave][turno] = {
          original: JSON.parse(JSON.stringify(cacheFecha[turno].original)),
          editable: cacheFecha[turno].editable ? JSON.parse(JSON.stringify(cacheFecha[turno].editable)) : null,
          bloqueado: !!cacheFecha[turno].bloqueado,
          cierreFinal: !!cacheFecha[turno].cierreFinal
        };
      }
      localStorage.setItem('tablero_borradores', JSON.stringify(borradoresPorFecha));
    } catch (e) {
      console.warn('No se pudo guardar borrador', e);
    }
  }

  /** Inferir si un registro de historial estaba registrado (📋) */
  function inferirBloqueadoDesdeReg(reg) {
    if (!reg) return false;
    if (typeof reg.bloqueado === 'boolean') return reg.bloqueado;
    const cierre = !!(reg.editable && reg.editable.cierreFinal) ||
      !!(reg.original && reg.original.cierreFinal);
    if (cierre) return true;
    // Legacy sin flag: si JEFES tiene nombres, se asume que hubo registro
    let n = 0;
    try {
      const src = reg.editable || null;
      if (!src || !src.plantas) return false;
      (src.plantas || []).forEach(function (p) {
        (p.secciones || []).forEach(function (s) {
          if ((s.titulo || '').trim().toUpperCase() === 'NOVEDADES') return;
          (s.filas || []).forEach(function (f) {
            if ((f.nombre || '').trim()) n++;
          });
        });
      });
    } catch (e) { return false; }
    return n > 0;
  }

  function cargarTurnoDesdeCacheOHistorial(turnoDestino) {
    const t = turnoDestino.toUpperCase();
    if (cacheFecha[t]) {
      originalData = JSON.parse(JSON.stringify(cacheFecha[t].original));
      editableData = cacheFecha[t].editable
        ? JSON.parse(JSON.stringify(cacheFecha[t].editable))
        : JSON.parse(JSON.stringify(cacheFecha[t].original));
      originalBloqueado = !!cacheFecha[t].bloqueado;
      // No activar cierre global acá; lo decide cambiarTurno / cargarFecha
      return true;
    }
    // Buscar en historial por fecha actual + turno
    const fechaActual = normalizarFechaClave(
      (originalData && originalData.fecha) ||
      document.getElementById('fecha')?.value || ''
    );
    const reg = (historial || []).find(r =>
      normalizarFechaClave(r.fecha) === fechaActual &&
      (r.turno || '').trim().toUpperCase() === t
    );
    if (!reg) {
      return false;
    }
    originalData = JSON.parse(JSON.stringify(reg.original));
    editableData = JSON.parse(JSON.stringify(reg.editable || reg.original));
    const regBloqueado = inferirBloqueadoDesdeReg(reg);
    originalBloqueado = regBloqueado;
    cacheFecha[t] = {
      original: JSON.parse(JSON.stringify(originalData)),
      editable: JSON.parse(JSON.stringify(editableData)),
      bloqueado: regBloqueado,
      cierreFinal: !!(reg.editable && reg.editable.cierreFinal) ||
        !!(reg.original && reg.original.cierreFinal)
    };
    return true;
  }

  /** Registrado = se usó 📋 en ESE turno (cache.bloqueado). No basta con existir en historial. */
  function turnoEstaRegistrado(turnoNorm) {
    const t = (turnoNorm || '').trim().toUpperCase();
    return !!(cacheFecha[t] && cacheFecha[t].bloqueado);
  }

  function cambiarTurnoMismaFecha() {
    try { if (typeof restaurarTodosReveladosJefes === 'function') restaurarTodosReveladosJefes(); } catch (e) {}

    const actual = (document.getElementById('turno-display').value || '').trim().toUpperCase() || 'TARDE';
    const destino = actual === 'NOCHE' ? 'TARDE' : 'NOCHE';

    // Cambio TARDE/NOCHE: sin preguntar (queda en cache/borrador de la misma fecha)

    // 1) Guardar el turno de origen (no contaminar el destino)
    try {
      guardarEstadoActualEnCache();
      if (cacheFecha[actual]) {
        cacheFecha[actual].bloqueado = !!originalBloqueado;
        cacheFecha[actual].cierreFinal = !!cierreFinalActivo;
      }
      guardarBorradorActual();
    } catch (e) { console.warn(e); }

    // 2) Cargar o crear destino
    let cargado = false;
    try {
      cargado = !!cargarTurnoDesdeCacheOHistorial(destino);
    } catch (e) {
      cargado = false;
    }

    if (!cargado) {
      const base = JSON.parse(JSON.stringify(originalData || editableData || {}));
      base.turno = destino;
      base.cierreFinal = false;
      (base.plantas || []).forEach(function (p) {
        (p.secciones || []).forEach(function (s) {
          (s.filas || []).forEach(function (f) {
            if ('check' in f) f.check = false;
            if (Array.isArray(f.slots)) f.slots = f.slots.map(function () { return 0; });
          });
        });
      });
      originalData = base;
      editableData = JSON.parse(JSON.stringify(base));
      originalBloqueado = false;
      cacheFecha[destino] = {
        original: JSON.parse(JSON.stringify(originalData)),
        editable: JSON.parse(JSON.stringify(editableData)),
        bloqueado: false,
        cierreFinal: false
      };
    }

    // 3) Criterio único: ¿este turno tiene 📋 (bloqueado)?
    //    Si se cargó del historial, cargarTurno marca bloqueado=true → registrado.
    //    Si solo existe por sorteo/creación, bloqueado=false → NO registrado.
    const registrado = !!(cacheFecha[destino] && cacheFecha[destino].bloqueado);

    // Sincronizar datos desde cache del destino
    if (cacheFecha[destino] && cacheFecha[destino].original) {
      originalData = JSON.parse(JSON.stringify(cacheFecha[destino].original));
      originalData.turno = destino;
      editableData = JSON.parse(JSON.stringify(
        cacheFecha[destino].editable || cacheFecha[destino].original
      ));
      editableData.turno = destino;
    } else if (originalData) {
      originalData.turno = destino;
      if (editableData) editableData.turno = destino;
    }

    const td = document.getElementById('turno-display');
    if (td) td.value = destino;
    aplicarEstiloTurno(destino);

    if (!registrado) {
      originalBloqueado = false;
      accesoLibre = true;
      cierreFinalActivo = false;
      if (originalData) originalData.cierreFinal = false;
      if (editableData) editableData.cierreFinal = false;
      modo = 'editable';
      document.body.classList.add('modo-editable');
      document.body.classList.remove('modo-original');
      mostrarVista('editable');
      return;
    }

    // Registrado: Cabina bloqueada; conservar hoja actual
    originalBloqueado = true;
    // Cierre final SOLO si el turno destino realmente lo tiene (no heredar del otro)
    const destCierre = !!(cacheFecha[destino] && cacheFecha[destino].cierreFinal);
    cierreFinalActivo = destCierre;
    if (originalData) originalData.cierreFinal = destCierre;
    if (editableData) editableData.cierreFinal = destCierre;
    accesoLibre = !destCierre;
    const hoja = (modo === 'editable') ? 'editable' : 'original';
    mostrarVista(hoja);
  }

  function fechasUnicasHistorial() {
    const map = new Map();
    (historial || []).forEach((reg, idx) => {
      const k = normalizarFechaClave(reg.fecha);
      if (!k) return;
      if (!map.has(k)) {
        map.set(k, { fecha: reg.fecha, indices: [idx], turnos: [(reg.turno || '').toUpperCase()], fechaGuardado: reg.fechaGuardado });
      } else {
        const e = map.get(k);
        e.indices.push(idx);
        const tu = (reg.turno || '').toUpperCase();
        if (!e.turnos.includes(tu)) e.turnos.push(tu);
        // quedarse con el guardado más reciente visualmente
        e.fechaGuardado = reg.fechaGuardado || e.fechaGuardado;
      }
    });
    return Array.from(map.values());
  }

  /** Parsea "LUNES, 30 DE AGOSTO DE 2026" → Date o null */
  function parseFechaHistorial(fechaStr) {
    if (!fechaStr) return null;
    const s = String(fechaStr).trim().toUpperCase();
    const m = s.match(/(\d{1,2})\s+DE\s+([A-ZÁÉÍÓÚÑ]+)\s+DE\s+(\d{4})/);
    if (!m) return null;
    const mesesNom = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
    const mi = mesesNom.indexOf(m[2].normalize('NFD').replace(/[\u0300-\u036f]/g, ''));
    // try with accents too
    const mi2 = mi >= 0 ? mi : ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'].indexOf(m[2]);
    const mes = mi >= 0 ? mi : (mesesNom.indexOf(m[2]) >= 0 ? mesesNom.indexOf(m[2]) : -1);
    // simpler map
    const mapMes = {
      ENERO:0, FEBRERO:1, MARZO:2, ABRIL:3, MAYO:4, JUNIO:5,
      JULIO:6, AGOSTO:7, SEPTIEMBRE:8, OCTUBRE:9, NOVIEMBRE:10, DICIEMBRE:11
    };
    const mesIdx = mapMes[m[2].normalize('NFD').replace(/[\u0300-\u036f]/g, '')];
    if (mesIdx === undefined) return null;
    const dia = parseInt(m[1], 10);
    const anio = parseInt(m[3], 10);
    const d = new Date(anio, mesIdx, dia);
    if (d.getFullYear() !== anio || d.getMonth() !== mesIdx || d.getDate() !== dia) return null;
    return d;
  }

  /** Fechas del historial ordenadas cronológicamente (más antigua → más reciente) */
  function fechasHistorialOrdenadas() {
    const grupos = fechasUnicasHistorial();
    grupos.forEach(g => {
      g._date = parseFechaHistorial(g.fecha);
      g._clave = normalizarFechaClave(g.fecha);
    });
    grupos.sort((a, b) => {
      if (a._date && b._date) return a._date - b._date;
      if (a._date) return -1;
      if (b._date) return 1;
      return (a.fecha || '').localeCompare(b.fecha || '');
    });
    return grupos;
  }

  function cargarFechaDesdeGrupo(g) {
    if (!g) return;
    const fechaClave = normalizarFechaClave(g.fecha);
    // Conservar turno (TARDE/NOCHE) de donde venimos
    const turnoDeseado = (document.getElementById('turno-display')?.value || originalData?.turno || editableData?.turno || 'TARDE').trim().toUpperCase();
    cacheFecha = {};

    // 1) Preferir borrador SOLO si existe (implica cambios reales sin guardar)
    const borrador = borradoresPorFecha[fechaClave];
    if (borrador && (borrador.TARDE || borrador.NOCHE)) {
      ['TARDE', 'NOCHE'].forEach(t => {
        if (borrador[t]) {
          cacheFecha[t] = {
            original: JSON.parse(JSON.stringify(borrador[t].original)),
            editable: borrador[t].editable ? JSON.parse(JSON.stringify(borrador[t].editable)) : null,
            bloqueado: !!borrador[t].bloqueado,
            cierreFinal: !!borrador[t].cierreFinal
          };
        }
      });
      cambiosSinGuardar = true;
    } else {
      // Sin borrador pendiente: limpiar residual si hubiera
      if (borradoresPorFecha[fechaClave]) {
        delete borradoresPorFecha[fechaClave];
        try { localStorage.setItem('tablero_borradores', JSON.stringify(borradoresPorFecha)); } catch (e) {}
      }
      // 2) Si no hay borrador, cargar desde historial permanente
      const regs = (historial || []).filter(r => normalizarFechaClave(r.fecha) === fechaClave);
      regs.forEach(reg => {
        const t = (reg.turno || 'TARDE').trim().toUpperCase();
        const cierre = !!(reg.editable && reg.editable.cierreFinal) || !!(reg.original && reg.original.cierreFinal);
        // bloqueado: preferir flag guardado; si no hay, solo cierre implica bloqueado
        // (no asumir registrado solo por existir en historial)
        const bloq = inferirBloqueadoDesdeReg(reg) || cierre;
        cacheFecha[t] = {
          original: JSON.parse(JSON.stringify(reg.original)),
          editable: JSON.parse(JSON.stringify(reg.editable)),
          bloqueado: bloq,
          cierreFinal: cierre
        };
      });
      cambiosSinGuardar = false;
    }
    actualizarIndicadorBorrador();

    const orden = [turnoDeseado, 'TARDE', 'NOCHE'];
    let elegido = orden.find(t => cacheFecha[t]) || Object.keys(cacheFecha)[0];
    if (!elegido) return;
    originalData = JSON.parse(JSON.stringify(cacheFecha[elegido].original));
    editableData = cacheFecha[elegido].editable
      ? JSON.parse(JSON.stringify(cacheFecha[elegido].editable))
      : JSON.parse(JSON.stringify(cacheFecha[elegido].original));
    originalBloqueado = !!cacheFecha[elegido].bloqueado;
    // Cierre final si cualquier turno de la fecha lo tiene
    let cierreFecha = !!(cacheFecha[elegido].cierreFinal ||
      (editableData && editableData.cierreFinal) ||
      (originalData && originalData.cierreFinal));
    if (!cierreFecha) {
      ['TARDE', 'NOCHE'].forEach(function (t) {
        if (cacheFecha[t] && (cacheFecha[t].cierreFinal ||
            (cacheFecha[t].editable && cacheFecha[t].editable.cierreFinal) ||
            (cacheFecha[t].original && cacheFecha[t].original.cierreFinal))) {
          cierreFecha = true;
        }
      });
    }
    cierreFinalActivo = cierreFecha;
    // Con cierre final: hojas en solo lectura hasta 🔓 (navegación libre)
    accesoLibre = false;
    if (!cierreFinalActivo) {
      // Sin cierre: libre si ya está registrado
      accesoLibre = true;
    }
    // Conservar la hoja actual (Cabina o Jefes)
    const hojaDestino = (modo === 'original') ? 'original' : 'editable';
    // Nueva fecha → historial de deshacer limpio
    undoStack = [];
    redoStack = [];
    mostrarVista(hojaDestino);
    actualizarSliderFecha();
    refrescarUndoBaseline();
    actualizarBotonesUndo();
    try { if (typeof sincronizarVisperaDesdeProg === 'function') sincronizarVisperaDesdeProg(); } catch (e) {}
  }

  function actualizarSliderFecha() {
    const slider = document.getElementById('fecha-slider');
    if (!slider) return;
    const grupos = fechasHistorialOrdenadas();
    window._histGruposOrdenados = grupos;
    if (!grupos.length) {
      slider.min = 0;
      slider.max = 0;
      slider.value = 0;
      slider.disabled = true;
      return;
    }
    slider.disabled = false;
    slider.min = 0;
    slider.max = String(grupos.length - 1);
    const claveActual = normalizarFechaClave(
      (originalData && originalData.fecha) ||
      document.getElementById('fecha')?.value || ''
    );
    let idx = grupos.findIndex(g => g._clave === claveActual);
    if (idx < 0) idx = grupos.length - 1;
    slider.value = String(idx);
  }

  function onSliderFechaChange() {
    const slider = document.getElementById('fecha-slider');
    if (!slider || slider.disabled) return;
    const grupos = window._histGruposOrdenados || fechasHistorialOrdenadas();
    const idx = parseInt(slider.value, 10);
    const g = grupos[idx];
    if (!g) return;
    const claveActual = normalizarFechaClave(
      (originalData && originalData.fecha) || document.getElementById('fecha')?.value || ''
    );
    if (g._clave === claveActual) return;
    if (!confirmarSalirSinGuardar('cambiar de fecha')) {
      // revertir slider a la fecha actual
      try { actualizarSliderFecha(); } catch (e) {}
      return;
    }
    guardarBorradorActual();
    cargarFechaDesdeGrupo(g);
  }

  let calVistaAnio = null;
  let calVistaMes = null; // 0-11

  function toggleCalendario(e) {
    if (e) e.stopPropagation();
    const popup = document.getElementById('cal-popup');
    if (!popup) return;
    if (popup.classList.contains('show')) {
      popup.classList.remove('show');
      return;
    }
    const d = parseFechaHistorial(
      (originalData && originalData.fecha) || document.getElementById('fecha')?.value
    ) || new Date();
    calVistaAnio = d.getFullYear();
    calVistaMes = d.getMonth();
    renderCalendario();
    popup.classList.add('show');
  }

  function renderCalendario() {
    const popup = document.getElementById('cal-popup');
    if (!popup) return;
    if (calVistaAnio == null) {
      const d = new Date();
      calVistaAnio = d.getFullYear();
      calVistaMes = d.getMonth();
    }
    const grupos = fechasHistorialOrdenadas();
    const histKeys = new Set();
    const histByDay = {}; // 'YYYY-M-D' -> group
    grupos.forEach(g => {
      if (!g._date) return;
      const key = g._date.getFullYear() + '-' + g._date.getMonth() + '-' + g._date.getDate();
      histKeys.add(key);
      histByDay[key] = g;
    });
    // Días con borrador (cambios sin guardar)
    const borradorKeys = new Set();
    Object.keys(borradoresPorFecha || {}).forEach(fk => {
      // fk es texto de fecha normalizado; intentar parsear
      const d = parseFechaHistorial(fk) || parseFechaHistorial(
        (Object.values(borradoresPorFecha[fk] || {})[0] || {}).original?.fecha ||
        (Object.values(borradoresPorFecha[fk] || {})[0] || {}).editable?.fecha
      );
      if (d) {
        const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        borradorKeys.add(key);
      }
    });
    const mesesNom = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const primer = new Date(calVistaAnio, calVistaMes, 1);
    const startPad = (primer.getDay() + 6) % 7; // lunes=0
    const diasEnMes = new Date(calVistaAnio, calVistaMes + 1, 0).getDate();
    const hoy = new Date();
    const claveSel = normalizarFechaClave(
      (originalData && originalData.fecha) || document.getElementById('fecha')?.value || ''
    );

    let html = '<div class="cal-header">';
    html += '<button type="button" id="cal-prev">‹</button>';
    html += '<span>' + mesesNom[calVistaMes] + ' ' + calVistaAnio + '</span>';
    html += '<button type="button" id="cal-next">›</button>';
    html += '</div><div class="cal-grid">';
    ['Lu','Ma','Mi','Ju','Vi','Sa','Do'].forEach(d => {
      html += '<div class="cal-dow">' + d + '</div>';
    });
    for (let i = 0; i < startPad; i++) {
      html += '<button type="button" class="cal-day" disabled></button>';
    }
    for (let dia = 1; dia <= diasEnMes; dia++) {
      const key = calVistaAnio + '-' + calVistaMes + '-' + dia;
      const tiene = histKeys.has(key);
      const g = histByDay[key];
      const esHoy = hoy.getFullYear() === calVistaAnio && hoy.getMonth() === calVistaMes && hoy.getDate() === dia;
      let cls = 'cal-day en-mes';
      if (tiene) cls += ' tiene-hist';
      const tieneBorrador = borradorKeys.has(key);
      if (tieneBorrador) cls += ' tiene-borrador';
      if (esHoy) cls += ' hoy';
      if ((tiene || tieneBorrador) && ((g && g._clave === claveSel) || (tieneBorrador && !tiene))) cls += ' seleccionada';
      // Permitir clic también en días que solo tienen borrador
      const clickable = tiene || tieneBorrador;
      html += '<button type="button" class="' + cls + '" data-dia="' + dia + '"' +
        (clickable ? ' data-tiene="1"' : ' disabled') + '>' + dia + '</button>';
    }
    html += '</div><div class="cal-leyenda">Azul = guardado en Historial &nbsp;·&nbsp; Amarillo = borrador sin guardar</div>';
    popup.innerHTML = html;

    popup.querySelector('#cal-prev').onclick = (ev) => {
      ev.stopPropagation();
      calVistaMes--;
      if (calVistaMes < 0) { calVistaMes = 11; calVistaAnio--; }
      renderCalendario();
    };
    popup.querySelector('#cal-next').onclick = (ev) => {
      ev.stopPropagation();
      calVistaMes++;
      if (calVistaMes > 11) { calVistaMes = 0; calVistaAnio++; }
      renderCalendario();
    };
    popup.querySelectorAll('.cal-day.tiene-hist, .cal-day.tiene-borrador').forEach(btn => {
      btn.onclick = (ev) => {
        ev.stopPropagation();
        if (!confirmarSalirSinGuardar('cambiar de fecha (calendario)')) return;
        const dia = parseInt(btn.getAttribute('data-dia'), 10);
        const key = calVistaAnio + '-' + calVistaMes + '-' + dia;
        let g = histByDay[key];
        if (!g) {
          // Solo hay borrador: construir un grupo mínimo a partir del borrador
          const d = new Date(calVistaAnio, calVistaMes, dia);
          const mesesNom = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
          const diasSem = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
          const fechaStr = diasSem[d.getDay()] + ', ' + dia + ' DE ' + mesesNom[calVistaMes] + ' DE ' + calVistaAnio;
          g = { fecha: fechaStr, _clave: normalizarFechaClave(fechaStr), _date: d };
        }
        if (g) {
          guardarBorradorActual();
          cargarFechaDesdeGrupo(g);
          popup.classList.remove('show');
        }
      };
    });
  }

  function abrirHistorial() {
    try {
      const lista = document.getElementById('historial-lista');
      const modal = document.getElementById('modal-historial');
      lista.innerHTML = '';
      // Orden por fecha real del tablero (más reciente arriba), no por cuándo se guardó
      const grupos = (typeof fechasHistorialOrdenadas === 'function'
        ? fechasHistorialOrdenadas()
        : fechasUnicasHistorial()
      ).slice().reverse();
      if (!grupos.length) {
        lista.innerHTML = '<div class="hist-vacio">No hay registros guardados todavía.<br><br>Usá el botón <strong>Guardar</strong> en la hoja JEFES para crear el primer cierre.</div>';
      } else {
        grupos.forEach((g, gIdx) => {
          const item = document.createElement('div');
          item.className = 'hist-item';
          item.innerHTML = `
            <div class="hist-info">
              <strong>${g.fecha}</strong><br>
              <small style="color:#888">Guardado: ${g.fechaGuardado || ''}</small>
            </div>
            <div class="hist-btns">
              <button class="btn-cargar-orig" onclick="cargarFechaDesdeHistorial(${gIdx})">Cargar</button>
              <button class="btn-borrar-hist" onclick="borrarFechaDelHistorial(${gIdx})">🗑</button>
            </div>
          `;
          item.dataset.gIdx = gIdx;
          lista.appendChild(item);
        });
        window._histGrupos = grupos;
      }
      modal.classList.add('show');
    } catch (err) {
      alert('Error al abrir el historial:\n' + err.message);
      console.error(err);
    }
  }

  function cargarFechaDesdeHistorial(gIdx) {
    try {
      const grupos = window._histGrupos || fechasUnicasHistorial();
      const g = grupos[gIdx];
      if (!g) return;
      const claveActual = normalizarFechaClave(
        (originalData && originalData.fecha) || document.getElementById('fecha')?.value || ''
      );
      if (g._clave && g._clave !== claveActual) {
        if (!confirmarSalirSinGuardar('cambiar de fecha (historial)')) return;
      }
      guardarBorradorActual();
      cargarFechaDesdeGrupo(g);
      cerrarHistorial();
    } catch (err) {
      alert('Error al cargar:\n' + err.message);
    }
  }

  function borrarFechaDelHistorial(gIdx) {
    const clave = prompt('Ingresá la clave de autorización para borrar esta fecha:');
    if (clave === null) return;
    if (clave.trim() !== '1318') {
      alert('❌ Clave incorrecta. No se borró el registro.');
      return;
    }
    const grupos = window._histGrupos || fechasUnicasHistorial();
    const g = grupos[gIdx];
    if (!g) return;
    if (!confirm('¿Borrar todos los turnos de\n' + g.fecha + '?')) return;
    const fechaClave = normalizarFechaClave(g.fecha);
    historial = (historial || []).filter(r => normalizarFechaClave(r.fecha) !== fechaClave);

      (async function () {
        try {
          if (navigator.share) {

        try {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = nombreArchivo + '.png';
          document.body.appendChild(a);
          a.click();

  function inicializarProgramacionSept() {
    const root = document.getElementById('vista-prog');
    if (!root) return;
    const CODIGOS = [
      {v:"", label:"—"}, {v:"MD", label:"MD"}, {v:"MS", label:"MS"},
      {v:"T3", label:"T3"}, {v:"T", label:"T"}, {v:"TE", label:"TE"},
      {v:"N", label:"N"}, {v:"E", label:"E"}, {v:"E1", label:"E1"}, {v:"X", label:"X"},
      {v:"IN", label:"IN"}, {v:"F", label:"F"}, {v:"LAO", label:"LAO"},
      {v:"FC", label:"FC"}, {v:"DV", label:"DV"}, {v:"NP", label:"NP"},
      {v:"TP", label:"TP"}, {v:"14F", label:"14F"}, {v:"BLOQ", label:"❌"},
      {v:"?", label:"?"}
    ];
    const CLASES_COLOR = ["md","ms","t3","t","te","n","e","e1","x","in","f","lao","fc","dv","np","tp","f14","bloq","duda","vacio"];
    const STORAGE_PREFIX = "progSept2026_";
    const SNAPSHOT_KEY = "progSept2026_SNAPSHOT";
    let viendoOriginal = false;

    function claseColor(codigo) {
      const c = (codigo || "").trim().toLowerCase();
      const mapa = {
        "md":"md","ms":"ms","t3":"t3","t":"t","te":"te","n":"n","e":"e","e1":"e1","x":"x",
        "in":"in","f":"f","lao":"lao","fc":"fc","dv":"dv","np":"np","tp":"tp",
        "14f":"f14","bloq":"bloq","?":"duda"
      };
      return mapa[c] || "vacio";
    }
    function aplicarClase(td, codigo) {
      td.classList.remove(...CLASES_COLOR);
      td.classList.add(claseColor(codigo));
    }
    function valorCelda(td) {
      const legajo = td.getAttribute('data-legajo');
      const dia = td.getAttribute('data-dia');
      const original = td.getAttribute('data-code') || "";
      const key = STORAGE_PREFIX + legajo + "_" + dia;
      const guardado = localStorage.getItem(key);
      return (guardado !== null) ? guardado : original;
    }
    function setSelectValue(select, valor) {
      // asegurar opción si no existe
      if (valor && !Array.from(select.options).some(o => o.value === valor)) {
        const o = document.createElement('option');
        o.value = valor;
        o.textContent = valor;
        select.appendChild(o);
      }
      select.value = valor;
    }
    function crearSelect(td) {
      if (td.querySelector('select')) return;
      const legajo = td.getAttribute('data-legajo');
      const dia = td.getAttribute('data-dia');
      const original = td.getAttribute('data-code') || "";
      const key = STORAGE_PREFIX + legajo + "_" + dia;
      const valorInicial = valorCelda(td);
      const select = document.createElement('select');
      CODIGOS.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt.v;
        o.textContent = opt.label;
        select.appendChild(o);
      });
      setSelectValue(select, valorInicial);
      select.addEventListener('change', () => {
        if (viendoOriginal) return;
        aplicarClase(td, select.value);
        localStorage.setItem(key, select.value);
        marcarPendienteGuardar();
        try { actualizarTotalesHEProg(); } catch (e) {}
      });
      td.innerHTML = '';
      td.appendChild(select);
      aplicarClase(td, valorInicial);
    }
    function marcarPendienteGuardar() {
      const el = root.querySelector('#prog-estado-guardado');
      if (!el) return;
      el.classList.remove('ok');
      el.textContent = 'Hay cambios — podés pulsar 💾 Guardar para confirmar el snapshot.';
    }
    function aplicarValoresAGrilla(usarOriginal) {
      root.querySelectorAll('td[data-code]').forEach(function (td) {
        const select = td.querySelector('select');
        if (!select) return;
        const original = td.getAttribute('data-code') || "";
        const val = usarOriginal ? original : valorCelda(td);
        setSelectValue(select, val);
        aplicarClase(td, val);
        const sinSesion = (typeof puedeModificarTablero === 'function' && !puedeModificarTablero());
        select.disabled = !!usarOriginal || sinSesion;
      });
      try { actualizarTotalesHEProg(); } catch (e) {}
    }
    function guardarProgramacion() {
      if (typeof puedeModificarTablero === 'function' && !puedeModificarTablero()) {
        alert('Sin sesión no se puede modificar la programación.\nIniciá sesión para editar.');
        return;
      }
      if (viendoOriginal) {
        alert('Estás viendo el original. Volvé a la vista actual para guardar cambios.');
        return;
      }
      const snap = {};
      let n = 0;
      root.querySelectorAll('td[data-code]').forEach(function (td) {
        const legajo = td.getAttribute('data-legajo');
        const dia = td.getAttribute('data-dia');
        const select = td.querySelector('select');
        const val = select ? select.value : valorCelda(td);
        const key = STORAGE_PREFIX + legajo + "_" + dia;
        localStorage.setItem(key, val);
        snap[legajo + "_" + dia] = val;
        n++;
      });
      try {
        localStorage.setItem(SNAPSHOT_KEY, JSON.stringify({
          fechaGuardado: new Date().toLocaleString('es-AR'),
          celdas: snap
        }));
      } catch (e) { console.warn(e); }
      const el = root.querySelector('#prog-estado-guardado');
      if (el) {
        el.classList.add('ok');
        el.textContent = '✅ Guardado (' + n + ' celdas) — ' + new Date().toLocaleString('es-AR');
      }
    }
    function toggleVerOriginal() {
      const btn = root.querySelector('#btn-prog-ver-original');
      const badge = root.querySelector('#prog-badge-vista');
      viendoOriginal = !viendoOriginal;
      root.classList.toggle('modo-original-prog', viendoOriginal);
      if (viendoOriginal) {
        aplicarValoresAGrilla(true);
        if (btn) {
          btn.textContent = '✏️ Ver actual';
          btn.classList.add('activo-vista');
        }
        if (badge) {
          badge.style.display = 'inline';
          badge.textContent = 'Vista: ORIGINAL (solo lectura)';
        }
        // Los 3 botones permanecen visibles en la misma posición
        const bg = root.querySelector('#btn-prog-guardar');
        const br = root.querySelector('#btn-reset');
        if (bg) bg.style.visibility = 'visible';
        if (br) br.style.visibility = 'visible';
      } else {
        aplicarValoresAGrilla(false);
        if (btn) {
          btn.textContent = '👁 Ver original';
          btn.classList.remove('activo-vista');
        }
        if (badge) {
          badge.style.display = 'none';
          badge.textContent = '';
        }
        const bg = root.querySelector('#btn-prog-guardar');
        const br = root.querySelector('#btn-reset');
        if (bg) bg.style.visibility = 'visible';
        if (br) br.style.visibility = 'visible';
      }
    }
    async function restablecerTodo() {
      if (typeof exigirAdmin === 'function') {
        if (!(await exigirAdmin('Restablecer programación (solo administrador)'))) return;
      } else {
        alert('❌ No autorizado.');
        return;
      }
      if (!confirm('¿Restablecer todos los casilleros a los valores originales?\nSe borrarán los cambios guardados de la Programación en este navegador.')) return;
      if (viendoOriginal) {
        viendoOriginal = false;
        root.classList.remove('modo-original-prog');
        const btn = root.querySelector('#btn-prog-ver-original');
        if (btn) {
          btn.textContent = '👁 Ver original';
          btn.classList.remove('activo-vista');
        }
        const badge = root.querySelector('#prog-badge-vista');
        if (badge) { badge.style.display = 'none'; badge.textContent = ''; }
      }
      root.querySelectorAll('td[data-code]').forEach(function (td) {
        const legajo = td.getAttribute('data-legajo');
        const dia = td.getAttribute('data-dia');
        localStorage.removeItem(STORAGE_PREFIX + legajo + "_" + dia);
      });
      try { localStorage.removeItem(SNAPSHOT_KEY); } catch (e) {}
      aplicarValoresAGrilla(false);
      root.querySelectorAll('td[data-code] select').forEach(function (s) { s.disabled = false; });
      const el = root.querySelector('#prog-estado-guardado');
      if (el) {
        el.classList.remove('ok');
        el.textContent = 'Restablecido a los valores originales.';
      }
    }

    root.querySelectorAll('td[data-code]').forEach(crearSelect);

    function pintarHeadersFeriadosProg() {
      const fer = (typeof cargarFeriadosProg === 'function') ? cargarFeriadosProg() : [];
      root.querySelectorAll('tr.dia-header th[data-prog-dia]').forEach(function (th) {
        const dia = parseInt(th.getAttribute('data-prog-dia'), 10);
        th.classList.remove('prog-feriado', 'prog-vispera');
        if (fer.indexOf(dia) >= 0) {
          th.classList.add('prog-feriado');
          th.title = 'Feriado (clic para quitar)';
        } else if (fer.indexOf(dia + 1) >= 0) {
          th.classList.add('prog-vispera');
          th.title = 'Víspera (día ' + (dia + 1) + ' es feriado)';
        } else {
          th.title = 'Clic para marcar feriado el día ' + dia;
        }
      });
    }
    window.pintarHeadersFeriadosProg = pintarHeadersFeriadosProg;
    root.querySelectorAll('tr.dia-header').forEach(function (tr) {
      tr.querySelectorAll('th').forEach(function (th) {
        if (th.classList.contains('col-legajo') || th.classList.contains('col-nombre') || th.classList.contains('col-he-prog')) return;
        const htmlTh = String(th.innerHTML || '');
        const m2 = htmlTh.match(/<br\s*\/?\s*>(\d{1,2})/i) || String(th.textContent || '').match(/(\d{1,2})/);
        if (!m2) return;
        const dia = parseInt(m2[1], 10);
        if (!dia || dia < 1 || dia > 30) return;
        th.setAttribute('data-prog-dia', String(dia));
        th.classList.add('prog-dia-click');
        if (!th._feriadoBound) {
          th._feriadoBound = true;
          th.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (typeof toggleFeriadoProg === 'function') toggleFeriadoProg(dia);
          });
        }
      });
    });
    try { pintarHeadersFeriadosProg(); } catch (e) {}

    function actualizarTotalesHEProg() {
      let per = null;
      try {
        if (typeof periodoLiquidacionHE === 'function') per = periodoLiquidacionHE();
      } catch (e) {}
      root.querySelectorAll('td.he-prog-total').forEach(function (tdTot) {
        const leg = tdTot.getAttribute('data-legajo-he');
        if (!leg) return;
        let sum = 0;
        root.querySelectorAll('td[data-code][data-legajo="' + leg + '"]').forEach(function (td) {
          const dia = parseInt(td.getAttribute('data-dia'), 10);
          if (!dia) return;
          // HE programadas = programación ORIGINAL (data-code), solo días del período 26→25
          const cod = String(td.getAttribute('data-code') || '').trim().toUpperCase();
          if (!cod) return;
          let fDate = null;
          try {
            fDate = (typeof fechaProgSept2026 === 'function')
              ? fechaProgSept2026(dia)
              : new Date(2026, 8, dia);
          } catch (e) { fDate = new Date(2026, 8, dia); }
          if (per && typeof fechaEnRangoHE === 'function') {
            if (!fechaEnRangoHE(fDate, per.desdeMs, per.hastaMs)) return;
          }
          let he = 0;
          try {
            if (typeof horasExtraPorCodigo === 'function') {
              he = horasExtraPorCodigo(cod, fDate, null) || 0;
            }
          } catch (e) { he = 0; }
          sum += he;
        });
        const v = Math.round(sum * 100) / 100;
        tdTot.textContent = v ? String(v).replace('.', ',') : '0';
        const lab = (per && per.label) ? per.label : '26→25';
        tdTot.title = 'HE programadas (original, período ' + lab + '): ' + v + ' hs';
      });
    }

    // Total HE al final de cada fila
    try { actualizarTotalesHEProg(); } catch (eHe) {}

    function filtrarProgramacionPorNombre() {
      const inp = root.querySelector('#prog-buscar-empleado');
      const btnLimp = root.querySelector('#btn-prog-limpiar-busqueda');
      const q = (inp && inp.value || '').trim().toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      if (btnLimp) btnLimp.style.display = q ? '' : 'none';
      const filas = Array.prototype.slice.call(root.querySelectorAll('table tbody tr'));
      let visibles = 0;

      // 1) Empleados: mostrar solo coincidencias
      filas.forEach(function (tr) {
        if (tr.classList.contains('dia-header') || tr.classList.contains('grupo-header')) return;
        const nomTd = tr.querySelector('td.nombre-cell');
        const legTd = tr.querySelector('td.legajo-cell');
        if (!nomTd && !legTd) {
          // fila auxiliar: ocultar con filtro
          tr.classList.toggle('prog-filtrado-oculto', !!q);
          return;
        }
        const nom = (nomTd && nomTd.textContent || '').toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const leg = (legTd && legTd.textContent || '').toLowerCase();
        const ok = !q || nom.indexOf(q) >= 0 || leg.indexOf(q) >= 0;
        tr.classList.toggle('prog-filtrado-oculto', !ok);
        if (ok) visibles++;
      });

      // 2) Encabezados de grupo y de fechas: visibles si hay empleado coincidente en ese bloque
      //    (así al buscar un cajero se mantiene la fila superior con las fechas de su grupo)
      function bloqueTieneEmpleadoVisible(startIdx) {
        for (let j = startIdx + 1; j < filas.length; j++) {
          const next = filas[j];
          if (next.classList.contains('grupo-header')) break;
          if (next.classList.contains('dia-header')) continue;
          if (!next.classList.contains('prog-filtrado-oculto') &&
              (next.querySelector('td.nombre-cell') || next.querySelector('td.legajo-cell'))) {
            return true;
          }
        }
        return false;
      }
      filas.forEach(function (tr, i) {
        if (!tr.classList.contains('dia-header') && !tr.classList.contains('grupo-header')) return;
        if (!q) {
          tr.classList.remove('prog-filtrado-oculto');
          return;
        }
        tr.classList.toggle('prog-filtrado-oculto', !bloqueTieneEmpleadoVisible(i));
      });

      if (inp && q) {
        inp.title = visibles ? ('Mostrando ' + visibles + ' empleado(s)') : 'Sin coincidencias';
      } else if (inp && !q) {
        inp.title = 'Escribí un nombre o legajo para ver solo su programación';
      }
    }

    const inpBuscar = root.querySelector('#prog-buscar-empleado');
    if (inpBuscar && !inpBuscar._boundFiltro) {
      inpBuscar._boundFiltro = true;
      inpBuscar.addEventListener('input', filtrarProgramacionPorNombre);
      inpBuscar.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          inpBuscar.value = '';
          filtrarProgramacionPorNombre();
          inpBuscar.blur();
        }
      });
    }
    const btnLimpBuscar = root.querySelector('#btn-prog-limpiar-busqueda');
    if (btnLimpBuscar && !btnLimpBuscar._boundFiltro) {
      btnLimpBuscar._boundFiltro = true;
      btnLimpBuscar.addEventListener('click', function () {
        if (inpBuscar) inpBuscar.value = '';
        filtrarProgramacionPorNombre();
        if (inpBuscar) inpBuscar.focus();
      });
    }

    const btnColoresProg = root.querySelector('#btn-prog-colores');
    if (btnColoresProg) {
      let esAdminProg = false;
      try {
        if (typeof cargarSesion === 'function') cargarSesion();
        if (typeof sesionActual !== 'undefined' && sesionActual && sesionActual.esAdmin) esAdminProg = true;
      } catch (e) {}
      btnColoresProg.style.display = esAdminProg ? '' : 'none';
      if (!btnColoresProg._bound) {
        btnColoresProg._bound = true;
        btnColoresProg.addEventListener('click', function () {
          if (typeof abrirPanelColoresProg === 'function') abrirPanelColoresProg();
        });
      }
    }
    try { if (typeof aplicarColoresProgPersonalizados === 'function') aplicarColoresProgPersonalizados(); } catch (e) {}

    const btnGuardar = root.querySelector('#btn-prog-guardar');
    if (btnGuardar && !btnGuardar._bound) {
      btnGuardar._bound = true;
      btnGuardar.addEventListener('click', guardarProgramacion);
    }
    const btnVerOrig = root.querySelector('#btn-prog-ver-original');
    if (btnVerOrig && !btnVerOrig._bound) {
      btnVerOrig._bound = true;
      btnVerOrig.addEventListener('click', toggleVerOriginal);
    }
    const btnReset = root.querySelector('#btn-reset');
    if (btnReset && !btnReset._bound) {
      btnReset._bound = true;
      btnReset.addEventListener('click', restablecerTodo);
    }
    if (btnReset) {
      let esAdmin = false;
      try {
        if (typeof sesionActual !== 'undefined' && sesionActual && sesionActual.esAdmin) esAdmin = true;
        else if (typeof cargarSesion === 'function') {
          cargarSesion();
          if (sesionActual && sesionActual.esAdmin) esAdmin = true;
        }
      } catch (e) {}
      btnReset.style.display = esAdmin ? '' : 'none';
    }

    // Estado inicial del mensaje
    try {
      const snapRaw = localStorage.getItem(SNAPSHOT_KEY);
      if (snapRaw) {
        const snap = JSON.parse(snapRaw);
        const el = root.querySelector('#prog-estado-guardado');
        if (el && snap.fechaGuardado) {
          el.classList.add('ok');
          el.textContent = 'Último guardado: ' + snap.fechaGuardado;
        }
      }
    } catch (e) {}
  }

  // Atajo Escape para cerrar programación
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      const v = document.getElementById('vista-prog');
      if (v && v.classList.contains('visible')) cerrarProgramacionSept();
    }
  });

</script>

    try { if (typeof mostrarVista === 'function') mostrarVista('editable'); } catch (e2) {}

      if (b.classList.contains('btn-reg') || b.id === 'btnProgSept') return;
      b.style.display = '';
      b.disabled = false;
    });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(irJefes, 0); setTimeout(irJefes, 200); });

})();
