  function _pintarSlotDesdeTd(td) {
    if (!paintState || !td) return;
    const pIdx = parseInt(td.getAttribute('data-p'), 10);
    const sIdx = parseInt(td.getAttribute('data-s'), 10);
    const fIdx = parseInt(td.getAttribute('data-f'), 10);
    const si = parseInt(td.getAttribute('data-si'), 10);
    if (isNaN(si)) return;
    const tr = td.parentNode;
    if (paintState.pIdx !== pIdx || paintState.sIdx !== sIdx || paintState.fIdx !== fIdx) return;
    let f = (tr && tr._filaRef) ? tr._filaRef : null;
    const dataRef = editableData || originalData;
    if (!f) {
      try { f = dataRef.plantas[pIdx].secciones[sIdx].filas[fIdx]; } catch (e0) { return; }
    }
    if (!f) return;
    if (typeof asegurarSlots === 'function') asegurarSlots(f);
    const next = paintState.mode === 'on' ? 1 : 0;
    if (f.slots[si] === next) return;
    f.slots[si] = next;
    try {
      if (dataRef && dataRef.plantas && dataRef.plantas[pIdx] &&
          dataRef.plantas[pIdx].secciones[sIdx] &&
          dataRef.plantas[pIdx].secciones[sIdx].filas[fIdx] &&
          dataRef.plantas[pIdx].secciones[sIdx].filas[fIdx] !== f) {
        const f2 = dataRef.plantas[pIdx].secciones[sIdx].filas[fIdx];
        if (typeof asegurarSlots === 'function') asegurarSlots(f2);
        f2.slots[si] = next;
      }
    } catch (eSync) {}
    try { marcarCambios(); } catch (e) {}
    let te = '';
    try {
      const sec = (dataRef && dataRef.plantas[pIdx] && dataRef.plantas[pIdx].secciones[sIdx])
        ? dataRef.plantas[pIdx].secciones[sIdx]
        : null;
      te = (typeof turnoEfectivoFila === 'function' && sec)
        ? String(turnoEfectivoFila(sec, fIdx) || '').trim().toUpperCase()
        : String((f.turno || '')).trim().toUpperCase();
    } catch (eT) {
      te = String((f.turno || '')).trim().toUpperCase();

   * En JEFES: true si la fila difiere de Cabina (turno, nombre o nota).
   */
  function _obtenerSeccionPorTitulo(data, pIdx, sIdx, tituloHint) {
    if (!data || !data.plantas || !data.plantas[pIdx]) return null;
    const secs = data.plantas[pIdx].secciones || [];
    let sec = secs[sIdx];
    const tit = _normTxt(tituloHint || (sec && sec.titulo) || '').toUpperCase();
    if (sec && _normTxt(sec.titulo).toUpperCase() === tit) return sec;
    if (tit) {
      return secs.find(function (s) { return _normTxt(s.titulo).toUpperCase() === tit; }) || sec || null;
    }
    return sec || null;
  }
  /** ¿La fila de Jefes difiere de la de Cabina en esta posición? */
  function filaDifiereDeOriginal(pIdx, sIdx, fIdx, filaActual) {
    if (!originalData || !editableData) return false;
    try {
      const secEdit = editableData.plantas?.[pIdx]?.secciones?.[sIdx];
      const titulo = _normTxt(secEdit?.titulo || originalData.plantas?.[pIdx]?.secciones?.[sIdx]?.titulo).toUpperCase();
      const secOrig = _obtenerSeccionPorTitulo(originalData, pIdx, sIdx, titulo);
      const orig = secOrig?.filas?.[fIdx];
      const act = filaActual || editableData.plantas?.[pIdx]?.secciones?.[sIdx]?.filas?.[fIdx];
      if (!orig) {
        return !!(
          _normTxt(act?.turno) ||
          _normTxt(act?.nombre) ||
          _normTxt(act?.nota)
        );
      }
      if (!act) {
        return !!(
          _normTxt(orig.turno) ||
          _normTxt(orig.nombre) ||
          _normTxt(orig.nota)
        );
      }
      if (_normTxt(orig.turno) !== _normTxt(act?.turno)) return true;
      if (_normTxt(orig.nombre) !== _normTxt(act?.nombre)) return true;
      if (titulo === 'NOVEDADES' && _normTxt(orig.nota) !== _normTxt(act?.nota)) return true;
      return false;
    } catch (e) {
      console.warn('filaDifiereDeOriginal', e);
      return false;
    }
  }
  /** En Cabina: hay diferencia con Jefes en esta celda */
  function filaDifiereEnCabina(pIdx, sIdx, fIdx, filaCabina) {
    if (!originalData || !editableData) return false;
    try {
      const secOrig = originalData.plantas?.[pIdx]?.secciones?.[sIdx];
      const titulo = _normTxt(secOrig?.titulo || '').toUpperCase();
      const secEdit = _obtenerSeccionPorTitulo(editableData, pIdx, sIdx, titulo);
      const edit = secEdit?.filas?.[fIdx];
      const cab = filaCabina || secOrig?.filas?.[fIdx];
      if (!edit && !cab) return false;
      if (!edit) {
        return !!(
          _normTxt(cab?.turno) ||
          _normTxt(cab?.nombre) ||
          _normTxt(cab?.nota)
        );
      }
      if (!cab) {
        return !!(
          _normTxt(edit.turno) ||
          _normTxt(edit.nombre) ||
          _normTxt(edit.nota)
        );
      }
      if (_normTxt(cab.turno) !== _normTxt(edit.turno)) return true;
      if (_normTxt(cab.nombre) !== _normTxt(edit.nombre)) return true;
      if (titulo === 'NOVEDADES' && _normTxt(cab.nota) !== _normTxt(edit.nota)) return true;
      return false;
    } catch (e) {
      return false;
    }
  }

  /** Mapa nombre → código de nota desde secciones NOVEDADES del data dado */
  function mapaCodigosNovedades(data) {
    const map = {};
    if (!data || !data.plantas) return map;
    (data.plantas || []).forEach(function (p) {
      (p.secciones || []).forEach(function (s) {
        if ((s.titulo || '').trim().toUpperCase() !== 'NOVEDADES') return;
        (s.filas || []).forEach(function (f) {
          const nom = (f.nombre || '').trim();
          if (!nom) return;
          const nota = String(f.nota || '').trim();
          if (nota) map[nom] = nota.slice(0, 3).toUpperCase();
          else if (map[nom] === undefined) map[nom] = ''; // está en novedades sin código
        });
      });
    });
    return map;
  }

  function nombreFueModificado(pIdx, sIdx, fIdx, nombreActual) {
    return filaDifiereDeOriginal(pIdx, sIdx, fIdx, { nombre: nombreActual, turno: '', nota: '' });
  }

  /** Copia la sección NOVEDADES de JEFES (editableData) hacia CABINA (originalData) */
  function sincronizarNovedadesDesdeJefes() {
    // Solo después de Registrar: NOVEDADES de Jefes se refleja en Cabina
    if (!editableData || !originalData) return;
    if (!originalBloqueado && !cierreFinalActivo) return;
    editableData.plantas.forEach(function (planta, pIdx) {
      (planta.secciones || []).forEach(function (sec, sIdx) {
        if ((sec.titulo || '').trim().toUpperCase() !== 'NOVEDADES') return;
        if (!originalData.plantas[pIdx]) return;
        let dest = originalData.plantas[pIdx].secciones[sIdx];
        if (!dest || (dest.titulo || '').trim().toUpperCase() !== 'NOVEDADES') {
          dest = (originalData.plantas[pIdx].secciones || []).find(function (s) {
            return (s.titulo || '').trim().toUpperCase() === 'NOVEDADES';
          });
        }
        if (!dest) return;
        dest.filas = JSON.parse(JSON.stringify(sec.filas));
      });
    });
  }

  /** Al mostrar CABINA, usar las filas de NOVEDADES de JEFES si existen */
  function dataParaRenderCabina() {
    const data = JSON.parse(JSON.stringify(originalData));
    // Después de Registrar: NOVEDADES de Cabina muestra lo de Jefes
    if (!editableData || (!originalBloqueado && !cierreFinalActivo)) return data;
    data.plantas.forEach(function (planta, pIdx) {
      (planta.secciones || []).forEach(function (sec, sIdx) {
        if ((sec.titulo || '').trim().toUpperCase() !== 'NOVEDADES') return;
        const secsJ = editableData.plantas?.[pIdx]?.secciones || [];
        let filasJefes = null;
        if (secsJ[sIdx] && (secsJ[sIdx].titulo || '').trim().toUpperCase() === 'NOVEDADES') {
          filasJefes = secsJ[sIdx].filas;
        } else {
          const sj = secsJ.find(function (s) {
            return (s.titulo || '').trim().toUpperCase() === 'NOVEDADES';
          });
          filasJefes = sj ? sj.filas : null;
        }
        if (filasJefes) {
          sec.filas = JSON.parse(JSON.stringify(filasJefes));
        }
      });
    });
    return data;
  }

  /** Navegación con flechas entre turno/nombre y filas */
  function enfocarSelectSeguro(sel) {
    if (!sel || sel.disabled) return false;
    try {
      sel.tabIndex = 0;
      sel.focus();
      // reforzar foco (algunos navegadores lo pierden tras re-render)
      setTimeout(function () {
        try { sel.focus(); } catch (e2) {}
      }, 0);
      return document.activeElement === sel || document.activeElement === sel;
    } catch (e) {
      return false;
    }
  }
  /** Lista flotante activa ligada a un <select> de turno/nombre */
  let _comboState = null; // { select, items, filtrados, idx }

  function selectListaAbierta(select) {
    if (!select) return false;
    const panel = document.getElementById('combo-flotante');
    return !!(select && _comboState && _comboState.select === select &&
      panel && panel.classList.contains('visible'));
  }

  function asegurarComboFlotante() {
    let el = document.getElementById('combo-flotante');
    if (el) return el;
    el = document.createElement('div');
    el.id = 'combo-flotante';
    el.innerHTML =
      '<input type="text" class="combo-busca" autocomplete="off" spellcheck="false" placeholder="Escribí para filtrar…">' +
      '<div class="combo-lista"></div>';
    document.body.appendChild(el);
    const busca = el.querySelector('.combo-busca');
    busca.addEventListener('input', function () {
      if (!_comboState) return;
      aplicarFiltroCombo(busca.value);
    });
    busca.addEventListener('keydown', function (e) {
      if (!_comboState) return;
      const key = e.key;
      // + / − con lista abierta: cerrar y agregar/quitar fila (Cabina)
      const esMenos = (key === '-' || key === 'Subtract' || key === 'Minus');
      const esMas = (key === '+' || key === 'Add' || (key === '=' && e.shiftKey));
      if ((esMenos || esMas) && typeof modo !== 'undefined' && modo === 'original') {
        const sel = _comboState.select;
        if (sel && !sel.disabled) {
          e.preventDefault();
          e.stopPropagation();
          const fila = sel.closest('.fila');
          if (fila) {
            const p = parseInt(fila.dataset.pIdx, 10);
            const s = parseInt(fila.dataset.sIdx, 10);
            const f = parseInt(fila.dataset.fIdx, 10);
            cerrarListaSelect(sel);
            if (esMas) {
              if (typeof pushUndo === 'function') pushUndo('agregar fila');
              if (typeof agregarFila === 'function') agregarFila(p, s, f);
            } else {
              const tSel = fila.querySelector('.turno-select');
              const nSel = fila.querySelector('.nombre-select');
              const tVacio = !(tSel && (tSel.value || '').trim());
              const nVacio = !(nSel && (nSel.value || '').trim());
              if (tVacio && nVacio && typeof quitarFila === 'function') quitarFila(p, s, f);
            }
          }
          return;
        }
      }
      if (key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        const sel = _comboState.select;
        cerrarListaSelect(sel);
        try { if (sel) sel.focus(); } catch (err) {}
        return;
      }
      if (key === 'ArrowDown') { e.preventDefault(); moverActivoCombo(1); return; }
      if (key === 'ArrowUp') { e.preventDefault(); moverActivoCombo(-1); return; }
      if (key === 'Enter') { e.preventDefault(); confirmarActivoCombo(); return; }
      if (key === 'Tab') {
        if (_comboState && _comboState.filtrados && _comboState.filtrados.length) {
          e.preventDefault();
          confirmarActivoCombo();
        } else {
          cerrarListaSelect(_comboState && _comboState.select);
        }
      }
    });
    el.addEventListener('mousedown', function (e) { e.stopPropagation(); });
    return el;
  }

  function cerrarListaSelect(select) {
    const panel = document.getElementById('combo-flotante');
    if (panel) {
      panel.classList.remove('visible');
      panel.style.display = 'none';
    }
    document.querySelectorAll('select.lista-abierta').forEach(function (s) {
      s.classList.remove('lista-abierta');

      s.style.position = '';
      s.style.zIndex = '';
    });
    _comboState = null;
  }

  function cerrarComboSiAfuera(e) {
    const panel = document.getElementById('combo-flotante');
    if (!panel || !panel.classList.contains('visible')) return;
    if (panel.contains(e.target)) return;
    if (_comboState && _comboState.select && (_comboState.select === e.target || _comboState.select.contains(e.target))) return;
    cerrarListaSelect(_comboState && _comboState.select);
  }

  if (!window._comboAfueraBound) {
    window._comboAfueraBound = true;
    document.addEventListener('mousedown', cerrarComboSiAfuera, true);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && _comboState) {
        const sel = _comboState.select;
        cerrarListaSelect(sel);
        try { if (sel) sel.focus(); } catch (err) {}
      }
    }, true);
  }

  function normFiltro(s) {
    return String(s || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .trim();
  }

  function aplicarFiltroCombo(texto) {
    if (!_comboState) return;
    const q = normFiltro(texto);
    const isTurno = _comboState.select && _comboState.select.classList.contains('turno-select');
    const src = _comboState.items || [];
    let list;
    if (!q) {
      list = src.slice();
    } else {
      list = [];
      let pendingGroup = null;
      src.forEach(function (it) {
        if (it.type === 'group') {
          pendingGroup = it;
          return;
        }
        let match = false;
        if (isTurno) {
          const v = normFiltro(it.value);
          match = !it.value ? false : (v.indexOf(q) === 0 || v === q || v.indexOf(q) >= 0);
        } else {
          match = normFiltro(it.value).indexOf(q) >= 0 || normFiltro(it.label).indexOf(q) >= 0;
        }
        if (match) {
          if (pendingGroup) {
            list.push(pendingGroup);
            pendingGroup = null;
          }
          list.push(it);
        }
      });
    }
    _comboState.filtrados = list;
    let idx = -1;
    for (let i = 0; i < list.length; i++) {
      if (list[i].type !== 'group') { idx = i; break; }
    }
    if (isTurno && q) {
      const exact = list.findIndex(function (it) {
        return it.type !== 'group' && normFiltro(it.value) === q;
      });
      if (exact >= 0) idx = exact;
    }
    _comboState.idx = idx;
    pintarListaCombo();
  }

  function pintarListaCombo() {
    const panel = document.getElementById('combo-flotante');
    if (!panel || !_comboState) return;
    const caja = panel.querySelector('.combo-lista');
    caja.innerHTML = '';
    const list = _comboState.filtrados || [];
    if (!list.length) {
      const vac = document.createElement('div');
      vac.className = 'combo-vacio';
      vac.textContent = 'Sin coincidencias';
      caja.appendChild(vac);
      return;
    }
    list.forEach(function (it, i) {
      if (it.type === 'group') {
        const g = document.createElement('div');
        g.className = 'combo-grupo';
        g.textContent = it.label || '';
        caja.appendChild(g);
        return;
      }
      const div = document.createElement('div');
      div.className = 'combo-item' + (i === _comboState.idx ? ' activo' : '') + (it.yaProg ? ' ya-prog' : '');
      div.textContent = it.label;
      div.title = (it.value || '') + (it.codProg ? (' · prog ' + it.codProg) : '');
      if (it.color) div.style.color = it.color;
      if (it.fontWeight) div.style.fontWeight = it.fontWeight;
      if (it.fontStyle) div.style.fontStyle = it.fontStyle;
      if (!it.fontWeight && !it.yaProg) div.style.fontWeight = '700';
      div.addEventListener('mousedown', function (e) {
        e.preventDefault();
        e.stopPropagation();
        _comboState.idx = i;
        confirmarActivoCombo();
      });
      caja.appendChild(div);
    });
    const activo = caja.querySelector('.combo-item.activo');
    if (activo && activo.scrollIntoView) {
      try { activo.scrollIntoView({ block: 'nearest' }); } catch (e) {}
    }
  }

  function moverActivoCombo(delta) {
    if (!_comboState || !_comboState.filtrados || !_comboState.filtrados.length) return;
    const list = _comboState.filtrados;
    const n = list.length;
    let idx = _comboState.idx;
    if (idx < 0) {
      if (delta >= 0) {
        for (let i = 0; i < n; i++) { if (list[i].type !== 'group') { idx = i; break; } }
      } else {
        for (let i = n - 1; i >= 0; i--) { if (list[i].type !== 'group') { idx = i; break; } }
      }
      if (idx < 0) return;
      _comboState.idx = idx;
      pintarListaCombo();
      return;
    }
    let steps = 0;
    while (steps < n) {
      idx = (idx + delta + n) % n;
      if (list[idx].type !== 'group') break;
      steps++;
    }
    _comboState.idx = idx;
    pintarListaCombo();
  }

  function confirmarActivoCombo() {
    if (!_comboState || !_comboState.select) return;
    const sel = _comboState.select;
    const list = _comboState.filtrados || [];
    let valor = '';
    const cur = (_comboState.idx >= 0 && list[_comboState.idx]) ? list[_comboState.idx] : null;
    if (cur && cur.type !== 'group') {
      valor = cur.value;
    } else {
      const onlyItems = list.filter(function (it) { return it.type !== 'group'; });
      if (onlyItems.length === 1) {
        valor = onlyItems[0].value;
      } else {
        const panel = document.getElementById('combo-flotante');
        const q = normFiltro(panel && panel.querySelector('.combo-busca') ? panel.querySelector('.combo-busca').value : '');
        const exact = (_comboState.items || []).find(function (it) {
          return it.type !== 'group' && normFiltro(it.value) === q;
        });
        if (exact) valor = exact.value;
        else return;
      }
    }
    const optExists = Array.from(sel.options).some(function (o) { return o.value === valor; });
    if (!optExists && valor) {
      const o = document.createElement('option');
      o.value = valor;
      o.textContent = valor;
      sel.appendChild(o);
    }
    sel.value = valor;
    try {
      const fila = sel.closest('.fila');
      if (fila && valor) {
        const p = parseInt(fila.dataset.pIdx, 10);
        const s = parseInt(fila.dataset.sIdx, 10);
        const f = parseInt(fila.dataset.fIdx, 10);
        const dest = (typeof modo !== 'undefined' && modo === 'original') ? originalData : editableData;
        if (dest && dest.plantas && dest.plantas[p] && dest.plantas[p].secciones[s] && dest.plantas[p].secciones[s].filas[f]) {
          if (sel.classList.contains('nombre-select')) dest.plantas[p].secciones[s].filas[f].nombre = valor;
          if (sel.classList.contains('turno-select')) dest.plantas[p].secciones[s].filas[f].turno = valor;
        }
      }
    } catch (eSet) {}
    if (sel.classList.contains('nombre-select')) {
      Array.from(sel.options).forEach(function (o) {
        if (!o.value) return;
        o.textContent = o.value + (o.getAttribute('data-ya-prog') === '1' && o.value !== valor ? '  ✓' : '');
        if (o.value === valor) o.textContent = o.value;
      });
    }
    confirmarSelectYSaltar(sel);
  }

  function posicionarCombo(select) {
    const panel = document.getElementById('combo-flotante');
    if (!panel || !select) return;
    const r = select.getBoundingClientRect();
    const isNombre = select.classList.contains('nombre-select');
    const isTurno = select.classList.contains('turno-select');
    if (isNombre) {
      // Nombres: panel alto de arriba a abajo
      const ancho = Math.min(Math.max(r.width, 300), Math.floor(window.innerWidth * 0.92));
      panel.style.minWidth = ancho + 'px';
      panel.style.width = ancho + 'px';
      let left = r.left;
      if (left + ancho > window.innerWidth - 8) left = Math.max(8, window.innerWidth - ancho - 8);
      if (left < 8) left = 8;
      panel.style.left = left + 'px';
      panel.style.top = '8px';
      panel.style.bottom = '8px';
      panel.style.maxHeight = 'none';
      panel.style.height = 'auto';
      return;
    }
    // CT: lista compacta bajo el casillero (pocos códigos)
    const ancho = Math.min(Math.max(r.width, 140), 220);
    panel.style.minWidth = ancho + 'px';
    panel.style.width = ancho + 'px';
    let left = r.left;
    if (left + ancho > window.innerWidth - 8) left = Math.max(8, window.innerWidth - ancho - 8);
    if (left < 8) left = 8;
    panel.style.left = left + 'px';
    panel.style.bottom = 'auto';
    const altoMax = Math.min(280, window.innerHeight - 16);
    const espacioAbajo = window.innerHeight - r.bottom - 8;
    if (espacioAbajo < 120 && r.top > espacioAbajo) {
      panel.style.top = Math.max(8, r.top - altoMax) + 'px';
      panel.style.maxHeight = Math.min(altoMax, r.top - 8) + 'px';
    } else {
      panel.style.top = (r.bottom + 4) + 'px';
      panel.style.maxHeight = Math.min(altoMax, Math.max(120, espacioAbajo)) + 'px';
    }
    panel.style.height = 'auto';
  }

  function abrirListaSelect(select) {
    if (!select || select.disabled) return;
    if (typeof puedeModificarTablero === 'function' && !puedeModificarTablero()) {
      return;
    }
    // CT y nombres: lista flotante (evita el salto nativo T→T3 del <select>)
    document.querySelectorAll('select.lista-abierta').forEach(function (s) {
      if (s !== select) {
        s.classList.remove('lista-abierta');
        try { s.size = 1; } catch (e) {}
        s.style.position = '';
        s.style.zIndex = '';
      }
    });
    const panel = asegurarComboFlotante();
    const items = [];
    function pushOption(o, grupo) {
      const ya = o.getAttribute('data-ya-prog') === '1';
      const codProg = o.getAttribute('data-turno-prog') || '';
      let label = '—';
      if (o.value) {
        label = o.value + (ya && o.value !== select.value ? '  ✓' : '');
      }
      items.push({
        type: 'item',
        value: o.value,
        label: label,
        yaProg: ya,
        codProg: codProg,
        color: o.style.color || '',
        fontWeight: o.style.fontWeight || '',
        fontStyle: o.style.fontStyle || '',
        grupo: grupo || ''
      });
    }
    Array.from(select.children).forEach(function (node) {
      if (node.tagName === 'OPTGROUP') {
        const glabel = node.label || '';
        items.push({ type: 'group', label: glabel, value: '', yaProg: false });
        Array.from(node.children).forEach(function (o) {
          if (o.tagName === 'OPTION') pushOption(o, glabel);
        });
      } else if (node.tagName === 'OPTION') {
        pushOption(node, '');
      }
    });
    _comboState = { select: select, items: items, filtrados: items.slice(), idx: 0 };
    const cur = select.value;
    let ix = 0;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type === 'item' && items[i].value === cur) { ix = i; break; }
    }
    if (items[ix] && items[ix].type === 'group') {
      for (let i = ix + 1; i < items.length; i++) {
        if (items[i].type === 'item') { ix = i; break; }
      }
    }
    _comboState.idx = ix;
    select.classList.add('lista-abierta');
    try { select.size = 1; } catch (e) {}
    posicionarCombo(select);
    panel.style.display = 'flex';
    panel.classList.add('visible');
    const busca = panel.querySelector('.combo-busca');
    busca.value = '';
    busca.placeholder = select.classList.contains('turno-select')
      ? 'Turno: T, TE, MS…'
      : 'Buscar cajero…';
    aplicarFiltroCombo('');
    setTimeout(function () {
      try { busca.focus(); busca.select(); } catch (e) {}
    }, 0);
  }

  function saltarTrasConfirmarSelect(select) {
    const fila = select.closest('.fila');
    if (!fila) return;
    const seccion = fila.closest('.seccion');
    const planta = seccion && seccion.closest('.planta');
    if (!planta || !seccion) return;
    const plantasEl = document.getElementById('plantas');
    const plantas = plantasEl ? Array.from(plantasEl.querySelectorAll('.planta')) : [];
    const p = plantas.indexOf(planta);
    const secciones = Array.from(planta.querySelectorAll('.seccion'));
    const s = secciones.indexOf(seccion);
    const filasDiv = seccion.querySelector('.filas') || fila.parentElement;
    const filas = Array.from(filasDiv.querySelectorAll(':scope > .fila'));
    const f = filas.indexOf(fila);
    const isTurno = select.classList.contains('turno-select');
    if (isTurno) {
      pendingFocusCelda = { p: p, s: s, f: f, campo: 'nombre', abrirLista: true };
      return;
    }
    // Nombre confirmado
    const secTit = String((seccion.querySelector('.titulo-seccion') && seccion.querySelector('.titulo-seccion').textContent) || seccion.dataset.titulo || '').trim().toUpperCase();
    // Detectar NOVEDADES por título de sección
    let esNovedades = false;
    try {
      const h = seccion.querySelector('h3, .seccion-titulo, .titulo');
      const tSec = String((h && h.textContent) || secTit || '').trim().toUpperCase();
      esNovedades = tSec.indexOf('NOVEDADES') >= 0;
    } catch (eN) {}
    if (!esNovedades) {
      try {
        esNovedades = !!(fila.querySelector('.nota-novedad'));
      } catch (e2) {}
    }

    // NOVEDADES: tras el nombre → casillero de código (derecha)
    if (esNovedades && select.classList.contains('nombre-select')) {
      pendingFocusCelda = { p: p, s: s, f: f, campo: 'nota', abrirLista: false };
      return;
    }

    // JEFES: cajero repetido → ir al casillero original (primera aparición)
    if (typeof modo !== 'undefined' && modo === 'editable' && select.classList.contains('nombre-select')) {
      const nom = (typeof normalizarNombreCelda === 'function')
        ? normalizarNombreCelda(select.value)
        : String(select.value || '').trim();
      if (nom && nom !== '—') {
        const orig = (typeof encontrarCasilleroOriginalNombre === 'function')
          ? encontrarCasilleroOriginalNombre(nom, fila)
          : null;
        if (orig) {
          pendingFocusCelda = {
            p: orig.p, s: orig.s, f: orig.f,
            campo: 'nombre', abrirLista: false, resaltarDup: true
          };
          return;
        }
      }
    }

    // Siempre ir al CT de la siguiente línea de ESTA caja (se crea vacía si hace falta)
    pendingFocusCelda = { p: p, s: s, f: f + 1, campo: 'turno', abrirLista: true };
  }

  /** Primera aparición de un nombre en el tablero (casillero original), excluyendo filaActual. */
  function encontrarCasilleroOriginalNombre(nom, filaActual) {
    const plantasEl = document.getElementById('plantas');
    if (!plantasEl || !nom) return null;
    const norm = (typeof normalizarNombreCelda === 'function')
      ? function (n) { return normalizarNombreCelda(n); }
      : function (n) { return String(n || '').trim(); };
    const target = norm(nom);
    const selects = plantasEl.querySelectorAll('select.nombre-select');
    for (let i = 0; i < selects.length; i++) {
      const sel = selects[i];
      const fila = sel.closest('.fila');
      if (!fila) continue;
      if (filaActual && fila === filaActual) continue;
      if (norm(sel.value) !== target) continue;
      const p = parseInt(fila.dataset.pIdx, 10);
      const s = parseInt(fila.dataset.sIdx, 10);
      const f = parseInt(fila.dataset.fIdx, 10);
      if (isNaN(p) || isNaN(s) || isNaN(f)) continue;
      return { p: p, s: s, f: f, sel: sel, fila: fila };
    }
    return null;
  }

  function aplicarPendingFocusCelda() {
    if (!pendingFocusCelda) return;
    const dest = pendingFocusCelda;
    const plantasEl = document.getElementById('plantas');
    if (!plantasEl) return;
    let fila = plantasEl.querySelector(
      '.fila[data-p-idx="' + dest.p + '"][data-s-idx="' + dest.s + '"][data-f-idx="' + dest.f + '"]'
    );
    if (!fila) {
      pendingFocusCelda = null;
      return;
    }
    let sel = null;
    if (dest.campo === 'nota') {
      sel = fila.querySelector('.nota-novedad');
      if (sel) {
        try {
          sel.focus();
          sel.select();
        } catch (e) {}
      }
      setTimeout(function () {
        if (pendingFocusCelda && pendingFocusCelda.campo === 'nota' &&
            pendingFocusCelda.p === dest.p && pendingFocusCelda.f === dest.f) {
          pendingFocusCelda = null;
        }
      }, 300);
      return;
    }
    sel = dest.campo === 'turno'
      ? fila.querySelector('.turno-select')
      : fila.querySelector('.nombre-select');
    if (!sel) {
      pendingFocusCelda = null;
      return;
    }
    try {
      sel.focus();
      sel.classList.add('foco-teclado');
      if (dest.resaltarDup) {
        try { sel.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (eS) {}
        // Titilar el casillero original (15 pulsos, mismo estilo amarillo)
        try {
          document.querySelectorAll('.resaltar-dup-origen').forEach(function (el) {
            el.classList.remove('resaltar-dup-origen');
          });
        } catch (eClr) {}
        try {
          // Reiniciar animación si ya estaba aplicada
          sel.classList.remove('resaltar-dup-origen');
          void sel.offsetWidth;
          sel.classList.add('resaltar-dup-origen');
          // 15 × 0.45s ≈ 6.75s
          setTimeout(function () {
            try { sel.classList.remove('resaltar-dup-origen'); } catch (eR) {}
          }, 7000);
        } catch (eAnim) {}
      }
    } catch (e) {}
    if (dest.abrirLista) {
      setTimeout(function () {
        if (typeof abrirListaSelect === 'function') abrirListaSelect(sel);
      }, 0);
      setTimeout(function () {
        if (typeof abrirListaSelect === 'function') abrirListaSelect(sel);
      }, 50);
    }
    setTimeout(function () {
      if (pendingFocusCelda && pendingFocusCelda.p === dest.p && pendingFocusCelda.f === dest.f && pendingFocusCelda.campo === dest.campo) {
        pendingFocusCelda = null;
      }
    }, 800);
  }

  function confirmarSelectYSaltar(select) {
    if (!select) return;
    saltarTrasConfirmarSelect(select);
    cerrarListaSelect(select);
    select.dispatchEvent(new Event('change', { bubbles: true }));
    setTimeout(aplicarPendingFocusCelda, 0);

  function onSelectClickConfirm(e, select) {

  }

  function navegarConEnter(e, select) {
    if (!e || e.key !== 'Enter') return;
    e.preventDefault();
    e.stopPropagation();
    if (typeof selectListaAbierta === 'function' && selectListaAbierta(select)) {
      if (typeof confirmarSelectYSaltar === 'function') confirmarSelectYSaltar(select);
      return;
    }
    // Lista cerrada: confirmar valor actual y saltar
    if (typeof confirmarSelectYSaltar === 'function') confirmarSelectYSaltar(select);
  }

  function navegarConFlechas(e, select) {
    if (selectListaAbierta(select)) return;
    const key = e.key;
    if (key !== 'ArrowUp' && key !== 'ArrowDown' && key !== 'ArrowLeft' && key !== 'ArrowRight') return;
    const fila = select.closest('.fila');
    if (!fila) return;
    const filasDiv = fila.parentElement;
    if (!filasDiv) return;
    const allFilas = Array.from(filasDiv.querySelectorAll(':scope > .fila'));
    const fi = allFilas.indexOf(fila);
    const isTurno = select.classList.contains('turno-select');
    e.preventDefault();
    e.stopPropagation();
    if (key === 'ArrowLeft') {
      if (!isTurno) enfocarSelectSeguro(fila.querySelector('.turno-select'));
      return;
    }
    if (key === 'ArrowRight') {
      if (isTurno) enfocarSelectSeguro(fila.querySelector('.nombre-select'));
      return;
    }
    const targetFi = key === 'ArrowUp' ? fi - 1 : fi + 1;
    if (targetFi < 0 || targetFi >= allFilas.length) {
      const seccion = fila.closest('.seccion');
      const planta = seccion && seccion.closest('.planta');
      if (!planta) return;
      const secciones = Array.from(planta.querySelectorAll(':scope > .seccion'));
      const si = secciones.indexOf(seccion);
      const nextSec = key === 'ArrowUp' ? secciones[si - 1] : secciones[si + 1];
      if (!nextSec) return;
      const nextFilas = Array.from(nextSec.querySelectorAll('.filas > .fila'));
      if (!nextFilas.length) return;
      const nf = key === 'ArrowUp' ? nextFilas[nextFilas.length - 1] : nextFilas[0];
      enfocarSelectSeguro(isTurno ? nf.querySelector('.turno-select') : nf.querySelector('.nombre-select'));
      return;
    }
    const nf = allFilas[targetFi];
    enfocarSelectSeguro(isTurno ? nf.querySelector('.turno-select') : nf.querySelector('.nombre-select'));
  }

  /** Clic simple abre lista flotante (sin expandir el select) */
  function activarDobleClick(select, onDouble) {
    // Compat: ya no usamos doble clic para abrir; el mousedown externo abre la lista.
    // Se mantiene por si algún camino lo invoca.
    select.addEventListener('mousedown', function (e) {
      if (select.disabled) return;
      if (selectListaAbierta(this)) return;
      // No prevenir aquí si hay otro handler; los handlers de render abren la lista
    });
  }



  function _filaTieneDatos(f) {
    if (!f) return false;
    if ((f.turno || '').trim() || (f.nombre || '').trim()) return true;
    if (f.nota && String(f.nota).trim()) return true;
    if (f.check) return true;
    if (Array.isArray(f.slots) && f.slots.some(function (v) { return !!v; })) return true;
    return false;
  }
  function compactarFilasUnaVacia(data) {
    if (!data || !data.plantas) return data;
    (data.plantas || []).forEach(function (p) {
      (p.secciones || []).forEach(function (sec) {
        const esNov = ((sec.titulo || '').trim().toUpperCase() === 'NOVEDADES');
        const vacia = esNov
          ? { turno: '', nombre: '', nota: '' }
          : { turno: '', nombre: '', check: false, slots: [] };
        const occ = (sec.filas || []).filter(_filaTieneDatos);
        sec.filas = occ.concat([JSON.parse(JSON.stringify(vacia))]);
      });
    });
    return data;
  }

        if (sec && Array.isArray(sec.filas) && pendingFocusCelda.f >= sec.filas.length) {

  function quitarFila(pIdx, sIdx, fIdx, opts) {

    // Foco en el código de turno de la fila que queda en ese índice (la siguiente),
    // o la anterior si se borró la última.
    const nuevoF = Math.min(fIdx, filas.length - 1);
    pendingFocusCelda = { p: pIdx, s: sIdx, f: nuevoF, campo: 'turno', abrirLista: false };
    if (modo === 'original') {
      originalData = datos;
      render(dataParaRenderCabina(), true);
    } else {
      editableData = datos;
      sincronizarNovedadesDesdeJefes();
      render(editableData, hojaJefesEditable());
    }
  }
  function capturarDatosActuales() {
    /* Antes de leer el DOM: deshacer revelados (gris/color) para no grabar el nombre alterno */
    try {
      if (typeof restaurarTodosReveladosJefes === 'function') restaurarTodosReveladosJefes();
    } catch (eRev) {}
    /* vispera se adjunta al final del objeto */
    const plantas = [];
    document.querySelectorAll('.planta').forEach(plantaEl => {
      const secciones = [];
      plantaEl.querySelectorAll('.seccion').forEach(secEl => {
        const filas = [];
        const tituloSec = secEl.querySelector('.seccion-titulo span').textContent;
        secEl.querySelectorAll('.fila').forEach(filaEl => {
          const checkInput = filaEl.querySelector('input[type="checkbox"]');
          const notaInput = filaEl.querySelector('input.nota-novedad');
          const prevData = (modo === 'editable' ? editableData : originalData);
          let prevSlots = null;
          let prevNota = '';
          let prevCheck = false;
          try {
            const pf = prevData?.plantas?.[plantas.length]?.secciones?.[secciones.length]?.filas?.[filas.length];
            if (pf) {
              prevSlots = pf.slots;
              prevNota = pf.nota || '';
              prevCheck = !!pf.check;
            }
          } catch (e) {}
          const nSlots = getSlotConfig().numSlots;
          if (tituloSec === 'NOVEDADES') {
            const selNov = filaEl.querySelector('.nombre-select');
            let nomRawNov = '';
            if (selNov) {
              if (selNov.dataset && selNov.dataset.toggleOrigVal !== undefined) {
                nomRawNov = selNov.dataset.toggleOrigVal;
              } else {
                nomRawNov = selNov.value;
              }
            }
            const nomCapNov = (typeof normalizarNombreCelda === 'function')
              ? normalizarNombreCelda(nomRawNov)
              : String(nomRawNov || '').trim();
            filas.push({
              turno: filaEl.querySelector('.turno-select').value,
              nombre: nomCapNov === '—' ? '' : nomCapNov,
              nota: notaInput ? notaInput.value.slice(0, 3) : (prevNota || ''),
              slots: Array.isArray(prevSlots) ? prevSlots : Array(nSlots).fill(0)
            });
          } else {
            const selNomCap = filaEl.querySelector('.nombre-select');
            // Si quedó revelado el alterno, preferir el valor real guardado en data-
            let nomRaw = '';
            if (selNomCap) {
              const vis = String(selNomCap.value || '').trim();
              if (vis && vis !== '—') {
                nomRaw = vis;
              } else if (selNomCap.dataset && selNomCap.dataset.toggleOrigVal !== undefined) {
                nomRaw = selNomCap.dataset.toggleOrigVal;
              } else {
                nomRaw = selNomCap.value;
              }
            }
            const nomCap = (typeof normalizarNombreCelda === 'function')
              ? normalizarNombreCelda(nomRaw)
              : (String(nomRaw || '').trim() === '—' ? '' : String(nomRaw || '').trim());
            let prevTemprano = false;
            try {
              const pf = prevData?.plantas?.[plantas.length]?.secciones?.[secciones.length]?.filas?.[filas.length];
              if (pf) prevTemprano = !!pf.temprano;
            } catch (eT) {}
            filas.push({
              turno: filaEl.querySelector('.turno-select').value,
              nombre: nomCap,
              check: nomCap ? (checkInput ? checkInput.checked : prevCheck) : false,
              // ET solo vive en datos/registros (no en UI del tablero)
              temprano: !!(nomCap && prevTemprano),
              slots: Array.isArray(prevSlots) ? prevSlots : Array(nSlots).fill(0)
            });
          }
        });
        secciones.push({
          titulo: tituloSec,
          filas
        });
      });
      const headerEl = plantaEl.querySelector('.planta-header');
      const nombreLimpio = headerEl.getAttribute('data-nombre')
        || (headerEl.textContent || '').split('▼')[0].split('▲')[0].replace(/horarios.*/i, '').trim();
      plantas.push({
        nombre: nombreLimpio,
        secciones
      });
    });
    const prevMeta = (modo === 'editable' ? editableData : originalData) || {};
    const out = {
      fecha: document.getElementById('fecha').value,
      turno: document.getElementById('turno-display').value,
      visperaFeriado: !!visperaFeriado,
      cierreFinal: !!cierreFinalActivo,
      plantas
    };
    // Conservar campos de texto que no viven en el DOM de plantas
    if (prevMeta.resumenJornada) out.resumenJornada = prevMeta.resumenJornada;
    if (prevMeta.informeTexto != null && String(prevMeta.informeTexto).length) {
      out.informeTexto = String(prevMeta.informeTexto);
    } else if (typeof _leerInformeTextoFecha === 'function') {
      const it = _leerInformeTextoFecha();
      if (it) out.informeTexto = it;
    }
    return out;
  }

  /** Asegura VENTA DE TICKETS en PLANTA BAJA (entre CASTITO y POKER) */
  function asegurarVentaTicketsPlantaBaja(data) {
    if (!data || !data.plantas) return;
    data.plantas.forEach(function (p) {
      if (limpiarNombrePlanta(p.nombre) !== 'PLANTA BAJA') return;
      const secs = p.secciones || [];
      const ya = secs.some(function (s) { return (s.titulo || '').trim().toUpperCase() === 'VENTA DE TICKETS'; });
      if (ya) return;
      const idxPoker = secs.findIndex(function (s) { return (s.titulo || '').trim().toUpperCase() === 'POKER'; });
      const nueva = {
        titulo: 'VENTA DE TICKETS',
        filas: Array(5).fill(null).map(function () { return { turno: '', nombre: '', check: false }; })
      };
      if (idxPoker >= 0) secs.splice(idxPoker, 0, nueva);
      else secs.push(nueva);
      p.secciones = secs;
    });
  }

    const claveFecha = normalizarFechaClave(fechaStr);

  /** Mezcla un array (Fisher–Yates) */
  function mezclarArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

   * Asi, al reprogramar el mismo dia, el listado se vuelve a sortear de verdad.

  function invalidarOrdenAzarFecha(fechaStr) {
    try {
      // Al reprogramar, lo mas seguro es resetear todo el orden azar de la sesion:
      // las keys mezclan formatos (ISO y texto) y un match parcial puede fallar.
      window._tableroOrdenAzar = {};

    } catch (e) {
      try { window._tableroOrdenAzar = {}; } catch (e3) {}

  /** Busca en el historial la plantilla del 1 de septiembre (día 1/9) para un turno */
  function obtenerPlantilla1Sep(turnoNorm) {
    const t = (turnoNorm || 'TARDE').trim().toUpperCase();
    let encontrada = null;
    (historial || []).forEach(reg => {
      if ((reg.turno || '').trim().toUpperCase() !== t) return;
      const d = parseFechaHistorial(reg.fecha);
      if (!d) return;
      // 1 de septiembre (mes 8 en JS)
      if (d.getDate() === 1 && d.getMonth() === 8) {
        if (reg.original) encontrada = reg.original;
        else if (reg.editable) encontrada = reg.editable;
      }
    });
    return encontrada ? JSON.parse(JSON.stringify(encontrada)) : null;
  }

  /**
   * A partir de una plantilla (ej. 1/9), mantiene turnos y cantidad de empleados
   * por caja; solo reordena al azar los nombres. NOVEDADES vacío.
   */
  /**
   * A partir de una plantilla (ej. 1/9), mantiene la estructura de turnos/puestos
   * y asigna SOLO empleados de la lista activa (nombresPermitidos).
   * poolExterno: array ya barajado compartido (para repartir TARDE/NOCHE sin repetir).
   * offset: índice inicial dentro de poolExterno.
   */
  function barajarUbicacionesDesdePlantilla(plantilla, fechaNueva, turnoNorm, poolExterno, offset) {
    const datos = JSON.parse(JSON.stringify(plantilla));
    datos.fecha = fechaNueva;
    datos.turno = turnoNorm;

    // Recolectar puestos de la plantilla (excepto NOVEDADES)
    const slots = [];
    (datos.plantas || []).forEach((planta, pIdx) => {
      (planta.secciones || []).forEach((sec, sIdx) => {
        const tit = (sec.titulo || '').trim().toUpperCase();
        if (tit === 'NOVEDADES') {
          (sec.filas || []).forEach(f => {
            f.turno = '';
            f.nombre = '';
            if ('nota' in f) f.nota = '';
            if ('check' in f) f.check = false;
            if (Array.isArray(f.slots)) f.slots = f.slots.map(() => 0);
          });
          return;
        }
        (sec.filas || []).forEach((f, fIdx) => {
          // Conservar puestos que en la plantilla tenían persona o turno
          if ((f.nombre || '').trim() || (f.turno || '').trim()) {
            slots.push({ pIdx: pIdx, sIdx: sIdx, fIdx: fIdx, turno: f.turno || '' });
          }
        });
      });
    });

    // Pool = lista de empleados (sin la opción vacía)
    let pool;
    let start = 0;
    if (Array.isArray(poolExterno) && poolExterno.length) {
      pool = poolExterno;
      start = Math.max(0, offset || 0);
    } else {
      pool = mezclarArray(
        (nombresPermitidos || [])
          .map(function (x) { return String(x || '').trim(); })
          .filter(function (x) { return !!x; })
      );
      start = 0;
    }

    let asignados = 0;
    for (let i = 0; i < slots.length; i++) {
      const sl = slots[i];
      const f = datos.plantas[sl.pIdx].secciones[sl.sIdx].filas[sl.fIdx];
      const idxPool = start + i;
      if (idxPool < pool.length) {
        f.nombre = pool[idxPool];
        f.turno = sl.turno;
        asignados++;
      } else {
        // Sin más empleados en la lista: puesto vacío (no entra en la programación)
        f.nombre = '';
        f.turno = '';
      }
      if ('check' in f) f.check = false;
      if ('nota' in f) f.nota = '';
      if (Array.isArray(f.slots)) f.slots = f.slots.map(function () { return 0; });
    }

    return { datos: datos, asignados: asignados, nextOffset: start + slots.length };
  }

  /**
   * Sorteo desde plantilla 1/9 — solo Cabina desbloqueada y turno TARDE.
   * Aplica TARDE y NOCHE a la vez. JEFES queda vacío.
   */
  async function completarTurnosAlAzar() {
    if (!(await exigirPrivilegio('Autorización para sortear'))) return;
    if (modo !== 'original' || originalBloqueado) {
      alert('Solo se puede usar en Cabina desbloqueada, al crear un archivo nuevo (antes de Registrar).');
      return;
    }
    const turnoVista = ((document.getElementById('turno-display')?.value) || 'TARDE').trim().toUpperCase();
    if (turnoVista === 'NOCHE') {
      alert('El sorteo se hace desde el turno TARDE (completa TARDE y NOCHE a la vez).');
      return;
    }

    const plantillaTarde = obtenerPlantilla1Sep('TARDE');
    const plantillaNoche = obtenerPlantilla1Sep('NOCHE');
    if (!plantillaTarde && !plantillaNoche) {
      alert('No encontré la programación del 1/9 (1 de septiembre) en el historial.\nGuardá antes esa fecha para usarla como plantilla del sorteo.');
      return;
    }
    if (!plantillaTarde || !plantillaNoche) {
      const falta = !plantillaTarde ? 'TARDE' : 'NOCHE';
      if (!confirm('Falta la plantilla del 1/9 para ' + falta + '.\n¿Sortear solo el turno que sí está?')) return;
    } else {
      if (!confirm('¿Sortear ubicaciones según el 1/9?\n\n• Estructura de turnos de la plantilla\n• Solo personas de la lista de empleados (👥)\n• TARDE y NOCHE sin repetir la misma persona\n• JEFES queda vacío')) return;
    }

    const fechaActual = (originalData && originalData.fecha) ||
      document.getElementById('fecha')?.value || 'Sin fecha';

    // Solo los de la lista activa entran al sorteo
    const poolLista = (nombresPermitidos || [])
      .map(function (x) { return String(x || '').trim(); })
      .filter(function (x) { return !!x; });
    if (!poolLista.length) {
      alert('La lista de empleados está vacía.\nAgregá nombres con el botón 👥 antes de sortear.');
      return;
    }
    try { if (typeof invalidarOrdenAzarFecha === 'function') invalidarOrdenAzarFecha(fechaActual); } catch (eAz) {}
    // Forzar pool totalmente nuevo (no reutilizar orden previo de la fecha)
    const pool = mezclarArray(poolLista.slice());

    cacheFecha = cacheFecha || {};
    let msg = '✅ Sorteo según plantilla 1/9 (solo lista de empleados: ' + pool.length + ').\n';
    let offset = 0;

    if (plantillaTarde) {
      const res = barajarUbicacionesDesdePlantilla(plantillaTarde, fechaActual, 'TARDE', pool, offset);
      offset = res.nextOffset;
      cacheFecha['TARDE'] = {
        original: res.datos,
        editable: crearEstructuraVacia(fechaActual, 'TARDE'),
        bloqueado: false
      };
      msg += 'TARDE: ' + res.asignados + ' empleados\n';
    }
    if (plantillaNoche) {
      const res = barajarUbicacionesDesdePlantilla(plantillaNoche, fechaActual, 'NOCHE', pool, offset);
      offset = res.nextOffset;
      cacheFecha['NOCHE'] = {
        original: res.datos,
        editable: crearEstructuraVacia(fechaActual, 'NOCHE'),
        bloqueado: false
      };
      msg += 'NOCHE: ' + res.asignados + ' empleados\n';
    }
    if (offset > pool.length) {
      msg += '\n⚠ Había más puestos en la plantilla que personas en la lista; los sobrantes quedaron vacíos.';
    }

    // Mostrar TARDE tras el sorteo
    if (cacheFecha['TARDE']) {
      originalData = JSON.parse(JSON.stringify(cacheFecha['TARDE'].original));
      editableData = JSON.parse(JSON.stringify(cacheFecha['TARDE'].editable));
    } else if (cacheFecha['NOCHE']) {
      originalData = JSON.parse(JSON.stringify(cacheFecha['NOCHE'].original));
      editableData = JSON.parse(JSON.stringify(cacheFecha['NOCHE'].editable));
    }
    originalBloqueado = false;
    modo = 'original';
    const td = document.getElementById('turno-display');
    if (td && cacheFecha['TARDE']) td.value = 'TARDE';
    render(dataParaRenderCabina(), true);
    msg += 'JEFES vacío. NOVEDADES vacío.';
    alert(msg);
  }

            const registro = {
              id: Date.now() + (tu === 'NOCHE' ? 1 : 0),
              fecha: (edit && edit.fecha) || (orig && orig.fecha) || (editableData && editableData.fecha) || (originalData && originalData.fecha),
              turno: tu,
              original: JSON.parse(JSON.stringify(orig || {})),
              editable: JSON.parse(JSON.stringify(edit || orig || {})),
              bloqueado: false,
              fechaGuardado: new Date().toLocaleString('es-AR')
            };
            const idxExistente = historial.findIndex(function (reg) {
              return normalizarFechaClave(reg.fecha) === normalizarFechaClave(registro.fecha) &&
                (reg.turno || '').trim().toUpperCase() === tu;
            });
            if (idxExistente >= 0) historial.splice(idxExistente, 1);
            historial.unshift(registro);
          });
          localStorage.setItem('tablero_historial', JSON.stringify(historial));
          localStorage.setItem('tablero_cache_turnos', JSON.stringify(cacheFecha || {}));
        } catch (eH) { console.warn(eH); }
        cambiosSinGuardar = false;
        try { if (typeof actualizarIndicadorBorrador === 'function') actualizarIndicadorBorrador(); } catch (eI) {}
        try { registrarAuditoria('guardar_provisorio', 'Guardó borrador provisorio'); } catch (eA) {}
        try { if (typeof marcarJefeTrabajoFecha === 'function') marcarJefeTrabajoFecha(); } catch (eJ) {}
        alert('✅ Guardado.\nFecha: ' + ((editableData && editableData.fecha) || (originalData && originalData.fecha) || '') + '\n\nQueda en este teléfono al salir o cambiar de turno.');
        return;
      }

      const turnoActual = (
        (modo === 'editable' && editableData && editableData.turno) ||
        (originalData && originalData.turno) ||
        document.getElementById('turno-display')?.value ||
        'TARDE'
      ).toString().trim().toUpperCase();

      if (modo === 'editable') {
        if (!editableData && !accesoLibre && cierreFinalActivo) {
          alert('No se puede guardar: cierre final activo.');
          return;
        }
        editableData = capturarDatosActuales();
        editableData.visperaFeriado = !!visperaFeriado;
        if (originalData) originalData.visperaFeriado = !!visperaFeriado;
        sincronizarNovedadesDesdeJefes();
      } else {
        // CABINA: capturar si está desbloqueada; si está bloqueada, guarda el estado actual en memoria
        if (!originalBloqueado) {
          originalData = capturarDatosActuales();
        }
        if (originalData) {
          originalData.visperaFeriado = !!visperaFeriado;
          originalData.turno = turnoActual;
        }
        if (editableData) editableData.visperaFeriado = !!visperaFeriado;
      }

      if (!originalData) {
        alert('No hay datos para guardar.');
        return;
      }

      // Limpiar / propagar flag de cierre
      if (!cierreFinalActivo) {
        if (originalData) originalData.cierreFinal = false;
        if (editableData) editableData.cierreFinal = false;
      } else {
        if (originalData) originalData.cierreFinal = true;
        if (editableData) editableData.cierreFinal = true;
      }

      // Si aún no hay hoja Jefes, usar copia de Cabina para el historial
      const editableParaGuardar = editableData
        ? JSON.parse(JSON.stringify(editableData))
        : JSON.parse(JSON.stringify(originalData));

      cacheFecha[turnoActual] = {
        original: JSON.parse(JSON.stringify(originalData)),
        editable: editableParaGuardar,
        bloqueado: !!originalBloqueado || !!cierreFinalActivo,
        cierreFinal: !!cierreFinalActivo
      };

      if (!Array.isArray(historial)) historial = [];
      const claveFecha = normalizarFechaClave(originalData.fecha || editableParaGuardar.fecha);

      // Completar el otro turno desde historial si no está en cache
      ['TARDE', 'NOCHE'].forEach(t => {
        if (cacheFecha[t] && cacheFecha[t].editable) return;
        const reg = historial.find(r =>
          normalizarFechaClave(r.fecha) === claveFecha &&
          (r.turno || '').trim().toUpperCase() === t
        );
        if (reg) {
          const cierreReg = !!(reg.editable && reg.editable.cierreFinal) ||
            !!(reg.original && reg.original.cierreFinal);
          const cierreFinalPack = cierreReg || !!cierreFinalActivo;
          const orig = JSON.parse(JSON.stringify(reg.original));
          const edit = JSON.parse(JSON.stringify(reg.editable || reg.original));
          if (cierreFinalActivo) {
            if (orig) orig.cierreFinal = true;
            if (edit) edit.cierreFinal = true;
          }
          cacheFecha[t] = {
            original: orig,
            editable: edit,
            bloqueado: inferirBloqueadoDesdeReg(reg) || cierreFinalPack,
            cierreFinal: cierreFinalPack
          };
        }
      });

      const turnosAGuardar = [];
      ['TARDE', 'NOCHE'].forEach(t => {
        if (cacheFecha[t] && (cacheFecha[t].editable || cacheFecha[t].original)) turnosAGuardar.push(t);
      });
      if (!turnosAGuardar.length) turnosAGuardar.push(turnoActual);

      const guardados = [];
      turnosAGuardar.forEach(t => {
        const pack = cacheFecha[t];
        if (!pack) return;
        const edit = pack.editable || pack.original;
        const orig = pack.original || pack.editable;
        if (!edit && !orig) return;
        const registro = {
          id: Date.now() + (t === 'NOCHE' ? 1 : 0),
          fecha: (edit && edit.fecha) || (orig && orig.fecha) || originalData.fecha,
          turno: t,
          original: JSON.parse(JSON.stringify(orig)),
          editable: JSON.parse(JSON.stringify(edit)),
          bloqueado: !!pack.bloqueado,
          fechaGuardado: new Date().toLocaleString('es-AR')
        };
        const idxExistente = historial.findIndex(reg =>
          normalizarFechaClave(reg.fecha) === normalizarFechaClave(registro.fecha) &&
          (reg.turno || '').trim().toUpperCase() === t
        );
        if (idxExistente >= 0) historial.splice(idxExistente, 1);
        historial.unshift(registro);
        guardados.push(t);
      });

      localStorage.setItem('tablero_historial', JSON.stringify(historial));
      try {
        if (editableData) localStorage.setItem('tablero_editable', JSON.stringify(editableData));
        localStorage.setItem('tablero_original', JSON.stringify(originalData));
      } catch (e) {}
      try { if (typeof guardarUltimaVista === 'function') guardarUltimaVista(); } catch (eUv) {}
      cambiosSinGuardar = false;
      // Al guardar: bloquear deshacer/rehacer (se reinicia el historial de edición)
      try {
        undoStack = [];
        redoStack = [];
        if (typeof actualizarBotonesUndo === 'function') actualizarBotonesUndo();
      } catch (e) {}
      try {
        const fk = normalizarFechaClave(originalData.fecha);
        if (fk && borradoresPorFecha[fk]) {
          delete borradoresPorFecha[fk];
          localStorage.setItem('tablero_borradores', JSON.stringify(borradoresPorFecha));
        }
      } catch (e) {}
      actualizarIndicadorBorrador();
      const hoja = modo === 'editable' ? 'JEFES' : 'CABINA';
try { registrarAuditoria('guardar', 'Guardó historial (' + hoja + '). Turnos: ' + guardados.join(' + ')); } catch (eA) {}
      alert('✅ Guardado en el Historial (' + hoja + ').\nFecha: ' + (originalData.fecha || '') + '\nTurnos: ' + guardados.join(' + '));
      actualizarSliderFecha();
    } catch (err) {
      alert('Error al guardar:\n' + err.message);
      console.error(err);
    }
  }

  function exportarAuditoriaCSV() {
    try {
      const lista = cargarAuditoria();
      if (!lista.length) { alert('No hay eventos para exportar.'); return; }
      const sep = ';';
      const headers = ['ts','tsLocal','user','rol','accion','detalle','fechaTablero','turno','hoja'];
      const lines = [headers.join(sep)];
      lista.forEach(function (e) {
        lines.push(headers.map(function (h) {
          let v = e[h] == null ? '' : String(e[h]);
          if (v.indexOf(sep) >= 0 || v.indexOf('"') >= 0) v = '"' + v.replace(/"/g, '""') + '"';
          return v;
        }).join(sep));
      });
      const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'auditoria-tablero-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      registrarAuditoria('auditoria_export', 'Exportó CSV (' + lista.length + ' eventos)');
    } catch (e) {
      alert('Error al exportar: ' + (e && e.message ? e.message : e));
    }
  }

  function hashClaveSimple(s) {
    s = String(s || '');
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return 'h' + (h >>> 0).toString(16);
  }

  /**
   * Exige privilegio: sesión activa de usuario autorizado, o admin 1318.
   * Usado en operaciones restringidas (sorteo, lista, cierre, nuevo, desbloquear…).
   * Devuelve Promise<boolean>
   */
  async function exigirPrivilegio(mensaje) {
    if (!sesionActual) cargarSesion();
    if (sesionActual && sesionActual.user) return true;

    const datos = await promptLogin(mensaje || 'Autorización requerida');
    if (!datos) return false;
    const user = (datos.user || '').trim();
    const pass = String(datos.pass || '');

    // Admin maestro: usuario vacío o "admin" + 1318, o solo 1318 en clave con usuario admin
    if (pass.trim() === CLAVE_ADMIN_MAESTRO &&
        (!user || user.toLowerCase() === 'admin' || user === CLAVE_ADMIN_MAESTRO)) {
      window._aplicarVistaRolPendiente = true;
      guardarSesion({ user: 'admin', esAdmin: true, puedeCierreFinal: true, ts: Date.now() });
      return true;
    }
    // También aceptar solo clave 1318 si dejaron usuario vacío
    if (!user && pass.trim() === CLAVE_ADMIN_MAESTRO) {
      window._aplicarVistaRolPendiente = true;
      guardarSesion({ user: 'admin', esAdmin: true, puedeCierreFinal: true, ts: Date.now() });
      return true;
    }

    const lista = cargarUsuarios();
    const found = lista.find(function (u) {
      return (u.user || '').toLowerCase() === user.toLowerCase();
    });
    if (!found) {
      alert('❌ Usuario o clave incorrectos.');
      return false;
    }
    if (found.hash !== hashClaveSimple(pass)) {
      alert('❌ Usuario o clave incorrectos.');
      return false;
    }
    if (found.mustChange) {
      const nueva = await promptCambioClave(found.user);
      if (!nueva) return false;
      found.hash = hashClaveSimple(nueva);
      found.mustChange = false;
      found.changedAt = new Date().toISOString();
      guardarUsuarios(lista);
      alert('✅ Clave actualizada. Ya podés usar las funciones restringidas.');
    }
    const esCabina = !!(found.puedeCabina || found.puedeCierreFinal);
    window._aplicarVistaRolPendiente = true;
    guardarSesion({
      user: found.user,
      esAdmin: false,
      puedeCabina: esCabina,
      puedeCierreFinal: esCabina,
      ts: Date.now()
    });
    return true;
  }

  /**
   * Solo administrador (sesión admin o login con 1318).
   * Usado para: lista de empleados, exportar/importar respaldo, gestionar usuarios.
   */
  async function exigirAdmin(mensaje) {
    if (!sesionActual) cargarSesion();
    if (sesionActual && sesionActual.esAdmin) return true;

    // Si hay sesión de usuario normal, no alcanza
    if (sesionActual && sesionActual.user && !sesionActual.esAdmin) {
      alert('Esta acción es solo para el administrador.\nSi tenés una sesión abierta, cerrala e iniciá sesión con una cuenta autorizada para esto.');
      return false;
    }

    const datos = await promptLogin(mensaje || 'Solo administrador');
    if (!datos) return false;
    const user = (datos.user || '').trim();
    const pass = String(datos.pass || '');
    if (pass.trim() === CLAVE_ADMIN_MAESTRO &&
        (!user || user.toLowerCase() === 'admin' || user === CLAVE_ADMIN_MAESTRO)) {
      guardarSesion({ user: 'admin', esAdmin: true, puedeCierreFinal: true, ts: Date.now() });
      return true;
    }
    if (!user && pass.trim() === CLAVE_ADMIN_MAESTRO) {
      guardarSesion({ user: 'admin', esAdmin: true, puedeCierreFinal: true, ts: Date.now() });
      return true;
    }
    // Un usuario normal no puede elevarse a admin
    alert('❌ No tenés permiso para esta acción.\nSolo el administrador puede realizarla.');
    return false;
  }

  function pedirClave1318(mensaje) {

  function _limpiarCierreFinalEnFechaActual() {
    const fecha = (originalData && originalData.fecha) || (editableData && editableData.fecha) ||
      (document.getElementById('fecha') && document.getElementById('fecha').value) || '';
    const clave = (fecha && typeof normalizarFechaClave === 'function')
      ? normalizarFechaClave(fecha) : String(fecha || '');

    cierreFinalActivo = false;
    accesoLibre = true;
    if (originalData) originalData.cierreFinal = false;
    if (editableData) editableData.cierreFinal = false;

    cacheFecha = cacheFecha || {};
    ['TARDE', 'NOCHE'].forEach(function (tn) {
      if (!cacheFecha[tn]) return;
      cacheFecha[tn].cierreFinal = false;
      try {
        if (cacheFecha[tn].original) cacheFecha[tn].original.cierreFinal = false;
        if (cacheFecha[tn].editable) cacheFecha[tn].editable.cierreFinal = false;
      } catch (e) {}
    });

    // Historial: si queda cierreFinal, hayCierreFinalVista() lo vuelve a activar
    if (clave && Array.isArray(historial)) {
      historial.forEach(function (reg) {
        if (!reg) return;
        const sameF = (typeof normalizarFechaClave === 'function')
          ? normalizarFechaClave(reg.fecha) === clave
          : reg.fecha === fecha;
        if (!sameF) return;
        reg.cierreFinal = false;
        try {
          if (reg.original) reg.original.cierreFinal = false;
          if (reg.editable) reg.editable.cierreFinal = false;
        } catch (e) {}
      });
      try {
        if (typeof persistirHistorial === 'function') persistirHistorial();
        else if (typeof guardarHistorialEnStorage === 'function') guardarHistorialEnStorage();
      } catch (eP) {}
    }
  }

  async function desbloquearOriginal() {
    if (!(await exigirCierreFinal('Autorización para desbloquear'))) return;

    const habiaCierre = !!(

      (originalData && originalData.cierreFinal) ||
      (editableData && editableData.cierreFinal) ||
      (typeof hayCierreFinalVista === 'function' && hayCierreFinalVista())
    );

    if (habiaCierre) {
      // Levantar cierre final por error: volver a editar Cabina y Jefes
      _limpiarCierreFinalEnFechaActual();
      edicionTrasDesbloqueoCierre = true;
      // Sigue "registrada" para no pisar Jefes, pero ambas hojas editables
      originalBloqueado = true;

      return;
    }

    // Sin cierre: desbloquear Cabina para reeditar (antes de volver a Registrar)
    edicionTrasDesbloqueoCierre = false;
    originalBloqueado = false;
    cierreFinalActivo = false;
    accesoLibre = true;
    ['TARDE', 'NOCHE'].forEach(function (tn) {
      if (!cacheFecha[tn]) return;
      cacheFecha[tn].bloqueado = false;
      cacheFecha[tn].cierreFinal = false;

    try { registrarAuditoria('desbloquear_cabina', 'Desbloqueó Cabina (sin cierre final)'); } catch (eA) {}
